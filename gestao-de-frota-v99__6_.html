function renderListaViagensCarga(lista){
  if(!lista.length) return `<div class="card"><div class="empty">Sem viagens nesta categoria.</div></div>`;
  const moduloKey = 'camioes_'+camioesFiltro;
  const grupos = aoAplicar(lista, moduloKey, CAMIOES_AO_CONFIG);
  const thead = `<tr><th>Camião/Cabeça</th><th>Trela</th><th>Motorista(s)</th><th>Data</th><th>Itens de carga</th><th>Estado</th><th></th></tr>`;
  const linha = v=>{
    const vt=getViatura(v.viaturaId); const st=statusViagemCargaInfo(v);
    const trelas=(v.trelaIds||[]).map(getViatura).filter(Boolean);
    const motNomes=nomesEquipa(getMotoristasCarga(v));
    const dataRef=viagensCargaDataRef(v);
    return `<tr style="cursor:pointer;" onclick="verViagemCarga('${v.id}')">
      <td><strong>${esc(vt?vt.matricula:'—')}</strong>${vt&&vt.modelo?' · '+esc(vt.modelo):''}</td>
      <td>${trelas.length?trelas.map(t=>esc(t.matricula)).join(' + '):'—'}</td>
      <td>${motNomes||'—'}</td>
      <td>${fmtDataHora(dataRef)}</td>
      <td class="num">${(v.itensCarga||[]).length}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td class="tbl-actions" onclick="event.stopPropagation();">
        <button class="btn btn-ghost btn-sm" onclick="verViagemCarga('${v.id}')">Ver</button>
      </td>
    </tr>`;
  };
  return `<div style="margin-bottom:14px;">${renderAgruparOrdenarBar(moduloKey, CAMIOES_AO_CONFIG)}</div>
  <div class="card">${aoRenderTabelaAgrupada(grupos, thead, linha)}</div>`;
}

// Renderiza os seletores de trela usados nesta viagem, só quando a viatura escolhida é uma
// Cabeça. A trela 1 é obrigatória; a trela 2 é opcional (só para cabeças com reboque duplo).
// Pré-preenche com as trelas fixas da cabeça (se houver), mas o utilizador pode trocar.
function campoTrelaViagemCarga(viaturaId, trela1Selecionada, trela2Selecionada){
  const vt=viaturaId?getViatura(viaturaId):null;
  if(!vt||vt.tipo!=='cabeca') return '';
  const trelas=trelasDisponiveis();
  const fixaIds=vt.trelaFixaIds||[];
  const pre1=trela1Selecionada!==undefined?trela1Selecionada:(fixaIds[0]||'');
  const pre2=trela2Selecionada!==undefined?trela2Selecionada:(fixaIds[1]||'');
  const opcoes=(sel,excluirId)=>trelas.filter(t=>t.id!==excluirId).map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${esc(t.matricula)}${t.modelo?' · '+esc(t.modelo):''}</option>`).join('');
  return `<div class="form-cols2">
    <div class="form-row"><label>Trela usada nesta viagem</label>
      <select id="nfc-trela1" onchange="document.getElementById('nfc-trela-wrap').innerHTML=campoTrelaViagemCarga(document.getElementById('nfc-viatura').value,this.value,document.getElementById('nfc-trela2').value)">
        <option value="">— Selecione a trela —</option>
        ${opcoes(pre1,pre2)}
      </select>
    </div>
    <div class="form-row"><label>2ª trela (reboque duplo, opcional)</label>
      <select id="nfc-trela2" onchange="document.getElementById('nfc-trela-wrap').innerHTML=campoTrelaViagemCarga(document.getElementById('nfc-viatura').value,document.getElementById('nfc-trela1').value,this.value)">
        <option value="">— Sem 2ª trela —</option>
        ${opcoes(pre2,pre1)}
      </select>
    </div>
  </div>
  <p class="form-hint">A trela é obrigatória para viagens com cabeça. Use a 2ª trela só quando esta cabeça vai puxar duas trelas ligadas.</p>`;
}
function formViagemCarga(){
  if(!camioesDisponiveis().length){ showToast('Cadastre primeiro um camião ou uma cabeça (Viaturas).','error'); goTab('viaturas'); return; }
  const disponiveis=camioesDisponiveisParaViagem();
  if(!disponiveis.length){ showToast('Todos os camiões registados estão alugados em regime de exclusividade.','error'); goTab('aluguer'); return; }
  openModal(`
    <p class="modal-title">Nova viagem de carga</p>
    <div class="form-row"><label>Camião/Cabeça</label><select id="nfc-viatura" onchange="document.getElementById('nfc-trela-wrap').innerHTML=campoTrelaViagemCarga(this.value)">
      ${disponiveis.map(v=>`<option value="${v.id}">${esc(v.matricula)}${v.modelo?' · '+esc(v.modelo):''} (${tipoViaturaLabel(v.tipo)})</option>`).join('')}
    </select></div>
    ${camioesDisponiveis().length>disponiveis.length?`<p class="form-hint">${camioesDisponiveis().length-disponiveis.length} camião(ões)/cabeça(s) não aparece(m) por estar(em) alugado(s) em regime de exclusividade.</p>`:''}
    <div id="nfc-trela-wrap">${campoTrelaViagemCarga(disponiveis[0].id)}</div>
    <div class="form-row"><label>Motorista(s)</label>
      <div class="checklist" style="border:1px solid var(--border);border-radius:8px;padding:8px;max-height:140px;overflow-y:auto;">
        ${state.tripulacao.filter(p=>p.funcao==='motorista'&&!p.afastado).map(p=>`
          <label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-weight:400;cursor:pointer;">
            <input type="checkbox" class="nfc-motorista-chk" value="${p.id}"> ${esc(p.nome)}
          </label>`).join('')||'<span class="muted" style="font-size:12.5px;">Sem motoristas ativos.</span>'}
      </div>
    </div>
    <div class="form-row"><label>Data/hora prevista de início</label><input id="nfc-inicio" type="datetime-local" value="${nowLocalInput()}"></div>
    <p class="form-hint">Se a data/hora for futura, a viagem fica "agendada". Se for agora ou já tiver passado, fica logo "em curso". Os itens de carga (cliente, destino, guia, peso/volume) são adicionados a seguir, na ficha da viagem.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" data-acao="criar" onclick="criarViagemCarga()">Criar viagem</button>
    </div>`);
}

function criarViagemCarga(){
  if(naoPodeCriar('camioes')){ showToast('Sem permissão.','error'); return; }
  const viaturaId=document.getElementById('nfc-viatura').value;
  const motoristaIds=[...document.querySelectorAll('.nfc-motorista-chk:checked')].map(el=>el.value);
  const dataPrevista=document.getElementById('nfc-inicio').value;
  if(!viaturaId||!dataPrevista){ showToast('Selecione o camião/cabeça e a data prevista de início.','error'); return; }
  const vt=getViatura(viaturaId);
  const elTrela1=document.getElementById('nfc-trela1');
  const elTrela2=document.getElementById('nfc-trela2');
  const trela1=elTrela1?elTrela1.value:'';
  const trela2=elTrela2?elTrela2.value:'';
  if(vt&&vt.tipo==='cabeca'&&!trela1){ showToast('Selecione a trela usada nesta viagem.','error'); return; }
  if(trela1&&trela2&&trela1===trela2){ showToast('As duas trelas não podem ser a mesma.','error'); return; }
  const trelaIds=(vt&&vt.tipo==='cabeca')?[trela1,trela2].filter(Boolean):[];
  const dataPrevistaISO=new Date(dataPrevista).toISOString();
  const ehFutura=new Date(dataPrevistaISO)>new Date();
  const nova={
    id:uid('vc'), viaturaId, trelaIds, motoristaIds,
    dataPlaneada:dataPrevistaISO, dataPlaneadaOriginal:null, vezesAdiada:0,
    dataInicio:ehFutura?null:dataPrevistaISO, dataFim:null, status:ehFutura?'agendada':'em_curso',
    kmInicio:null, kmFim:null, litrosAbastecidos:null, custoCombustivel:null, abastecimentos:[],
    itensCarga:[], custosOutros:[], outrasSaidas:[],
    motivoCancelamento:null, dataCancelamento:null, pedidoEdicao:null,
  };
  state.viagensCarga.push(nova);
  saveState(); closeModal();
  const trelas=trelaIds.map(getViatura).filter(Boolean);
  audit('create','viagemCarga',nova.id,`${ehFutura?'Viagem de carga agendada':'Viagem de carga iniciada'}: ${vt?vt.matricula:'?'}${trelas.length?' + '+trelas.map(t=>t.matricula).join(' + '):''}`,`Prevista: ${new Date(dataPrevistaISO).toLocaleString('pt-PT')}`);
  camioesFiltro=ehFutura?'agendadas':'em_curso';
  goTab('camioes');
  showToast(ehFutura?'Viagem de carga agendada.':'Viagem de carga iniciada.','success');
}

function verViagemCarga(id){
  const v=getViagemCarga(id); if(!v) return;
  const vt=getViatura(v.viaturaId); const st=statusViagemCargaInfo(v);
  const trelas=(v.trelaIds||[]).map(getViatura).filter(Boolean);
  const motNomes=nomesEquipa(getMotoristasCarga(v));
  const itens=v.itensCarga||[];
  const fin=financeiroViagemCarga(v);
  const itensRows=itens.map(it=>{
    const valor=calcularValorItem(it);
    const pago=(it.statusPagamento||'pago')==='pago';
    return `<tr>
      <td>${esc(it.cliente||'—')}</td>
      <td>${esc(it.destinatario||'—')}</td>
      <td>${esc(it.descricao||'—')}</td>
      <td class="num">${it.peso?fmtNum(it.peso,1)+' kg':'—'}${it.volume?' / '+fmtNum(it.volume,2)+' m³':''}</td>
      <td>${esc(it.nGuia||'—')}</td>
      <td>${esc(it.localCarga||'—')} → ${esc(it.localDescarga||'—')}</td>
      <td class="num">${fmtMT(valor)}<div class="muted" style="font-size:10px;">${labelModeloCobranca(it.modeloCobranca)}</div></td>
      <td>${pago?`<span class="badge success">Pago</span>`:`<span class="badge warning">A crédito${it.dataVencimento?' · '+fmtDataHora(it.dataVencimento).split(' ')[0]:''}</span>`}</td>
      <td class="tbl-actions">
        ${v.status!=='cancelada'&&!pago?`<button class="btn btn-ghost btn-sm" data-acao="editar" onclick="marcarItemPago('${v.id}','${it.id}')">Marcar pago</button>`:''}
        ${v.status!=='concluida'&&v.status!=='cancelada'?`
        <button class="btn btn-ghost btn-sm" data-acao="editar" onclick="formItemCarga('${v.id}','${it.id}')">Editar</button>
        <button class="btn btn-danger-ghost btn-sm" data-acao="apagar" onclick="apagarItemCarga('${v.id}','${it.id}')">Apagar</button>`:''}
      </td>
    </tr>`;
  }).join('');
  const podeMexer=v.status!=='concluida'&&v.status!=='cancelada';
  let acoesHtml='';
  if(v.status==='agendada'){
    acoesHtml=`<button class="btn btn-primary btn-sm" data-acao="editar" onclick="registarInicioRealCarga('${v.id}')">Registar início real</button>
      <button class="btn btn-ghost btn-sm" data-acao="editar" onclick="formAdiarViagemCarga('${v.id}')">Adiar</button>
      <button class="btn btn-danger-ghost btn-sm" data-acao="editar" onclick="formCancelarViagemCarga('${v.id}')">Cancelar</button>`;
  } else if(v.status==='adiada'){
    acoesHtml=`<button class="btn btn-primary btn-sm" data-acao="editar" onclick="registarInicioRealCarga('${v.id}')">Registar início real</button>
      <button class="btn btn-danger-ghost btn-sm" data-acao="editar" onclick="formCancelarViagemCarga('${v.id}')">Cancelar</button>`;
  } else if(v.status==='em_curso'){
    acoesHtml=`<button class="btn btn-primary btn-sm" data-acao="editar" onclick="formConcluirViagemCarga('${v.id}')">Concluir viagem</button>
      <button class="btn btn-danger-ghost btn-sm" data-acao="editar" onclick="formCancelarViagemCarga('${v.id}')">Cancelar</button>`;
  }
  openModal(`
    <p class="modal-title">Viagem de carga · ${esc(vt?vt.matricula:'—')}${trelas.length?' + '+trelas.map(t=>esc(t.matricula)).join(' + '):''}</p>
    <p class="modal-sub"><span class="badge ${st.cls}">${st.label}</span> &nbsp; ${trelas.length?'Trela(s): '+trelas.map(t=>esc(t.matricula)).join(' + ')+' &nbsp; ':''}${motNomes?'Motorista(s): '+motNomes:'Sem motorista atribuído'}</p>
    <div class="info-grid" style="margin-bottom:14px;">
      <div class="info-item"><label>Previsto</label><span>${fmtDataHora(v.dataPlaneada)}</span></div>
      <div class="info-item"><label>Início real</label><span>${fmtDataHora(v.dataInicio)}</span></div>
      <div class="info-item"><label>Fim</label><span>${fmtDataHora(v.dataFim)}</span></div>
      <div class="info-item"><label>Km percorridos</label><span>${(v.kmInicio!=null&&v.kmFim!=null)?fmtNum(v.kmFim-v.kmInicio,0)+' km':'—'}</span></div>
    </div>
    <div class="grid grid-stats" style="margin-bottom:14px;">
      <div class="stat-card"><div class="stat-label">Receita total</div><div class="stat-value" style="font-size:18px;">${fmtMT(fin.receita)}</div></div>
      <div class="stat-card"><div class="stat-label">Recebido</div><div class="stat-value" style="font-size:18px;color:var(--success);">${fmtMT(fin.recebido)}</div></div>
      <div class="stat-card"><div class="stat-label">A receber</div><div class="stat-value" style="font-size:18px;${fin.aReceber?'color:var(--warning);':''}">${fmtMT(fin.aReceber)}</div></div>
      <div class="stat-card ${fin.lucro>=0?'ok':'alert'}"><div class="stat-label">Lucro (receita − custos)</div><div class="stat-value" style="font-size:18px;">${fmtMT(fin.lucro)}</div></div>
    </div>
    <div class="flex-between" style="margin-bottom:8px;">
      <p class="section-title" style="margin:0;">Itens de carga (${itens.length})</p>
      ${podeMexer?`<button class="btn btn-ghost btn-sm" data-acao="criar" onclick="formItemCarga('${v.id}')">+ Adicionar item</button>`:''}
    </div>
    <div class="table-wrap" style="margin-bottom:14px;"><table>
      <thead><tr><th>Cliente/Remetente</th><th>Destinatário</th><th>Descrição</th><th>Peso/Volume</th><th>Guia</th><th>Carga → Descarga</th><th>Valor</th><th>Pagamento</th><th></th></tr></thead>
      <tbody>${itensRows||'<tr><td colspan="9" class="muted" style="text-align:center;padding:12px;">Sem itens de carga registados.</td></tr>'}</tbody>
    </table></div>
    ${renderResumoOperacionalCarga(v)}
    ${renderBlocoContabilidadeCarga(v)}
    <div class="modal-actions" style="flex-wrap:wrap;">
      ${acoesHtml}
      <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
    </div>`);
}

/* Resumo de "outras despesas" (alimentação, portagens, taxas policiais, acomodação, etc.)
   registadas na viagem de carga, com botão para adicionar/editar enquanto a viagem ainda
   não tiver sido enviada à contabilidade. */
function renderResumoOperacionalCarga(v){
  const abastecimentos=v.abastecimentos||[];
  const saidas=v.outrasSaidas||[];
  const totalComb=Number(v.custoCombustivel)||0;
  const totalDespesas=somaValores(saidas);
  const abLinhas=abastecimentos.map(a=>`
    <div class="flex-between" style="padding:4px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:12.5px;">${fmtDataHora(a.dataHora)}${a.local?` · ${esc(a.local)}`:''}${a.litros?` · ${fmtNum(a.litros,1)} L`:''}${a.pagoNoAto===false?' · <span style="color:var(--danger);font-weight:700;">a crédito</span>':''}</span>
      <span class="num" style="font-size:12.5px;">${fmtMT(a.custo||0)}</span>
    </div>`).join('');
  const saiLinhas=saidas.filter(s=>Number(s.valor)>0).map(s=>`
    <div class="flex-between" style="padding:4px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:12.5px;">${esc(s.descricao||'—')}${s.categoria?` <span class="badge neutral" style="font-size:10px;">${esc(s.categoria)}</span>`:''}</span>
      <span class="num" style="font-size:12.5px;">${fmtMT(s.valor||0)}</span>
    </div>`).join('');

  let pedidoHtml='';
  if(isAdmin() && v.pedidoEdicao && v.pedidoEdicao.status==='pendente'){
    pedidoHtml=`<div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin:0 0 10px;padding:10px;">
      <p style="font-size:12.5px;color:var(--navy-800);margin:0 0 8px;font-weight:700;">🕓 ${esc(v.pedidoEdicao.solicitadoPor)} pediu autorização para editar os dados desta viagem.</p>
      <p style="font-size:12px;color:var(--navy-800);margin:0 0 10px;">Motivo: ${esc(v.pedidoEdicao.motivo)}</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="decidirPedidoEdicaoViagemCarga('${v.id}',true)">Aprovar</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="decidirPedidoEdicaoViagemCarga('${v.id}',false)">Recusar</button>
      </div>
    </div>`;
  } else if(v.pedidoEdicao){
    if(v.pedidoEdicao.status==='pendente'){
      pedidoHtml=`<div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin:0 0 10px;padding:10px;">
        <p style="font-size:12.5px;color:var(--navy-800);margin:0;font-weight:700;">🕓 Pedido de edição enviado — a aguardar decisão do administrador.</p>
      </div>`;
    } else if(v.pedidoEdicao.status==='negado'){
      pedidoHtml=`<div class="card" style="background:var(--danger-bg);border-color:var(--danger);margin:0 0 10px;padding:10px;">
        <p style="font-size:12.5px;color:var(--navy-800);margin:0;font-weight:700;">Pedido de edição recusado${v.pedidoEdicao.decididoPor?' por '+esc(v.pedidoEdicao.decididoPor):''}.</p>
      </div>`;
    } else if(v.pedidoEdicao.status==='aprovado'){
      pedidoHtml=`<div class="card" style="background:var(--success-bg);border-color:var(--success);margin:0 0 10px;padding:10px;">
        <p style="font-size:12.5px;color:var(--navy-800);margin:0;font-weight:700;">✓ Edição autorizada por ${esc(v.pedidoEdicao.decididoPor||'—')}. Pode corrigir os dados já gravados.</p>
      </div>`;
    }
  }

  let btnHtml='';
  if(!(v.enviadoContabilidade || v.status==='cancelada')){
    if(podeEditarViagemCargaDireto(v)){
      btnHtml=`<button class="btn btn-ghost btn-sm" onclick="formEditarViagemCarga('${v.id}')">Registar/editar dados</button>`;
    } else if(podeNoModulo('camioes','editar')){
      if(v.pedidoEdicao && v.pedidoEdicao.status==='aprovado'){
        btnHtml=`<button class="btn btn-ghost btn-sm" onclick="formEditarViagemCarga('${v.id}')">Editar (autorizado)</button>`;
      } else if(v.pedidoEdicao && v.pedidoEdicao.status==='pendente'){
        btnHtml=`<button class="btn btn-ghost btn-sm" disabled title="Aguarda aprovação do administrador" style="opacity:.5;cursor:not-allowed;">Pedido enviado</button>`;
      } else {
        btnHtml=`<button class="btn btn-ghost btn-sm" onclick="formPedirEdicaoViagemCarga('${v.id}')">Pedir autorização para editar</button>`;
      }
    }
  }

  return `<div class="card" style="margin-bottom:14px;">
    ${pedidoHtml}
    <div class="flex-between" style="margin-bottom:8px;">
      <p class="section-title" style="margin:0;">Km, combustível e despesas</p>
      ${btnHtml}
    </div>
    <div class="form-cols2" style="margin-bottom:10px;">
      <div><span class="muted" style="font-size:11.5px;">Km início</span><div style="font-size:13px;font-weight:600;">${v.kmInicio!=null?fmtNum(v.kmInicio,0):'—'}</div></div>
      <div><span class="muted" style="font-size:11.5px;">Km fim</span><div style="font-size:13px;font-weight:600;">${v.kmFim!=null?fmtNum(v.kmFim,0):'—'}</div></div>
    </div>
    <p class="muted" style="font-size:11px;margin:0 0 4px;text-transform:uppercase;">Abastecimentos${totalComb?' · '+fmtMT(totalComb):''}</p>
    ${abLinhas||'<p class="muted" style="font-size:12.5px;margin:0 0 10px;">Sem abastecimentos registados.</p>'}
    <p class="muted" style="font-size:11px;margin:12px 0 4px;text-transform:uppercase;">Outras despesas${totalDespesas?' · '+fmtMT(totalDespesas):''}</p>
    ${saiLinhas||'<p class="muted" style="font-size:12.5px;margin:0;">Sem despesas registadas (alimentação, portagens, taxas policiais, acomodação, etc.).</p>'}
  </div>`;
}
/* ── Registar/editar dados operacionais da viagem de carga (km, abastecimentos, despesas) ──
   Mesmo esquema "cravado" das viagens de autocarro e do Relatório de Caixa: o que já foi
   gravado fica visível mas bloqueado; só se pode acrescentar novos registos livremente.
   Para corrigir algo já gravado é preciso pedir autorização ao administrador. */
function formEditarViagemCarga(id){
  const v=getViagemCarga(id); if(!v) return;
  if(naoPodeEditar('camioes')){ showToast('Sem permissão.','error'); return; }
  if(v.enviadoContabilidade || v.status==='cancelada'){ showToast('Esta viagem já não pode ser editada.','error'); return; }
  if(!podeEditarViagemCargaDireto(v) && !(v.pedidoEdicao && v.pedidoEdicao.status==='aprovado')){
    showToast('Não tem autorização para editar esta viagem.','error');
    verViagemCarga(id);
    return;
  }
  const vt=getViatura(v.viaturaId);
  const autorizado=!podeEditarViagemCargaDireto(v) && v.pedidoEdicao && v.pedidoEdicao.status==='aprovado';
  const editavel=podeEditarCamposCravados(v);
  const kmIniLocked=!editavel && temValorCravado(v.kmInicio);
  const kmFimLocked=!editavel && temValorCravado(v.kmFim);
  const abastecimentos=v.abastecimentos||[];
  const saidas=v.outrasSaidas||[];

  const avisoCravadoHtml = editavel ? '' : `
    <div class="card" style="background:var(--bg);margin:10px 0 14px;padding:10px;">

function salvarEdicaoViagemCarga(id){
  const v=getViagemCarga(id); if(!v) return;
  if(naoPodeEditar('camioes')){ showToast('Sem permissão.','error'); return; }
  const editavel=podeEditarCamposCravados(v);
  const getV=(elId)=>{ const el=document.getElementById(elId); return el&&el.value!==''?(isNaN(Number(el.value))?null:Number(el.value)):null; };
  const manterOuNovo=(elId,valorAntigo)=>{
    if(!editavel && temValorCravado(valorAntigo)) return valorAntigo;
    return getV(elId);
  };
  v.kmInicio=manterOuNovo('cve-km-ini', v.kmInicio);
  v.kmFim=manterOuNovo('cve-km-fim', v.kmFim);
  const abNovas=coletarAbastecimentos('cve-ab-container');
  v.abastecimentos = editavel ? abNovas : [...(v.abastecimentos||[]), ...abNovas];
  v.litrosAbastecidos=v.abastecimentos.reduce((s,i)=>s+(Number(i.litros)||0),0);
  v.custoCombustivel=v.abastecimentos.reduce((s,i)=>s+(Number(i.custo)||0),0);
  v.custoCombustivelCredito=v.abastecimentos.filter(i=>i.pagoNoAto===false).reduce((s,i)=>s+(Number(i.custo)||0),0);
  sincronizarDividasAbastecimento(v.abastecimentos,'viagemCarga',v.id);
  const saidasNovas=coletarOutrasSaidasContainer('cve');
  v.outrasSaidas = editavel ? saidasNovas : [...(v.outrasSaidas||[]), ...saidasNovas];
  if(!isAdmin() && v.pedidoEdicao && v.pedidoEdicao.status==='aprovado'){
    v.pedidoEdicao=Object.assign({}, v.pedidoEdicao, {status:'usado'});
  }
  audit('update','viagemCarga',v.id,'Dados da viagem de carga atualizados','');
  saveState(); closeModal();
  verViagemCarga(id);
  showToast('Dados guardados.','success');
}
/* Pedido de autorização para corrigir dados já cravados — mesmo fluxo das viagens de
   autocarro (formPedirEdicaoViagem/decidirPedidoEdicaoViagem), aplicado a viagens de carga. */
function formPedirEdicaoViagemCarga(id){
  const v=getViagemCarga(id); if(!v) return;
  openModal(`
    <p class="modal-title">Pedir autorização para editar</p>
    <p class="modal-sub">Os dados já gravados desta viagem estão cravados. O administrador vai rever o pedido — só depois de aprovado poderá alterar diretamente o que já foi gravado.</p>
    <div class="form-row"><label>Motivo do pedido</label><textarea id="pvc-motivo" rows="3" placeholder="Explique porque precisa de corrigir esta viagem..."></textarea></div>
    <p id="pvc-err" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:4px 0;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();verViagemCarga('${id}')">Cancelar</button>
      <button class="btn btn-primary" onclick="enviarPedidoEdicaoViagemCarga('${id}')">Enviar pedido</button>
    </div>`);
}
function enviarPedidoEdicaoViagemCarga(id){
  if(naoPodeEditar('camioes')){ showToast('Sem permissão.','error'); return; }
  const motivo=document.getElementById('pvc-motivo').value.trim();
  const errEl=document.getElementById('pvc-err');
  if(!motivo){ errEl.textContent='Descreva o motivo do pedido.'; return; }
  const v=getViagemCarga(id); if(!v) return;
  const solicitante=currentPerfil?.nome || currentUser?.email || '—';
  v.pedidoEdicao={ status:'pendente', motivo, solicitadoPor:solicitante, solicitadoEm:new Date().toISOString(), decididoPor:null, decididoEm:null };
  saveState();
  audit('action','viagemCarga',id,'Pedido de edição solicitado',`Por: ${solicitante} · Motivo: ${motivo}`);
  closeModal();
  showToast('Pedido enviado ao administrador.','success');
  verViagemCarga(id);
}
function decidirPedidoEdicaoViagemCarga(id, aprovar){
  if(!isAdmin()) return;
  const v=getViagemCarga(id); if(!v || !v.pedidoEdicao || v.pedidoEdicao.status!=='pendente') return;
  const adminNome=currentPerfil?.nome || currentUser?.email || 'Administrador';
  v.pedidoEdicao=Object.assign({}, v.pedidoEdicao, { status:aprovar?'aprovado':'negado', decididoPor:adminNome, decididoEm:new Date().toISOString() });
  saveState();
  audit('action','viagemCarga',id,`Pedido de edição ${aprovar?'aprovado':'recusado'}`,`Por: ${adminNome}`);
  showToast(aprovar?'Pedido aprovado. A pessoa já pode editar esta viagem.':'Pedido recusado.', aprovar?'success':'');
  verViagemCarga(id);
}
function renderBlocoContabilidadeCarga(v){
  if(v.status!=='concluida') return '';
  if(v.enviadoContabilidade){
    return `<div class="card" style="margin-bottom:14px;background:var(--bg);">
      <span class="badge success">Enviado à contabilidade</span>
    </div>`;
  }
  const cfg=state.configContabilidade||{};
  const emFalta=['contaCaixa','contaReceitaFretes'].filter(k=>!cfg[k]);
  if(emFalta.length){
    return `<div class="card" style="margin-bottom:14px;background:var(--bg);">
      <p style="font-size:12.5px;color:var(--danger);margin:0 0 8px;">Configure as contas automáticas do módulo Camiões antes de enviar (Contabilidade → Contabilidade Geral → Configurações).</p>
      <button class="btn btn-ghost btn-sm" onclick="closeModal();goTab('financeiro');contabilidadeSubTab='geral';contabilidadeGeralSubTab='config';renderContent();">Configurar agora</button>
    </div>`;
  }
  if(podeVer('financeiro')){
    const semConta=itensCargaFinanceirosSemConta(v);
    if(semConta.length){
      return `<div class="card" style="margin-bottom:14px;background:var(--bg);">
        <p style="font-size:12.5px;color:var(--navy-800);margin:0 0 8px;">${semConta.length} despesa(s) desta viagem ainda sem conta contabilística atribuída. Defina a conta de cada uma antes de enviar.</p>
        <button class="btn btn-primary btn-sm" onclick="formDefinirContasViagemCarga('${v.id}')">Definir contas dos itens</button>
      </div>`;
    }
  }
  return `<div class="card" style="margin-bottom:14px;background:var(--bg);">
    ${podeVer('financeiro')&&(v.outrasSaidas||[]).some(s=>Number(s.valor)>0)?`<button class="btn btn-ghost btn-sm" onclick="formDefinirContasViagemCarga('${v.id}')" style="margin-bottom:8px;">Rever contas dos itens</button><br>`:''}
    <button class="btn btn-primary" data-acao="editar" onclick="enviarViagemCargaContabilidade('${v.id}')">Enviar à Contabilidade</button>
    <p class="form-hint">Gera automaticamente o lançamento no Diário com base nos itens de carga (frete pago/a crédito, combustível e outras despesas).</p>
  </div>`;
}
/* Despesas (outrasSaidas/custosOutros) com valor indicado mas ainda sem conta contabilística
   escolhida — mesmo princípio de itensFinanceirosSemConta() das viagens de autocarro. */
function itensCargaFinanceirosSemConta(v){
  return [...(v.outrasSaidas||[]),...(v.custosOutros||[])].filter(it=>Number(it.valor)>0 && !it.contaId);
}
/* Modal usado pela contabilidade para atribuir a conta de cada despesa (outra saída) desta
   viagem de carga, antes de enviar o lançamento automático — mesmo padrão do
   formDefinirContasViagem() das viagens de autocarro. */
function formDefinirContasViagemCarga(id){
  if(!podeVer('financeiro')){ showToast('Sem permissão.','error'); return; }
  const v=getViagemCarga(id); if(!v) return;
  const vt=getViatura(v.viaturaId);
  const linha=(idx,label,valor,contaId,extra)=>`
    <div class="dyn-row-cat" style="align-items:center;margin-bottom:6px;grid-template-columns:1fr 100px minmax(150px,1.3fr);">
      <div style="font-size:12.5px;">${esc(label||'—')}${extra||''}</div>
      <div class="num" style="font-size:12.5px;">${fmtMT(valor||0)}</div>
      <select data-conta-idx="${idx}">${optsContas(contaId||'')}</select>
    </div>`;
  const saiHtml=(v.outrasSaidas||[]).map((s,i)=>Number(s.valor)>0?linha(i,s.descricao,s.valor,s.contaId,s.categoria?` <span class="badge neutral" style="font-size:10px;">${esc(s.categoria)}</span>`:''):'').join('');
  openModal(`
    <p class="modal-title">${esc(vt?vt.matricula:'Viagem de carga')}</p>
    <p class="modal-sub">Escolha a conta contabilística de cada despesa registada pela equipa. A descrição e o valor não podem ser alterados aqui.</p>
    ${saiHtml?`<div class="section-divider">Outras despesas</div>${saiHtml}`:'<p class="muted" style="font-size:12.5px;">Esta viagem não tem despesas com valor indicado.</p>'}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();verViagemCarga('${v.id}')">Cancelar</button>
      <div style="flex:1;"></div>
      <button class="btn btn-primary" onclick="salvarContasViagemCarga('${v.id}')">Guardar contas</button>
    </div>
  `, true);
}
function salvarContasViagemCarga(id){
  if(!podeVer('financeiro')){ showToast('Sem permissão.','error'); return; }
  const v=getViagemCarga(id); if(!v) return;
  document.querySelectorAll('[data-conta-idx]').forEach(sel=>{
    const idx=Number(sel.getAttribute('data-conta-idx'));
    if(v.outrasSaidas[idx]) v.outrasSaidas[idx].contaId=sel.value;
  });
  saveState(); closeModal();
  const vt=getViatura(v.viaturaId);
  audit('update','viagemCarga',id,`Contas contabilísticas definidas: ${vt?vt.matricula:'?'}`);
  showToast('Contas guardadas.','success');
  verViagemCarga(id);
}

  if(modelo==='km'){
    extra=`<div class="form-row"><label>Distância desta entrega (km)</label><input id="ic-distanciaKm" type="number" min="0" step="0.1" value="${it?(it.distanciaKm||''):''}"></div>`;
  }
  return `
    <div class="form-row"><label>${rotulos[modelo]}</label><input id="ic-valorUnitario" type="number" min="0" step="0.01" value="${it?(it.valorUnitario||''):''}"></div>
    ${extra}`;
}

function salvarItemCarga(viagemId, itemId){
  const v=getViagemCarga(viagemId); if(!v) return;
  if(itemId ? naoPodeEditar('camioes') : naoPodeCriar('camioes')){ showToast('Sem permissão.','error'); return; }
  const cliente=document.getElementById('ic-cliente').value.trim();
  if(!cliente){ showToast('Indique o cliente/remetente.','error'); return; }
  const dhCarga=document.getElementById('ic-dhCarga').value;
  const dhDescarga=document.getElementById('ic-dhDescarga').value;
  const modeloCobranca=document.getElementById('ic-modeloCobranca').value;
  const statusPagamento=document.getElementById('ic-statusPagamento').value;
  const elDistanciaKm=document.getElementById('ic-distanciaKm');
  const elVencimento=document.getElementById('ic-vencimento');
  const dados={
    cliente, destinatario:document.getElementById('ic-destinatario').value.trim(),
    descricao:document.getElementById('ic-descricao').value.trim(),
    peso:Number(document.getElementById('ic-peso').value)||0,
    volume:Number(document.getElementById('ic-volume').value)||0,
    nGuia:document.getElementById('ic-nguia').value.trim(),
    localCarga:document.getElementById('ic-localCarga').value.trim(),
    localDescarga:document.getElementById('ic-localDescarga').value.trim(),
    dataHoraCarga:dhCarga?new Date(dhCarga).toISOString():null,
    dataHoraDescarga:dhDescarga?new Date(dhDescarga).toISOString():null,
    modeloCobranca,
    valorUnitario:Number(document.getElementById('ic-valorUnitario').value)||0,
    distanciaKm:elDistanciaKm?Number(elDistanciaKm.value)||0:0,
    statusPagamento,
    dataVencimento:(statusPagamento==='credito'&&elVencimento&&elVencimento.value)?new Date(elVencimento.value).toISOString():null,
  };
  if(!v.itensCarga) v.itensCarga=[];
  if(itemId){
    const it=v.itensCarga.find(i=>i.id===itemId);
    if(it) Object.assign(it,dados);
    audit('update','viagemCarga',v.id,`Item de carga editado (${dados.cliente})`,'');
  } else {
    v.itensCarga.push(Object.assign({id:uid('ic')},dados));
    audit('update','viagemCarga',v.id,`Item de carga adicionado (${dados.cliente})`,'');
  }
  saveState(); verViagemCarga(viagemId);
  showToast('Item de carga guardado.','success');
}

function apagarItemCarga(viagemId, itemId){
  const v=getViagemCarga(viagemId); if(!v) return;

  confirmAction('Apagar este item de carga?',()=>{
    v.itensCarga=(v.itensCarga||[]).filter(i=>i.id!==itemId);
    audit('update','viagemCarga',v.id,'Item de carga removido','');
    saveState(); verViagemCarga(viagemId);
    showToast('Item de carga removido.','success');
  });
}

function confirmarCancelarViagemCarga(id){
  const v=getViagemCarga(id); if(!v) return;
  if(naoPodeEditar('camioes')){ showToast('Sem permissão.','error'); return; }
  v.motivoCancelamento=document.getElementById('cc-motivo').value.trim();
  v.dataCancelamento=new Date().toISOString();
  v.status='cancelada';
  audit('update','viagemCarga',v.id,'Viagem de carga cancelada',v.motivoCancelamento||'');
  saveState(); closeModal(); camioesFiltro='canceladas'; renderContent();
  showToast('Viagem cancelada.','success');
}

function formConcluirViagemCarga(id){

}
function confirmarConcluirViagemCarga(id){
  const v=getViagemCarga(id); if(!v) return;
  if(naoPodeEditar('camioes')){ showToast('Sem permissão.','error'); return; }
  const dataFim=document.getElementById('cv-fim').value;
  if(!dataFim){ showToast('Indique a data/hora de conclusão.','error'); return; }
  v.dataFim=new Date(dataFim).toISOString();
  v.status='concluida';
  audit('update','viagemCarga',v.id,'Viagem de carga concluída','');
  saveState(); closeModal(); camioesFiltro='concluidas'; renderContent();
  showToast('Viagem concluída.','success');
}
/* Recolhe as linhas preenchidas num container de "outras saídas" (ver saidaRowHtml). */
function coletarOutrasSaidasContainer(prefix){
  const descs=[...document.querySelectorAll(`#${prefix}-saidas-container [data-saida-desc]`)].map(e=>e.value.trim());
  const vals=[...document.querySelectorAll(`#${prefix}-saidas-container [data-saida-valor]`)].map(e=>Number(e.value)||0);
  const cats=[...document.querySelectorAll(`#${prefix}-saidas-container [data-saida-categoria]`)].map(e=>e.value);
  return descs.map((d,i)=>({descricao:d,valor:vals[i],contaId:'',categoria:cats[i]||''})).filter(s=>s.descricao||s.valor);
}

function viewProfileRota(id){
  const r=getRota(id); if(!r) return '<div class="card"><div class="empty">Rota não encontrada.</div></div>';
  const viagens=state.viagens.filter(v=>v.rotaId===id).sort((a,b)=>new Date(b.dataInicio)-new Date(a.dataInicio));
  const concluidas=viagens.filter(v=>v.status==='concluida');
  const total=(r.trocos||[]).reduce((s,t)=>s+Number(t.duracaoEsperadaMin||0),0);

  // atraso médio por troço
  const atrasoPorTroco={};
  concluidas.forEach(v=>{
    segmentosCalculados(v).forEach(t=>{
      if(t.atraso!=null){ if(!atrasoPorTroco[t.nome]) atrasoPorTroco[t.nome]=[]; atrasoPorTroco[t.nome].push(t.atraso); }
    });
  });

  // terminal stats
  const viagensTerminal=state.viagens.filter(v=>v.rotaId===id&&v.terminalInicio);
  const temposTerminal=viagensTerminal.filter(v=>v.terminalFim).map(v=>Math.round((new Date(v.terminalFim)-new Date(v.terminalInicio))/60000));
  const mediaTerminal=temposTerminal.length?Math.round(temposTerminal.reduce((s,t)=>s+t,0)/temposTerminal.length):null;

  return `
    ${profileBackBtn('rotas')}
    <div class="profile-header">
      <div class="profile-avatar">R</div>
      <div>
        <div class="profile-name">${esc(r.nome)}</div>
        <div class="profile-sub">${(r.trocos||[]).length} troço(s) · Duração padrão: ${fmtDuracao(total)}</div>
      </div>
    </div>
    <div class="grid grid-stats" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Total de viagens</div><div class="stat-value">${viagens.length}</div><div class="stat-sub">${concluidas.length} concluídas</div></div>
      <div class="stat-card${mediaTerminal?'':' neutral'}"><div class="stat-label">Tempo médio na terminal</div><div class="stat-value" style="font-size:20px;">${mediaTerminal?fmtDuracao(mediaTerminal):'—'}</div><div class="stat-sub">${temposTerminal.length} registo(s)</div></div>
    </div>
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="card">
        <p class="section-title">Troços e atraso médio</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Troço</th><th>Padrão</th><th>Atraso médio</th></tr></thead>
          <tbody>${(r.trocos||[]).map(t=>{
            const arr=atrasoPorTroco[t.nome]||[];

/* ============================== GOOGLE DRIVE (ANEXOS) ============================== */
const GDRIVE_CLIENT_ID = '712692872398-8fkb5e1591aquaubk2efq57k4voc37u1.apps.googleusercontent.com';
// Escopo amplo (não só "drive.file"): é o que permite que um utilizador, autenticado com a
// SUA PRÓPRIA conta Google, consiga ler/escrever numa pasta central que foi criada e
// partilhada por outra conta (ex: a conta da empresa). Com "drive.file" isto não seria
// possível para pastas que o utilizador não criou/abriu através da app.
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
const GDRIVE_FOLDER_NAME = 'Gestão de Frota · Ndolene';

let gdriveToken = null;
let gdriveFolderId = null;
let gdriveTokenExpiry = null;

function gdriveIsReady(){
  return !!gdriveToken && (!gdriveTokenExpiry || Date.now() < gdriveTokenExpiry);
}

// Tenta recuperar token da sessão (após redirect OAuth)
function gdriveRestoreToken(){
  // Verifica hash da URL (#access_token=...&expires_in=...)
  const hash = window.location.hash;
  if(hash && hash.includes('access_token=')){
    const params = new URLSearchParams(hash.replace('#',''));
    const token = params.get('access_token');
    const expiresIn = Number(params.get('expires_in'))||3600;
    if(token){
      gdriveToken = token;
      gdriveTokenExpiry = Date.now() + (expiresIn - 60) * 1000;
      sessionStorage.setItem('gdrive_token', token);
      sessionStorage.setItem('gdrive_expiry', String(gdriveTokenExpiry));
      // Limpa o hash da URL sem recarregar
      history.replaceState(null, '', window.location.pathname + window.location.search);
      return true;
    }
  }
  // Tenta recuperar da sessionStorage
  const saved = sessionStorage.getItem('gdrive_token');
  const expiry = Number(sessionStorage.getItem('gdrive_expiry'))||0;
  if(saved && Date.now() < expiry){
    gdriveToken = saved;
    gdriveTokenExpiry = expiry;
    return true;
  }
  return false;
}

function gdriveLogin(){
  // Guarda estado para restaurar depois do redirect
  sessionStorage.setItem('gdrive_pending_upload', '1');
  const redirectUri = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: redirectUri,
    response_type: 'token',
    scope: GDRIVE_SCOPE,
    prompt: 'consent',
  });
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

async function gdriveAuthIfNeeded(){
  if(gdriveIsReady()) return true;
  // Mostra modal de confirmação antes de redirecionar
  return new Promise(resolve=>{
    openModal(`
      <p class="modal-title">Ligar ao Google Drive</p>
      <p class="modal-sub">Para enviar anexos, precisa de autorizar o acesso ao Google Drive. Será redirecionado para o Google e voltará automaticamente.</p>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:0;">⚠️ Os dados do sistema <strong>não são apagados</strong> — estão guardados no Supabase.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal(); resolve && resolve(false)">Cancelar</button>
        <button class="btn btn-primary" onclick="closeModal(); gdriveLogin()">Autorizar com Google</button>
      </div>`);
    // fallback: se fechar o modal sem clicar
    setTimeout(()=> resolve(false), 60000);
  });
}

async function gdriveFetch(url, opts={}){
  const res = await fetch(url, {
    ...opts,
    headers: { 'Authorization': 'Bearer '+gdriveToken, ...(opts.headers||{}) }
  });
  if(res.status===401){
    gdriveToken=null;
    sessionStorage.removeItem('gdrive_token');
    throw new Error('Token expirado');
  }
  return res;
}

/* ── Pasta central de anexos ──
   Em vez de cada utilizador criar (e ficar "dono de") a sua própria pasta "Gestão de Frota ·
   Ndolene" na sua Drive pessoal, guardamos o ID de UMA pasta central em state.driveFolderId
   (persistido no Supabase, visível a todos). Só um administrador pode criar/definir essa pasta
   pela primeira vez. Depois disso, qualquer utilizador — autenticado com a SUA PRÓPRIA conta
   Google — consegue ler/escrever nela, DESDE QUE o administrador a tenha partilhado com essa
   pessoa no Google Drive (Partilhar → adicionar como Editor). Sem essa partilha, o Google
   devolve 403 e mostramos uma mensagem clara a pedir para contactar o administrador. */
async function gdriveResolveFolder(){
  if(gdriveFolderId) return; // já resolvida nesta sessão
  if(state.driveFolderId){ gdriveFolderId = state.driveFolderId; return; }
  if(!isAdmin()){
    const err = new Error('Pasta central de anexos ainda não configurada');
    err.code = 'SEM_PASTA_CENTRAL';
    throw err;
  }
  // Só chega aqui um administrador, na primeira configuração
  const q = encodeURIComponent(`name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  let folderId, folderName;
  if(data.files && data.files.length>0){
    folderId = data.files[0].id; folderName = data.files[0].name;
  } else {
    const createRes = await gdriveFetch('https://www.googleapis.com/drive/v3/files',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
    });
    const folder = await createRes.json();
    folderId = folder.id; folderName = folder.name;
  }
  gdriveFolderId = folderId;
  state.driveFolderId = folderId;
  state.driveFolderNome = folderName;
  state.driveFolderConfiguradoPor = currentPerfil?.nome || currentUser?.email || '—';
  state.driveFolderConfiguradoEm = new Date().toISOString();
  saveState();
}

async function configurarPastaCentralDrive(){
  if(!isAdmin()){ showToast('Só o administrador pode configurar a pasta central.','error'); return; }
  const ok = await gdriveAuthIfNeeded();
  if(!ok) return;
  try{
    await gdriveResolveFolder();
    showToast('Pasta central definida. Agora partilhe-a com a equipa no Google Drive.','success');
    renderContent();
  }catch(e){
    console.error(e);
    showToast('Erro ao configurar a pasta no Google Drive.','error');
  }
}

function resetarPastaCentralDrive(){
  if(!isAdmin()) return;
  confirmAction('Isto não apaga a pasta no Google Drive, só desliga a app dela. Quer mesmo repor a configuração?',()=>{
    state.driveFolderId=null; state.driveFolderNome=null; state.driveFolderConfiguradoPor=null; state.driveFolderConfiguradoEm=null;
    gdriveFolderId=null;
    saveState(); renderContent();
    showToast('Configuração reposta.','success');
  });
}

async function gdriveUploadFile(file, subpasta){
  await gdriveResolveFolder();
  // Cria subpasta se necessário
  let parentId = gdriveFolderId;
  if(subpasta){
    const q = encodeURIComponent(`name='${subpasta}' and '${gdriveFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
    if(res.status===403||res.status===404){ const err=new Error('Sem acesso à pasta partilhada'); err.code='SEM_ACESSO_PASTA'; throw err; }
    const data = await res.json();
    if(data.files && data.files.length>0){
      parentId = data.files[0].id;
    } else {
      const cr = await gdriveFetch('https://www.googleapis.com/drive/v3/files',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name:subpasta, mimeType:'application/vnd.google-apps.folder', parents:[gdriveFolderId] })
      });
      if(cr.status===403||cr.status===404){ const err=new Error('Sem acesso à pasta partilhada'); err.code='SEM_ACESSO_PASTA'; throw err; }
      const folder = await cr.json();
      parentId = folder.id;
    }
  }
  // Upload multipart
  const metadata = { name: file.name, parents: [parentId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)],{type:'application/json'}));
  form.append('file', file);
  const uploadRes = await gdriveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,webViewLink,mimeType',{
    method:'POST', body: form
  });
  if(uploadRes.status===403||uploadRes.status===404){ const err=new Error('Sem acesso à pasta partilhada'); err.code='SEM_ACESSO_PASTA'; throw err; }
  return await uploadRes.json();
}

async function gdriveDeleteFile(fileId){
  await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`,{ method:'DELETE' });
}

async function gdriveDownloadFile(fileId){
  const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if(!res.ok){ const err=new Error('Falha ao descarregar do Drive (HTTP '+res.status+')'); throw err; }
  return await res.blob();
}

// ── Supabase Storage (anexos) ──
function sanitizePathPart(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,80) || 'x';
}
function anexoStoragePath(entidade, entidadeId, subpasta, filename){
  const ext = (filename.match(/\.[^.]+$/)||[''])[0];
  const base = sanitizePathPart(filename.replace(/\.[^.]+$/,''));
  return `${sanitizePathPart(entidade)}/${sanitizePathPart(entidadeId)}/${uid('f')}_${base}${ext}`;
}
async function sbUploadAnexo(file, path){
  const { error } = await _sb.storage.from(SUPABASE_ANEXOS_BUCKET).upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw error;
}
async function sbDeleteAnexo(path){
  const { error } = await _sb.storage.from(SUPABASE_ANEXOS_BUCKET).remove([path]);
  if(error) throw error;
}
async function sbAnexoSignedUrl(path, segundos){
  const { data, error } = await _sb.storage.from(SUPABASE_ANEXOS_BUCKET).createSignedUrl(path, segundos||300);
  if(error) throw error;
  return data.signedUrl;
}

// ── Helpers de Anexos no State ──
function getAnexos(entidade, entidadeId){
  if(!state.anexos) state.anexos = {};
  const key = entidade+'_'+entidadeId;
  if(!state.anexos[key]) state.anexos[key] = [];
  return state.anexos[key];
}

function fileIcon(mime){
  if(!mime) return '📎';
  if(mime.startsWith('image/')) return '🖼️';
  if(mime.includes('pdf')) return '📄';
  if(mime.includes('spreadsheet')||mime.includes('excel')) return '📊';
  if(mime.includes('word')||mime.includes('document')) return '📝';
  if(mime.includes('video')) return '🎥';
  return '📎';
}

function fmtBytes(b){
  if(!b) return '';
  const n=Number(b);
  if(n<1024) return n+'B';
  if(n<1048576) return (n/1024).toFixed(1)+'KB';
  return (n/1048576).toFixed(1)+'MB';
}

// ── Item de anexo (partilhado entre render inicial e refresh pós-upload) ──
function anexoItemHtml(a, key, i){
  const seguro = a.provider==='supabase' && a.driveBackupId ? ' <span title="Cópia de segurança mantida no Google Drive">🛡️</span>' : '';
  const nomeMostrado = a.nomeExibicao || a.nome;
  const metaBase = [fmtBytes(a.size), fmtData(a.dataUpload)];
  if(a.origem) metaBase.push('Origem: '+esc(a.origem));
  return `
    <div class="anexo-item">
      <div class="anexo-icon">${fileIcon(a.mimeType)}</div>
      <div class="anexo-info">
        <div class="anexo-nome" title="${esc(a.nome)}">${esc(nomeMostrado)}${seguro}</div>
        <div class="anexo-meta">${metaBase.filter(Boolean).join(' · ')}</div>
        ${a.observacao ? `<div class="anexo-meta" style="font-style:italic;">${esc(a.observacao)}</div>` : ''}
      </div>
      <div class="anexo-actions">
        <button type="button" class="btn btn-ghost btn-sm" title="Nomear / indicar origem" onclick="editarAnexoMeta('${key}',${i})">✏️</button>
        <button type="button" class="gdrive-btn" onclick="abrirAnexo('${key}',${i})">Ver</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="apagarAnexo('${key}',${i})">×</button>
      </div>
    </div>`;
}

// ── Editar metadados de um anexo: nome de exibição, origem e observações (opcionais) ──
function editarAnexoMeta(key, index){
  const [entidade, ...restId] = key.split('_');
  const entidadeId = restId.join('_');
  const anexos = getAnexos(entidade, entidadeId);
  const a = anexos[index];
  if(!a) return;
  openModal(`
    <p class="modal-title">Editar anexo</p>
    <p class="modal-sub" style="word-break:break-all;">Ficheiro: ${esc(a.nome)}</p>
    <div class="form-row"><label>Nome do anexo (opcional)</label><input id="f-anexo-nome" value="${esc(a.nomeExibicao||'')}" placeholder="${esc(a.nome)}"></div>
    <div class="form-row"><label>Origem (opcional)</label><input id="f-anexo-origem" value="${esc(a.origem||'')}" placeholder="Ex: Factura do fornecedor, comprovativo bancário, foto do recibo…"></div>
    <div class="form-row"><label>Observações (opcional)</label><textarea id="f-anexo-obs" rows="3" placeholder="Notas adicionais sobre este anexo">${esc(a.observacao||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarAnexoMeta('${key}',${index})">Guardar</button>
    </div>`);
}

function salvarAnexoMeta(key, index){
  const [entidade, ...restId] = key.split('_');
  const entidadeId = restId.join('_');
  const anexos = getAnexos(entidade, entidadeId);
  const a = anexos[index];
  if(!a) return;
  a.nomeExibicao = document.getElementById('f-anexo-nome').value.trim();

// ── Render da secção de Anexos ──
function renderAnexosSection(entidade, entidadeId, subpasta){
  const anexos = getAnexos(entidade, entidadeId);
  const key = entidade+'_'+entidadeId;
  const listaHtml = anexos.length ? anexos.map((a,i)=>anexoItemHtml(a,key,i)).join('') : '<p class="muted" style="font-size:12.5px;padding:6px 0 0;">Sem anexos ainda.</p>';

  return `
    <div class="anexos-section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;color:var(--text-muted);">Anexos (${anexos.length})</span>
        <label class="gdrive-btn" id="anexo-label-${key}" style="cursor:pointer;">
          📎 Adicionar ficheiro
          <input type="file" multiple style="display:none;" onchange="uploadAnexo(event,'${entidade}','${entidadeId}','${esc(subpasta)}','${key}')">
        </label>
      </div>
      <div id="anexos-lista-${key}">${listaHtml}</div>
      <div id="anexo-status-${key}"></div>
    </div>`;
}

async function uploadAnexo(event, entidade, entidadeId, subpasta, key){
  const files = [...event.target.files];
  if(!files.length) return;
  const label = document.getElementById('anexo-label-'+key);
  const statusEl = document.getElementById('anexo-status-'+key);
  if(label) label.classList.add('uploading');
  let erros = 0;
  for(const file of files){
    if(statusEl) statusEl.innerHTML = `<span class="gdrive-status idle">A enviar ${esc(file.name)}…</span>`;
    try{
      const path = anexoStoragePath(entidade, entidadeId, subpasta, file.name);
      await sbUploadAnexo(file, path);
      const anexos = getAnexos(entidade, entidadeId);
      anexos.push({ nome:file.name, size:file.size, mimeType:file.type, dataUpload:new Date().toISOString(), provider:'supabase', path });
      saveState();
      // Atualiza lista sem fechar modal
      const listaEl = document.getElementById('anexos-lista-'+key);
      if(listaEl) listaEl.innerHTML = getAnexos(entidade, entidadeId).map((a,i)=>anexoItemHtml(a,key,i)).join('');
    }catch(e){ erros++; console.error(e); }
  }
  if(label){ label.classList.remove('uploading'); label.querySelector('input').value=''; }
  if(statusEl){
    statusEl.innerHTML = erros===0
      ? `<span class="gdrive-status ok">✓ ${files.length} ficheiro(s) enviado(s)</span>`
      : `<span class="gdrive-status err">⚠ ${erros} erro(s) ao enviar. Verifique a ligação e tente novamente.</span>`;
  }
  setTimeout(()=>{ if(statusEl) statusEl.innerHTML=''; },5000);
}

// ── Abrir anexo (link assinado se Supabase, link directo se ainda só no Drive) ──
async function abrirAnexo(key, index){
  const [entidade, ...restId] = key.split('_');
  const entidadeId = restId.join('_');
  const anexos = getAnexos(entidade, entidadeId);
  const a = anexos[index];
  if(!a) return;
  if(a.provider==='supabase' && a.path){
    try{
      const url = await sbAnexoSignedUrl(a.path, 300);
      window.open(url, '_blank');
    }catch(e){ console.error(e); showToast('Erro ao gerar o link do anexo.','error'); }
  } else if(a.webViewLink){
    window.open(a.webViewLink, '_blank');
  } else {
    showToast('Não foi possível localizar este anexo.','error');
  }
}

async function apagarAnexo(key, index){
  const [entidade, ...restId] = key.split('_');
  const entidadeId = restId.join('_');
  const anexos = getAnexos(entidade, entidadeId);
  const a = anexos[index];
  if(!a) return;
  if(!confirm(`Apagar "${a.nome}"?`)) return;
  if(a.provider==='supabase' && a.path){
    try{ await sbDeleteAnexo(a.path); }catch(e){ console.warn('Erro ao apagar do Supabase:',e); }
    // Nota: se este anexo tiver cópia de segurança no Drive (a.driveBackupId), ela NÃO é apagada
    // automaticamente — fica lá como arquivo, conforme decidido na migração.
  } else if(a.id){
    const ok = await gdriveAuthIfNeeded();
    if(ok){ try{ await gdriveDeleteFile(a.id); }catch(e){ console.warn('Erro ao apagar do Drive:',e); } }
  }
  anexos.splice(index,1);
  saveState();
  renderContent();
  showToast('Anexo apagado.','success');
}

// ── Migração de anexos: Google Drive → Supabase Storage ──
// Nunca apaga nada do Drive. Só marca um anexo como migrado depois de confirmar
// que o ficheiro chegou inteiro ao Supabase (tamanho conferido byte a byte).
let migracaoEmCurso = false;
let migracaoProgresso = { total:0, feitos:0, erros:0, log:[] };

function listarAnexosPendentesMigracao(){
  const pendentes = [];
  for(const key in (state.anexos||{})){
    (state.anexos[key]||[]).forEach((a,i)=>{
      if(a.provider!=='supabase' && a.id) pendentes.push({ key, index:i });
    });
  }
  return pendentes;
}

function renderMigracaoModal(){
  const p = migracaoProgresso;
  const processados = p.feitos + p.erros;
  const pct = p.total ? Math.round(processados/p.total*100) : 0;
  openModal(`
    <p class="modal-title">A migrar anexos para o Supabase…</p>
    <p class="modal-sub">Os ficheiros originais são mantidos no Google Drive como cópia de segurança. Não feche esta janela enquanto a migração decorre.</p>
    <div style="background:var(--bg);border-radius:8px;height:10px;overflow:hidden;margin:14px 0;">
      <div style="background:var(--amber-500);height:100%;width:${pct}%;transition:width .2s;"></div>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 10px;">${processados} de ${p.total} processado(s) · ✓ ${p.feitos} migrado(s) · ⚠ ${p.erros} erro(s)</p>

    <div class="modal-actions">
      <button class="btn btn-primary" id="migracao-fechar" onclick="closeModal()" ${migracaoEmCurso?'disabled':''}>${migracaoEmCurso?'A processar…':'Fechar'}</button>

async function migrarAnexosParaSupabase(){
  if(migracaoEmCurso) return;
  const pendentes = listarAnexosPendentesMigracao();
  if(!pendentes.length){ showToast('Não há anexos pendentes de migração.','success'); return; }
  if(!confirm(`Migrar ${pendentes.length} anexo(s) do Google Drive para o Supabase?\n\nOs ficheiros originais são mantidos no Drive como cópia de segurança — nada é apagado.`)) return;

  const ok = await gdriveAuthIfNeeded();
  if(!ok) return;

  migracaoEmCurso = true;
  migracaoProgresso = { total:pendentes.length, feitos:0, erros:0, log:[] };
  renderMigracaoModal();

  for(const { key, index } of pendentes){
    const [entidade, ...restId] = key.split('_');
    const entidadeId = restId.join('_');
    const anexos = getAnexos(entidade, entidadeId);
    const a = anexos[index];
    if(!a || a.provider==='supabase') continue; // já foi migrado numa passagem anterior
    try{
      const blob = await gdriveDownloadFile(a.id);
      if(a.size && blob.size && Number(blob.size)!==Number(a.size)){
        throw new Error('Tamanho do ficheiro não confere após descarregar');
      }
      const file = new File([blob], a.nome, { type: a.mimeType || blob.type || 'application/octet-stream' });
      const path = anexoStoragePath(entidade, entidadeId, '', a.nome);
      await sbUploadAnexo(file, path);
      // Só depois de confirmado o upload é que o registo é convertido — o id/link do Drive
      // ficam guardados como driveBackup*, nunca apagados.
      a.driveBackupId = a.id;
      a.driveBackupLink = a.webViewLink;
      a.provider = 'supabase';
      a.path = path;
      a.migradoEm = new Date().toISOString();
      migracaoProgresso.feitos++;
      saveState();
    }catch(e){
      migracaoProgresso.erros++;
      migracaoProgresso.log.push(`${a.nome}: ${e.message||e}`);
      console.error('Erro a migrar anexo', a, e);
    }
    renderMigracaoModal();
  }

  migracaoEmCurso = false;
  renderMigracaoModal();
  showToast(`Migração concluída: ${migracaoProgresso.feitos} migrado(s), ${migracaoProgresso.erros} erro(s).`, migracaoProgresso.erros?'error':'success');
  if(currentTab==='sistema') renderContent();
}

async function audit(tipo, entidade, entidadeId, descricao, detalhe){
  try{
    const utilizador = currentPerfil ? (currentPerfil.nome || currentUser?.email || '?') : (currentUser?.email || '?');
    const utilizadorId = currentUser ? currentUser.id : null;
    await sbRestFetch('POST','frota_auditoria','',{
      tipo, entidade,
      entidade_id: entidadeId || null,
      descricao,
      detalhe: detalhe || null,
      utilizador, utilizador_id: utilizadorId,
      criado_em: new Date().toISOString(),
    });
  }catch(e){ console.warn('[auditoria] falha ao registar:', e.message); }
}

function elapsedAudit(iso){
  if(!iso) return '—';
  const ms = Date.now() - new Date(iso).getTime();
  const sec = Math.floor(ms/1000);
  if(sec < 60) return 'há menos de 1 min';
  const min = Math.floor(sec/60);
  if(min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `há ${h}h ${min%60}min`;
  const d = Math.floor(h/24);
  if(d < 2) return 'há 1 dia';
  if(d < 30) return `há ${d} dias`;
  const m = Math.floor(d/30);
  if(m < 12) return `há ${m} ${m===1?'mês':'meses'}`;
  return `há ${Math.floor(m/12)} ano(s)`;
}

function diasRestantesLixeira(expiraEmIso){
  const ms = new Date(expiraEmIso).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms/(24*60*60*1000)));
}

// Move um registo eliminado de qualquer módulo para a lata de lixo, com um "retrato" completo
// dos seus dados (para poder ser restaurado tal como estava) e a validade de 30 dias.
// A entrada na lata de lixo fica sempre registada na auditoria.
function moverParaLixeira(modulo, item, descricao){
  if(!item) return null;
  if(!state.lixeira) state.lixeira=[];
  const operador = currentPerfil ? (currentPerfil.nome || currentUser?.email || '?') : (currentUser?.email || '?');
  const entrada = {
    id: uid('lx'),
    modulo,
    moduloLabel: (LIXEIRA_MODULOS[modulo]||{}).label || modulo,
    itemId: item.id,
    dados: JSON.parse(JSON.stringify(item)),
    descricao,
    operador,
    operadorId: currentUser ? currentUser.id : null,
    apagadoEm: new Date().toISOString(),
    expiraEm: new Date(Date.now() + LIXEIRA_RETENCAO_DIAS*24*60*60*1000).toISOString(),
  };
  state.lixeira.push(entrada);
  audit('delete', modulo, item.id, descricao, `Movido para a lata de lixo · expira em ${LIXEIRA_RETENCAO_DIAS} dias`);
  return entrada;
}

// Remove automaticamente da lata de lixo tudo o que já passou dos 30 dias, registando cada
// eliminação automática na auditoria. Corre sempre que o módulo Sistema é aberto e no arranque.
function limparLixeiraExpirada(){
  if(!state.lixeira || !state.lixeira.length) return;
  const agora = Date.now();
  const expirados = state.lixeira.filter(x=>new Date(x.expiraEm).getTime() <= agora);
  if(!expirados.length) return;
  state.lixeira = state.lixeira.filter(x=>new Date(x.expiraEm).getTime() > agora);
  expirados.forEach(x=>{
    audit('delete', x.modulo, x.itemId, `${x.moduloLabel}: "${x.descricao}" eliminado automaticamente da lata de lixo (prazo de ${LIXEIRA_RETENCAO_DIAS} dias expirado)`);
  });
  saveState();
}

function restaurarDaLixeira(lixeiraId){
  const entrada = (state.lixeira||[]).find(x=>x.id===lixeiraId);
  if(!entrada) return;
  confirmAction(`Restaurar "${entrada.descricao}" para o módulo ${entrada.moduloLabel}?`, ()=>{
    const cfg = LIXEIRA_MODULOS[entrada.modulo];
    if(cfg){
      const arr = cfg.get();
      if(arr && !arr.find(x=>x.id===entrada.dados.id)) arr.push(entrada.dados);
    }
    state.lixeira = state.lixeira.filter(x=>x.id!==lixeiraId);
    audit('action','lixeira',entrada.itemId,`${entrada.moduloLabel}: "${entrada.descricao}" restaurado da lata de lixo`);
    saveState(); renderContent();
    showToast('Item restaurado com sucesso.','success');
  });
}

function apagarPermanenteDaLixeira(lixeiraId){

  const entrada = (state.lixeira||[]).find(x=>x.id===lixeiraId);

function esvaziarLixeira(){
  if(!isAdmin()){ showToast('Só o administrador pode esvaziar a lata de lixo.','error'); return; }
  const itens = lixeiraFiltrarLista();
  if(!itens.length){ showToast('Não há itens para eliminar.',''); return; }
  confirmAction(`Eliminar definitivamente ${itens.length} item(ns) da lata de lixo? Esta ação não pode ser desfeita.`, ()=>{
    const ids = itens.map(x=>x.id);
    state.lixeira = (state.lixeira||[]).filter(x=>!ids.includes(x.id));
    audit('delete','lixeira',null,`${itens.length} item(ns) eliminados definitivamente da lata de lixo em lote`);
    saveState(); renderContent();
    showToast('Lata de lixo esvaziada.','success');
  });
}

function lixeiraFiltrarLista(){
  let lista = (state.lixeira||[]).slice();
  const { modulo, operador, periodo, busca } = lixeiraEstado;
  if(modulo) lista = lista.filter(x=>x.modulo===modulo);
  if(operador) lista = lista.filter(x=>x.operador===operador);
  if(periodo){
    const limites = {'24h':1, '7d':7, '30d':30};
    const dias = limites[periodo];
    if(dias) lista = lista.filter(x=> (Date.now() - new Date(x.apagadoEm).getTime()) <= dias*24*60*60*1000 );
  }
  if(busca){
    const b = busca.toLowerCase().trim();
    lista = lista.filter(x=>
      (x.descricao||'').toLowerCase().includes(b) ||
      (x.operador||'').toLowerCase().includes(b) ||
      (x.moduloLabel||'').toLowerCase().includes(b));
  }
  return lista;
}

function lixeiraOrdenarLista(lista, ordenar){
  const l = lista.slice();
  if(ordenar==='data_asc') l.sort((a,b)=>new Date(a.apagadoEm)-new Date(b.apagadoEm));
  else if(ordenar==='expira_asc') l.sort((a,b)=>new Date(a.expiraEm)-new Date(b.expiraEm));
  else if(ordenar==='modulo_az') l.sort((a,b)=>(a.moduloLabel||'').localeCompare(b.moduloLabel||''));
  else if(ordenar==='operador_az') l.sort((a,b)=>(a.operador||'').localeCompare(b.operador||''));
  else l.sort((a,b)=>new Date(b.apagadoEm)-new Date(a.apagadoEm)); // data_desc (padrão)
  return l;
}

function lixeiraAgruparLista(lista, agrupar){
  if(agrupar==='none') return [{titulo:null, itens:lista}];
  const mapa = new Map();
  lista.forEach(x=>{
    let chave, titulo;
    if(agrupar==='modulo'){ chave=x.modulo; titulo=x.moduloLabel; }
    else if(agrupar==='operador'){ chave=x.operador||'—'; titulo=x.operador||'Desconhecido'; }
    else { // periodo
      const dias = Math.floor((Date.now()-new Date(x.apagadoEm).getTime())/(24*60*60*1000));
      if(dias<1){ chave='0-hoje'; titulo='Hoje'; }
      else if(dias<7){ chave='1-semana'; titulo='Últimos 7 dias'; }
      else if(dias<30){ chave='2-mes'; titulo='Últimos 30 dias'; }
      else { chave='3-antigo'; titulo='Há mais de 30 dias'; }
    }
    if(!mapa.has(chave)) mapa.set(chave, {titulo, itens:[]});
    mapa.get(chave).itens.push(x);
  });
  return Array.from(mapa.keys()).sort().map(k=>mapa.get(k));
}

        <div><label class="muted" style="font-size:11px;text-transform:uppercase;display:block;">Nome</label><span style="font-size:13px;">${esc(emp.nome)}</span></div>
        <div><label class="muted" style="font-size:11px;text-transform:uppercase;display:block;">NUIT</label><span style="font-size:13px;">${esc(emp.nuit)||'—'}</span></div>
        <div><label class="muted" style="font-size:11px;text-transform:uppercase;display:block;">Endereço</label><span style="font-size:13px;">${esc(emp.endereco)||'—'}</span></div>
        <div><label class="muted" style="font-size:11px;text-transform:uppercase;display:block;">Telefone</label><span style="font-size:13px;">${esc(emp.telefone)||'—'}</span></div>
        <div><label class="muted" style="font-size:11px;text-transform:uppercase;display:block;">Email</label><span style="font-size:13px;">${esc(emp.email)||'—'}</span></div>
      </div>
    </div>`;

  const driveCard = `
    <div class="card" style="margin-bottom:14px;">
      <p class="section-title" style="margin:0 0 4px;">📁 Google Drive · Pasta central de anexos</p>
      ${state.driveFolderId ? `
        <p style="font-size:13px;color:var(--text-muted);margin:0 0 10px;">Todos os anexos do sistema (relatórios, viagens, documentos, despesas, etc.) são guardados nesta pasta partilhada — cada utilizador continua a entrar com a sua própria conta Google, mas os ficheiros ficam todos centralizados aqui.</p>
        <div class="flex-between" style="background:var(--bg);border-radius:6px;padding:10px 14px;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-weight:700;font-size:13px;">${esc(state.driveFolderNome||GDRIVE_FOLDER_NAME)}</div>
            <div style="font-size:11.5px;color:var(--text-muted);">Configurada por ${esc(state.driveFolderConfiguradoPor||'—')} em ${fmtDataHora(state.driveFolderConfiguradoEm)}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <a href="https://drive.google.com/drive/folders/${esc(state.driveFolderId)}" target="_blank" class="btn btn-ghost btn-sm">Abrir no Drive ↗</a>
            <button class="btn btn-danger-ghost btn-sm" onclick="resetarPastaCentralDrive()">Repor</button>
          </div>
        </div>
        <p style="font-size:12.5px;color:var(--navy-800);background:var(--amber-100);border:1px solid var(--amber-500);border-radius:6px;padding:8px 12px;margin:0;">⚠️ Para que cada pessoa consiga anexar e ver ficheiros com a <b>sua própria conta Google</b>, abra a pasta acima no Drive → <b>Partilhar</b> → adicione o email Google de cada utilizador como <b>Editor</b>. Sem isso, essa pessoa vê um aviso a pedir para contactar o administrador.</p>
      `:`
        <p style="font-size:13px;color:var(--text-muted);margin:0 0 10px;">Ainda não existe uma pasta central. Ligue a conta Google que vai "ser dona" da pasta (o ideal é uma conta da empresa) — a partir daí, todos os anexos do sistema passam a ser guardados aqui, e pode partilhar esta pasta com a restante equipa.</p>
        <button class="btn btn-primary btn-sm" onclick="configurarPastaCentralDrive()">Ligar Google Drive e definir pasta central</button>
      `}
    </div>`;

  const contAnexos = (function(){
    let supa=0, drive=0;
    for(const key in (state.anexos||{})){
      (state.anexos[key]||[]).forEach(a=>{ if(a.provider==='supabase') supa++; else if(a.id) drive++; });
    }
    return {supa, drive};
  })();
  const storageCard = `
    <div class="card" style="margin-bottom:14px;">
      <p class="section-title" style="margin:0 0 4px;">🔒 Anexos · Supabase Storage</p>
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 10px;">Novos anexos são guardados num bucket privado do Supabase — sem depender da conta Google de cada pessoa nem de partilha manual de pastas. ${contAnexos.drive>0?`Ainda há <b>${contAnexos.drive}</b> anexo(s) antigo(s) só no Google Drive.`:`Todos os anexos já estão no Supabase.`}</p>
      <div class="flex-between" style="background:var(--bg);border-radius:6px;padding:10px 14px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:12.5px;color:var(--text-muted);">✅ ${contAnexos.supa} no Supabase &nbsp;·&nbsp; ${contAnexos.drive>0?'⚠️':'✅'} ${contAnexos.drive} ainda só no Drive</div>
        ${contAnexos.drive>0 ? `<button class="btn btn-primary btn-sm" onclick="migrarAnexosParaSupabase()">Migrar anexos do Drive →</button>` : ''}
      </div>
      ${contAnexos.drive>0 ? `<p style="font-size:12px;color:var(--text-muted);margin:10px 0 0;">A migração descarrega cada anexo do Drive, confirma o tamanho, e só depois o marca como migrado. Os ficheiros originais ficam no Drive como cópia de segurança (🛡️) — nada é apagado automaticamente.</p>` : ''}
    </div>`;

  const todos = state.lixeira || [];
  const modulosPresentes = Array.from(new Set(todos.map(x=>x.modulo)));
  const operadoresPresentes = Array.from(new Set(todos.map(x=>x.operador))).filter(Boolean).sort();

  const filtrada = lixeiraFiltrarLista();
  const ordenada = lixeiraOrdenarLista(filtrada, lixeiraEstado.ordenar);
  const grupos = lixeiraAgruparLista(ordenada, lixeiraEstado.agrupar);
  const filtrosActivos = !!(lixeiraEstado.modulo||lixeiraEstado.operador||lixeiraEstado.periodo||lixeiraEstado.busca);

  const introCard = `
    <div class="card" style="margin-bottom:14px;background:var(--amber-100);border-color:var(--amber-500);">
      <p class="section-title" style="color:var(--navy-800);margin:0 0 4px;">🗑️ Lata de Lixo</p>
      <p style="font-size:13px;color:var(--navy-800);margin:0;">Tudo o que for eliminado em qualquer módulo passa primeiro por aqui. Os registos ficam guardados durante ${LIXEIRA_RETENCAO_DIAS} dias e podem ser restaurados nesse período; depois disso são eliminados automaticamente e de forma definitiva.</p>
    </div>`;

  if(!todos.length){
    return empresaCard + driveCard + storageCard + introCard + `<div class="card"><div class="empty"><div class="empty-title">A lata de lixo está vazia</div>Os registos eliminados em qualquer módulo aparecerão aqui.</div></div>`;
  }

  const filtrosHtml = `
    <div class="audit-filter-bar">
      <select onchange="lixeiraSet('modulo', this.value)">
        <option value="">Todos os módulos</option>
        ${modulosPresentes.map(m=>`<option value="${esc(m)}" ${lixeiraEstado.modulo===m?'selected':''}>${esc((LIXEIRA_MODULOS[m]||{}).label||m)}</option>`).join('')}
      </select>
      <select onchange="lixeiraSet('operador', this.value)">
        <option value="">Todos os operadores</option>
        ${operadoresPresentes.map(o=>`<option value="${esc(o)}" ${lixeiraEstado.operador===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
      <select onchange="lixeiraSet('periodo', this.value)">
        <option value="">Qualquer período</option>
        <option value="24h" ${lixeiraEstado.periodo==='24h'?'selected':''}>Últimas 24h</option>
        <option value="7d" ${lixeiraEstado.periodo==='7d'?'selected':''}>Últimos 7 dias</option>
        <option value="30d" ${lixeiraEstado.periodo==='30d'?'selected':''}>Últimos 30 dias</option>
      </select>
      <input placeholder="Pesquisar (descrição, operador, módulo...)" value="${esc(lixeiraEstado.busca)}" style="flex:1;min-width:180px;"
        onkeydown="if(event.key==='Enter') lixeiraSet('busca', this.value)">
      <select onchange="lixeiraSet('agrupar', this.value)">
        <option value="modulo" ${lixeiraEstado.agrupar==='modulo'?'selected':''}>Agrupar por módulo</option>
        <option value="operador" ${lixeiraEstado.agrupar==='operador'?'selected':''}>Agrupar por operador</option>
        <option value="periodo" ${lixeiraEstado.agrupar==='periodo'?'selected':''}>Agrupar por período</option>
        <option value="none" ${lixeiraEstado.agrupar==='none'?'selected':''}>Sem agrupar</option>
      </select>
      <select onchange="lixeiraSet('ordenar', this.value)">
        <option value="data_desc" ${lixeiraEstado.ordenar==='data_desc'?'selected':''}>Mais recentes primeiro</option>
        <option value="data_asc" ${lixeiraEstado.ordenar==='data_asc'?'selected':''}>Mais antigos primeiro</option>
        <option value="expira_asc" ${lixeiraEstado.ordenar==='expira_asc'?'selected':''}>A expirar em breve</option>
        <option value="modulo_az" ${lixeiraEstado.ordenar==='modulo_az'?'selected':''}>Módulo (A-Z)</option>
        <option value="operador_az" ${lixeiraEstado.ordenar==='operador_az'?'selected':''}>Operador (A-Z)</option>
      </select>
      ${filtrosActivos?`<button class="btn btn-ghost btn-sm" onclick="lixeiraLimparFiltros()">Limpar filtros</button>`:''}
      <button class="btn btn-danger-ghost btn-sm" onclick="esvaziarLixeira()">Esvaziar ${filtrosActivos?'filtrado':'tudo'}</button>
    </div>`;

  if(!ordenada.length){
    return empresaCard + driveCard + storageCard + introCard + filtrosHtml + `<div class="card"><div class="empty"><div class="empty-title">Nenhum item encontrado</div>Tente remover os filtros.</div></div>`;
  }

  const corpo = grupos.map(g=>`
    ${g.titulo?`<div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);padding:14px 0 6px;">${esc(g.titulo)} <span style="font-weight:400;">(${g.itens.length})</span></div>`:''}
    <div class="table-wrap"><table>
      <thead><tr><th>Item</th><th>Módulo</th><th>Eliminado por</th><th>Eliminado em</th><th>Prazo</th><th></th></tr></thead>
      <tbody>${g.itens.map(x=>{
        const dr = diasRestantesLixeira(x.expiraEm);
        const prazoCls = dr<=3?'danger':(dr<=7?'warning':'neutral');
        return `<tr>
          <td><strong>${esc(x.descricao)}</strong></td>
          <td><span class="badge info">${esc(x.moduloLabel)}</span></td>
          <td>${esc(x.operador||'—')}</td>
          <td>${fmtDataHora(x.apagadoEm)}</td>
          <td><span class="badge ${prazoCls}">${dr} dia(s)</span></td>
          <td class="tbl-actions">
            <button class="btn btn-ghost btn-sm" onclick="restaurarDaLixeira('${x.id}')">↺ Restaurar</button>
            <button class="btn btn-danger-ghost btn-sm" onclick="apagarPermanenteDaLixeira('${x.id}')">Eliminar definitivamente</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`).join('');

  return empresaCard + driveCard + storageCard + introCard + filtrosHtml + `<div class="card"><div class="flex-between" style="margin-bottom:12px;"><p class="section-title" style="margin:0;">${ordenada.length} de ${todos.length} item(ns)</p></div>${corpo}</div>`;
}

function opcoesNiveisAcessoHtml(roleSeleccionado){
  const niveis = (state.niveisAcesso||[]).slice().sort((a,b)=>{
    if(a.superAdmin!==b.superAdmin) return a.superAdmin?1:-1; // admin fica no fim da lista
    return a.nome.localeCompare(b.nome,'pt');
  });
  return niveis.map(n=>`<option value="${esc(n.id)}"${n.id===roleSeleccionado?' selected':''}>${esc(n.nome)}${n.superAdmin?' (acesso total)':''}</option>`).join('');
}
