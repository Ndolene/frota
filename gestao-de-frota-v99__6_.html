function salvarViatura(id){
  if(id ? naoPodeEditar('viaturas') : naoPodeCriar('viaturas')){ showToast('Sem permissão.','error'); return; }
  const matricula=document.getElementById('f-matricula').value.trim();
  if(!matricula){ showToast('Indique a matrícula.','error'); return; }
  const tipo=document.getElementById('f-tipo').value;
  const elCapacidade=document.getElementById('f-capacidade');
  const elCapacidadeTon=document.getElementById('f-capacidadeTon');
  const elCapacidadeM3=document.getElementById('f-capacidadeM3');
  const elTara=document.getElementById('f-tara');
  const elConsumo=document.getElementById('f-consumo');
  const elAno=document.getElementById('f-ano');
  const elTrelaFixa1=document.getElementById('f-trelaFixa1');
  const elTrelaFixa2=document.getElementById('f-trelaFixa2');
  if(elTrelaFixa1&&elTrelaFixa2&&elTrelaFixa1.value&&elTrelaFixa1.value===elTrelaFixa2.value){
    showToast('As duas trelas fixas não podem ser a mesma.','error'); return;
  }
  const trelaFixaIds=elTrelaFixa1?[elTrelaFixa1.value,elTrelaFixa2?elTrelaFixa2.value:''].filter(Boolean):[];
  const dados={
    matricula, modelo:document.getElementById('f-modelo').value.trim(), tipo,
    capacidade:elCapacidade?Number(elCapacidade.value)||0:0,
    capacidadeTon:elCapacidadeTon?Number(elCapacidadeTon.value)||0:0,
    capacidadeM3:elCapacidadeM3?Number(elCapacidadeM3.value)||0:0,
    tara:elTara?Number(elTara.value)||0:0,
    consumoEsperado:elConsumo?Number(elConsumo.value)||0:0,
    ano:elAno?elAno.value.trim():'',
    trelaFixaIds,
    chassis:document.getElementById('f-chassis').value.trim(),
    cor:document.getElementById('f-cor').value.trim(),
    obs:document.getElementById('f-obs').value.trim(),
    estadoManual:document.getElementById('f-estado').value,
  };
  let savedId;
  if(id){ Object.assign(getViatura(id),dados); savedId=id; audit('update','viatura',id,`Viatura ${dados.matricula} editada`,`Modelo: ${dados.modelo||'—'} · Estado: ${dados.estadoManual}`); }
  else{ const vt=Object.assign({id:uid('vt')},dados); state.viaturas.push(vt); savedId=vt.id; audit('create','viatura',savedId,`Nova viatura registada: ${dados.matricula}`,`Modelo: ${dados.modelo||'—'} · Lugares: ${dados.capacidade}`); }
  saveState(); closeModal(); renderContent();
  showToast('Viatura guardada.','success');
}

function apagarViatura(id){
  if(naoPodeApagar('viaturas')){ showToast('Sem permissão.','error'); return; }
  const vt=getViatura(id);
  confirmAction('Apagar esta viatura?',()=>{
    moverParaLixeira('viatura', vt, `Viatura eliminada: ${vt?vt.matricula:'—'}`);
    state.viaturas=state.viaturas.filter(v=>v.id!==id);

/* ============================== ALUGUER DE VIATURAS ==============================
   Contratos em que a NTL aluga uma das suas viaturas (autocarro ou camião) a um cliente
   (pessoa singular ou coletiva) — a NTL é sempre quem aluga aos seus clientes, nunca o
   contrário. O comportamento varia consoante as opções escolhidas em cada contrato:
   - Regime "exclusivo": a viatura fica reservada ao cliente enquanto o contrato estiver
     ativo e dentro do período — deixa de poder ser escolhida para novas viagens normais
     da NTL (bilheteira/carga). Regime "não exclusivo": continua disponível em paralelo.
   - Operador "com operador": a NTL destaca motorista(s) da própria tripulação para o
     aluguer. "Sem operador": só a viatura é entregue ao cliente.
   - Tarifário "fixo": renda periódica de valor acordado. "Variável": valor por km, por
     viagem ou por dia, calculado a partir da quantidade indicada em cada cobrança.
   Cada contrato acumula uma lista de "cobranças" (rendas emitidas), que podem ser enviadas
   à contabilidade individualmente — débito Caixa (pago no ato) ou Clientes a Receber (a
   crédito), crédito Receita de Aluguer — no mesmo princípio das viagens de carga. */
function getContratoAluguer(id){ return (state.contratosAluguer||[]).find(c=>c.id===id); }

// Único ponto que decide se uma viatura está bloqueada para operações normais da NTL:
// só acontece com um contrato ATIVO, em regime EXCLUSIVO, e dentro do período do contrato.
function contratoExclusivoAtivoParaViatura(viaturaId){
  const hoje=new Date();
  return (state.contratosAluguer||[]).find(c=>{
    if(c.viaturaId!==viaturaId||c.regime!=='exclusivo'||c.estado!=='ativo') return false;
    if(c.dataInicio && new Date(c.dataInicio)>hoje) return false;
    if(c.dataFim && new Date(c.dataFim)<hoje) return false;
    return true;
  });
}
function labelRegimeAluguer(r){ return r==='exclusivo'?'Exclusividade':'Não exclusivo'; }
function labelOperadorAluguer(o){ return o==='sem_operador'?'Sem operador (só a viatura)':'Com operador (motorista/tripulação NTL)'; }
function labelTarifarioAluguer(t){ return t==='variavel'?'Variável (km/viagem/dia)':'Renda fixa periódica'; }
function labelUnidadeVariavel(u){ return {km:'por km',viagem:'por viagem',dia:'por dia'}[u]||'por km'; }
function labelEstadoContrato(e){ return {ativo:'Ativo',suspenso:'Suspenso',terminado:'Terminado'}[e]||'Ativo'; }
function clsEstadoContrato(e){ return {ativo:'success',suspenso:'warning',terminado:'neutral'}[e]||'success'; }

function calcularValorCobranca(cb){
  if((cb.modeloCobranca||'fixo')==='variavel') return (Number(cb.quantidade)||0)*(Number(cb.valorUnitario)||0);
  return Number(cb.valor)||0;
}
function labelCategoriaDespesaAluguer(cat){
  return {combustivel:'Combustível',manutencao:'Manutenção/Reparação',portagens:'Portagens',motorista:'Ajudas de custo do motorista',seguro:'Seguro',outros:'Outros'}[cat]||'Outros';
}
function financeiroContrato(contrato){
  const cobrancas=contrato.cobrancas||[];
  const despesas=contrato.despesas||[];
  let receita=0, recebido=0, aReceber=0;
  cobrancas.forEach(cb=>{
    const val=calcularValorCobranca(cb);
    receita+=val;
    if((cb.statusPagamento||'pago')==='pago') recebido+=val; else aReceber+=val;
  });
  const totalDespesas=despesas.reduce((s,d)=>s+(Number(d.valor)||0),0);
  return {receita, recebido, aReceber, totalDespesas, lucro:receita-totalDespesas};
}

function camposTarifarioAluguer(c){

  if(tarifario==='variavel'){
    return `
    <div class="form-cols2">

          <option value="semanal" ${c&&c.periodicidade==='semanal'?'selected':''}>Semanal</option>

function salvarContratoAluguer(id){
  if(id ? naoPodeEditar('aluguer') : naoPodeCriar('aluguer')){ showToast('Sem permissão.','error'); return; }
  const viaturaId=document.getElementById('f-ca-viatura').value;
  const clienteNome=document.getElementById('f-ca-clienteNome').value.trim();
  if(!viaturaId||!clienteNome){ showToast('Selecione a viatura e indique o nome do cliente.','error'); return; }
  const operador=document.getElementById('f-ca-operador').value;
  const motoristaIds=operador==='com_operador'?[...document.querySelectorAll('.ca-motorista-chk:checked')].map(el=>el.value):[];
  const tarifario=document.getElementById('f-ca-tarifario').value;
  const elValorRenda=document.getElementById('f-ca-valorRenda');
  const elPeriodicidade=document.getElementById('f-ca-periodicidade');
  const elValorUnitario=document.getElementById('f-ca-valorUnitario');
  const elUnidade=document.getElementById('f-ca-unidade');
  const inicio=document.getElementById('f-ca-inicio').value;
  const fim=document.getElementById('f-ca-fim').value;
  const dados={
    viaturaId, clienteNome,
    clienteTipo:document.getElementById('f-ca-clienteTipo').value,
    clienteNuit:document.getElementById('f-ca-clienteNuit').value.trim(),
    clienteContacto:document.getElementById('f-ca-clienteContacto').value.trim(),
    clienteEndereco:document.getElementById('f-ca-clienteEndereco').value.trim(),
    regime:document.getElementById('f-ca-regime').value,
    operador, motoristaIds,
    tarifario,
    valorRenda:elValorRenda?Number(elValorRenda.value)||0:0,
    periodicidade:elPeriodicidade?elPeriodicidade.value:'mensal',
    valorUnitario:elValorUnitario?Number(elValorUnitario.value)||0:0,
    unidadeVariavel:elUnidade?elUnidade.value:'km',
    dataInicio:inicio?new Date(inicio).toISOString():null,
    dataFim:fim?new Date(fim).toISOString():null,
    estado:document.getElementById('f-ca-estado').value,
    obs:document.getElementById('f-ca-obs').value.trim(),
  };
  let savedId;
  if(id){ const c=getContratoAluguer(id); Object.assign(c,dados); savedId=id; audit('update','contratoAluguer',id,`Contrato de aluguer editado: ${dados.clienteNome}`,`Regime: ${labelRegimeAluguer(dados.regime)}`); }
  else{ const novo=Object.assign({id:uid('ca'),cobrancas:[],despesas:[]},dados); if(!state.contratosAluguer) state.contratosAluguer=[]; state.contratosAluguer.push(novo); savedId=novo.id; audit('create','contratoAluguer',savedId,`Novo contrato de aluguer: ${dados.clienteNome}`,`Regime: ${labelRegimeAluguer(dados.regime)}`); }
  saveState(); closeModal(); renderContent();
  showToast('Contrato de aluguer guardado.','success');
}

function apagarContratoAluguer(id){
  if(naoPodeApagar('aluguer')){ showToast('Sem permissão.','error'); return; }
  const c=getContratoAluguer(id);
  confirmAction('Apagar este contrato de aluguer?',()=>{
    moverParaLixeira('contratoAluguer', c, `Contrato de aluguer eliminado: ${c?c.clienteNome:'—'}`);
    state.contratosAluguer=(state.contratosAluguer||[]).filter(x=>x.id!==id);
    saveState(); renderContent();
    showToast('Contrato movido para a lata de lixo.','success');
  });
}

  }
  return '';
}
function formCobranca(contratoId, cobrancaId){
  const c=getContratoAluguer(contratoId); if(!c) return;
  const cb=cobrancaId?(c.cobrancas||[]).find(x=>x.id===cobrancaId):null;
  const variavel=c.tarifario==='variavel';
  openModal(`
    <p class="modal-title">${cb?'Editar cobrança':'Registar cobrança'}</p>
    <div class="form-cols2">
      <div class="form-row"><label>Data</label><input id="f-cb-data" type="date" value="${cb&&cb.data?cb.data.slice(0,10):new Date().toISOString().slice(0,10)}"></div>
      <div class="form-row"><label>Descrição</label><input id="f-cb-descricao" value="${esc(cb?cb.descricao:(c.tarifario==='fixo'?'Renda '+c.periodicidade:''))}" placeholder="Ex: Renda de Julho/2026"></div>
    </div>
    ${variavel?`
    <div class="form-cols2">
      <div class="form-row"><label>Quantidade (${labelUnidadeVariavel(c.unidadeVariavel)})</label><input id="f-cb-quantidade" type="number" min="0" step="0.1" value="${cb?(cb.quantidade||''):''}"></div>
      <div class="form-row"><label>Valor unitário (MT)</label><input id="f-cb-valorUnitario" type="number" min="0" step="0.01" value="${cb?(cb.valorUnitario||c.valorUnitario||''):(c.valorUnitario||'')}"></div>
    </div>`:`
    <div class="form-row"><label>Valor (MT)</label><input id="f-cb-valor" type="number" min="0" step="0.01" value="${cb?(cb.valor||''):(c.valorRenda||'')}"></div>`}
    <div class="form-row"><label>Pagamento</label>
      <select id="f-cb-statusPagamento" onchange="document.getElementById('f-cb-campos-pagamento').innerHTML=camposPagamentoCobranca({statusPagamento:this.value})">
        <option value="pago" ${(!cb||cb.statusPagamento==='pago'||!cb.statusPagamento)?'selected':''}>Pago no ato</option>
        <option value="credito" ${cb&&cb.statusPagamento==='credito'?'selected':''}>A crédito (a prazo)</option>
      </select>
    </div>
    <div id="f-cb-campos-pagamento">${camposPagamentoCobranca(cb)}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="verContratoAluguer('${contratoId}')">Cancelar</button>

    </div>`);

function salvarCobranca(contratoId, cobrancaId){
  const c=getContratoAluguer(contratoId); if(!c) return;
  if(cobrancaId ? naoPodeEditar('aluguer') : naoPodeCriar('aluguer')){ showToast('Sem permissão.','error'); return; }
  const data=document.getElementById('f-cb-data').value;
  if(!data){ showToast('Indique a data.','error'); return; }
  const statusPagamento=document.getElementById('f-cb-statusPagamento').value;
  const elVencimento=document.getElementById('f-cb-vencimento');
  const variavel=c.tarifario==='variavel';
  const dados={
    data:new Date(data).toISOString(),
    descricao:document.getElementById('f-cb-descricao').value.trim(),
    modeloCobranca:c.tarifario,
    statusPagamento,
    dataVencimento:(statusPagamento==='credito'&&elVencimento&&elVencimento.value)?new Date(elVencimento.value).toISOString():null,
  };
  if(variavel){
    dados.quantidade=Number(document.getElementById('f-cb-quantidade').value)||0;
    dados.valorUnitario=Number(document.getElementById('f-cb-valorUnitario').value)||0;
    dados.unidadeVariavel=c.unidadeVariavel;
  } else {
    dados.valor=Number(document.getElementById('f-cb-valor').value)||0;
  }
  if(!c.cobrancas) c.cobrancas=[];
  if(cobrancaId){
    const cb=c.cobrancas.find(x=>x.id===cobrancaId);
    if(cb&&cb.enviadoContabilidade){ showToast('Esta cobrança já foi enviada à contabilidade e não pode ser editada.','error'); return; }
    if(cb) Object.assign(cb,dados);
    audit('update','contratoAluguer',c.id,`Cobrança editada (${c.clienteNome})`,'');
  } else {
    c.cobrancas.push(Object.assign({id:uid('cb')},dados));
    audit('update','contratoAluguer',c.id,`Cobrança registada (${c.clienteNome})`,'');
  }
  saveState(); verContratoAluguer(contratoId);
  showToast('Cobrança guardada.','success');
}

function apagarCobranca(contratoId, cobrancaId){
  const c=getContratoAluguer(contratoId); if(!c) return;
  if(naoPodeApagar('aluguer')){ showToast('Sem permissão.','error'); return; }
  const cb=(c.cobrancas||[]).find(x=>x.id===cobrancaId);
  if(cb&&cb.enviadoContabilidade){ showToast('Esta cobrança já foi enviada à contabilidade e não pode ser apagada.','error'); return; }
  confirmAction('Apagar esta cobrança?',()=>{
    c.cobrancas=(c.cobrancas||[]).filter(x=>x.id!==cobrancaId);
    audit('update','contratoAluguer',c.id,'Cobrança removida','');
    saveState(); verContratoAluguer(contratoId);
    showToast('Cobrança removida.','success');
  });
}

function construirLinhasAutomaticasCobranca(cobranca){
  const cfg=state.configContabilidade||{};
  if(!cfg.contaReceitaAluguer) return {linhas:[], erro:'Falta configurar a Conta de Receita de Aluguer (Contabilidade → Contabilidade Geral → Configurações).'};
  const valor=calcularValorCobranca(cobranca);
  if(!valor) return {linhas:[], erro:'Esta cobrança não tem valor para lançar.'};
  const pago=(cobranca.statusPagamento||'pago')==='pago';
  const contaContrapartida=pago?cfg.contaCaixa:cfg.contaClientesAReceber;
  if(!contaContrapartida) return {linhas:[], erro:pago?'Falta configurar a Conta de Caixa.':'Falta configurar a Conta de Clientes a Receber.'};
  return {linhas:[
    {contaId:contaContrapartida, debito:Math.round(valor*100)/100, credito:0},
    {contaId:cfg.contaReceitaAluguer, debito:0, credito:Math.round(valor*100)/100},
  ], erro:null};
}

function enviarCobrancaContabilidade(contratoId, cobrancaId){
  if(naoPodeEditar('aluguer')){ showToast('Sem permissão.','error'); return; }
  const c=getContratoAluguer(contratoId); if(!c) return;
  const cb=(c.cobrancas||[]).find(x=>x.id===cobrancaId); if(!cb) return;
  if(cb.enviadoContabilidade){ showToast('Esta cobrança já foi enviada à contabilidade.','error'); return; }
  const vt=getViatura(c.viaturaId);
  const {linhas, erro}=construirLinhasAutomaticasCobranca(cb);
  if(erro){ showToast(erro,'error'); return; }
  if(!state.lancamentos) state.lancamentos=[];
  const numero='JD-'+String(((state.lancamentos||[]).length)+1).padStart(4,'0');
  const lancamento={
    id:uid('lc'), numero,
    data:(cb.data||new Date().toISOString()).slice(0,10),
    descricao:`Aluguer de viatura ${vt?vt.matricula:'?'} · ${c.clienteNome} · ${cb.descricao||fmtData(cb.data)} (gerado automaticamente)`,
    linhas,
    origemContratoAluguerId:c.id, origemCobrancaId:cb.id,
  };
  state.lancamentos.push(lancamento);
  cb.enviadoContabilidade=true; cb.lancamentoAutoId=lancamento.id;
  audit('action','contratoAluguer',c.id,`Cobrança enviada à contabilidade: ${c.clienteNome}`,`Lançamento ${numero} gerado automaticamente`);
  saveState(); verContratoAluguer(contratoId);
  showToast(`Cobrança enviada à contabilidade. Lançamento ${numero} criado.`,'success');
}

function salvarDespesaAluguer(contratoId, despesaId){
  const c=getContratoAluguer(contratoId); if(!c) return;
  if(despesaId ? naoPodeEditar('aluguer') : naoPodeCriar('aluguer')){ showToast('Sem permissão.','error'); return; }
  const data=document.getElementById('f-da-data').value;
  if(!data){ showToast('Indique a data.','error'); return; }
  const dados={
    data:new Date(data).toISOString(),
    categoria:document.getElementById('f-da-categoria').value,
    descricao:document.getElementById('f-da-descricao').value.trim(),
    valor:Number(document.getElementById('f-da-valor').value)||0,
  };
  if(!c.despesas) c.despesas=[];
  if(despesaId){
    const d=c.despesas.find(x=>x.id===despesaId);
    if(d) Object.assign(d,dados);
    audit('update','contratoAluguer',c.id,`Despesa editada (${c.clienteNome})`,'');
  } else {
    c.despesas.push(Object.assign({id:uid('da')},dados));
    audit('update','contratoAluguer',c.id,`Despesa registada (${c.clienteNome})`,'');
  }
  saveState(); verContratoAluguer(contratoId);
  showToast('Despesa guardada.','success');
}

function apagarDespesaAluguer(contratoId, despesaId){
  const c=getContratoAluguer(contratoId); if(!c) return;
  if(naoPodeApagar('aluguer')){ showToast('Sem permissão.','error'); return; }
  confirmAction('Apagar esta despesa?',()=>{
    c.despesas=(c.despesas||[]).filter(x=>x.id!==despesaId);
    audit('update','contratoAluguer',c.id,'Despesa removida','');
    saveState(); verContratoAluguer(contratoId);
    showToast('Despesa removida.','success');
  });
}

function salvarRota(id){
  if(id ? naoPodeEditar('rotas') : naoPodeCriar('rotas')){ showToast('Sem permissão.','error'); return; }
  const nome=document.getElementById('f-rota-nome').value.trim();
  if(!nome){ showToast('Indique o nome da rota.','error'); return; }
  const nomes=[...document.querySelectorAll('[data-troco-nome]')].map(e=>e.value.trim());

  showToast('Rota guardada.','success');

      <div class="form-row"><label>Validade</label><input id="f-doc-validade" type="date" value="${d?d.dataValidade:''}"></div>

        </select>

}

function atualizarOpcoesEntidadeDoc(){
  document.getElementById('f-doc-entidade-id').innerHTML=opcoesEntidade(document.getElementById('f-doc-entidade-tipo').value,null);
}

function salvarDocumento(id){
  if(id ? naoPodeEditar('documentos') : naoPodeCriar('documentos')){ showToast('Sem permissão.','error'); return; }
  const dataValidade=document.getElementById('f-doc-validade').value;
  const entidadeId=document.getElementById('f-doc-entidade-id').value;
  if(!dataValidade||!entidadeId){ showToast('Preencha a validade e associe a uma entidade.','error'); return; }
  const dados={tipo:document.getElementById('f-doc-tipo').value,entidadeTipo:document.getElementById('f-doc-entidade-tipo').value,entidadeId,dataValidade,descricao:document.getElementById('f-doc-descricao').value.trim()};
  let savedDId;
  if(id){ Object.assign(state.documentos.find(x=>x.id===id),dados); savedDId=id; audit('update','documento',id,`Documento "${dados.tipo}" editado`,`Validade: ${dados.dataValidade} · Associado a: ${dados.entidadeId}`); }
  else{ const dc=Object.assign({id:uid('dc')},dados); state.documentos.push(dc); savedDId=dc.id; audit('create','documento',savedDId,`Novo documento: "${dados.tipo}"`,`Validade: ${dados.dataValidade}`); }
  saveState(); closeModal(); renderContent();
  showToast('Documento guardado.','success');
}

function apagarDocumento(id){
  if(naoPodeApagar('documentos')){ showToast('Sem permissão.','error'); return; }
  const d=state.documentos.find(x=>x.id===id);
  confirmAction('Apagar este documento?',()=>{
    moverParaLixeira('documento', d, `Documento eliminado: "${d?d.tipo:'—'}" (válido até ${d?fmtData(d.dataValidade):'?'})`);
    state.documentos=state.documentos.filter(x=>x.id!==id);
    saveState(); renderContent();
    showToast('Movido para a lata de lixo.','success');
  });
}

function viewCombustivel(){
  const linhas=state.viagens.filter(v=>v.kmInicio!=null&&v.kmFim!=null).map(v=>({viagem:v,c:combustivelCalculado(v)})).filter(x=>x.c);
  if(!linhas.length) return `<div class="card"><div class="empty"><div class="empty-title">Sem dados de combustível</div>Os dados aparecem automaticamente quando registar km e litros em cada viagem.</div></div>`;
  const totalDesvios=linhas.filter(x=>x.c.desvio).length;
  const grupos = aoAplicar(linhas, 'combustivel', COMBUSTIVEL_AO_CONFIG);
  const thead = `<tr><th>Data</th><th>Viatura</th><th>Trajeto</th><th>Distância</th><th>Litros esp.</th><th>Litros reais</th><th>Diferença</th><th></th></tr>`;
  const linha = x=>{
    const v=x.viagem, c=x.c, vt=getViatura(v.viaturaId);
    return `<tr>
      <td>${fmtData(v.dataInicio)}</td>
      <td>${esc(vt?vt.matricula:'—')}</td>
      <td>${esc(v.localPartida||'—')} → ${esc(v.localDestino||'—')}</td>
      <td class="num">${fmtNum(c.distancia,0)} km</td>
      <td class="num">${fmtNum(c.litrosEsperados,1)} L</td>
      <td class="num">${fmtNum(c.litrosReais,1)} L</td>
      <td class="num">${c.diffPct>=0?'+':''}${fmtNum(c.diffPct,0)}%</td>
      <td>${c.desvio?'<span class="badge danger">Desvio</span>':'<span class="badge success">Normal</span>'}</td>
    </tr>`;
  };
  return `
    <div class="grid grid-stats" style="margin-bottom:16px;">
      <div class="stat-card${totalDesvios?' alert':' ok'}">
        <div class="stat-label">Possíveis desvios</div>
        <div class="stat-value">${totalDesvios}</div>
        <div class="stat-sub">de ${linhas.length} viagens com dados</div>
      </div>
    </div>
    <div style="margin-bottom:14px;">${renderAgruparOrdenarBar('combustivel', COMBUSTIVEL_AO_CONFIG)}</div>
    <div class="card">${aoRenderTabelaAgrupada(grupos, thead, linha)}</div>`;
}

let financeiroFiltro='mes';

function viagensNoPeriodo(filtro){
  const hoje=new Date();
  return state.viagens.filter(v=>{
    if(v.status!=='concluida'||!v.dataFim) return false;
    const d=new Date(v.dataFim);
    if(filtro==='hoje') return d.toDateString()===hoje.toDateString();
    if(filtro==='semana'){ const df=(hoje-d)/86400000; return df>=0&&df<=7; }
    if(filtro==='mes') return d.getFullYear()===hoje.getFullYear()&&d.getMonth()===hoje.getMonth();
    return true;
  });
}

function estadoCaixaLabel(v){
  const ec=v.estadoCaixa||'cobrador';
  if(ec==='cobrador') return {label:'Com o cobrador',cls:'warning'};
  if(ec==='parcial') return {label:'Entrega parcial',cls:'info'};
  return {label:'No caixa',cls:'success'};
}

function classeLabelPorNumero(n){ const c=PLANO_CONTAS_CLASSES.find(x=>x.n===Number(n)); return c?c.label:'—'; }
function naturezaSugerida(classe){ return [1,2,3,6].includes(Number(classe))?'devedora':'credora'; }
function getConta(id){ return (state.planoContas||[]).find(c=>c.id===id); }

// Uma "conta mãe" é uma conta que tem sub-contas (outra conta cujo código começa por "<código>.").
// Só se pode lançar movimentos em contas de último grau (contas-folha, sem sub-contas).
function contaTemSubcontas(contaId){
  const conta = getConta(contaId);
  if(!conta) return false;
  const prefixo = conta.codigo+'.';
  return (state.planoContas||[]).some(c=>c.id!==conta.id && String(c.codigo).startsWith(prefixo));
}
function contaEhMovimentavel(contaId){ return !!getConta(contaId) && !contaTemSubcontas(contaId); }
// Contas de último grau (folha) disponíveis para lançamento no Diário
function contasMovimentaveis(){ return contasOrdenadas().filter(c=>!contaTemSubcontas(c.id)); }

const CLASSE_TITULOS = {
  1:'Meios financeiros',
  2:'Inventários e activos biológicos',
  3:'Investimentos de capital',
  4:'Contas a receber, contas a pagar, acréscimos e diferimentos',
  5:'Capital Próprio',
  6:'Gastos e perdas',
  7:'Rendimentos e ganhos',
  8:'Resultados',
};
function classeTitulo(n){ return CLASSE_TITULOS[Number(n)] || 'Sem classe'; }

// Compara códigos hierarquicamente por segmento numérico (ex: 2.1 < 2.1.1 < 2.2 < 2.10),
// em vez de comparação de texto simples, para que a árvore de contas fique correctamente ordenada.
function compareCodigos(a,b){
  const pa = String(a).split('.').map(Number);
  const pb = String(b).split('.').map(Number);
  const len = Math.max(pa.length, pb.length);
  for(let i=0;i<len;i++){
    const va = (pa[i]===undefined||isNaN(pa[i])) ? -1 : pa[i];
    const vb = (pb[i]===undefined||isNaN(pb[i])) ? -1 : pb[i];
    if(va!==vb) return va-vb;
  }
  return 0;
}
function grauDaConta(codigo){ return String(codigo).split('.').length; }
function contasOrdenadas(){ return [...(state.planoContas||[])].sort((a,b)=>compareCodigos(a.codigo,b.codigo)); }
function contasAgrupadasPorClasse(){
  const porClasse = {};
  (state.planoContas||[]).forEach(c=>{
    const cl = Number(c.classe)||0;
    if(!porClasse[cl]) porClasse[cl]=[];
    porClasse[cl].push(c);
  });
  return Object.keys(porClasse).map(Number).sort((a,b)=>a-b).map(cl=>({
    classe: cl,
    contas: porClasse[cl].sort((a,b)=>compareCodigos(a.codigo,b.codigo)),
  }));
}

function carregarPlanoContasOficial(){
  if(naoPodeCriar('financeiro')){ showToast('Sem permissão.','error'); return; }
  const existentes = new Set((state.planoContas||[]).map(c=>c.codigo));
  const novas = PGC_PE_PLANO_CONTAS.filter(c=>!existentes.has(c.codigo));
  if(!novas.length){ showToast('O plano de contas oficial (PGC-PE) já está todo carregado.',''); return; }
  confirmAction(`Carregar ${novas.length} conta(s) do plano oficial (PGC-PE) que ainda não existem no sistema? Contas já existentes com o mesmo código não serão alteradas.`, ()=>{
    if(!state.planoContas) state.planoContas=[];
    novas.forEach(c=>{ state.planoContas.push(Object.assign({id:uid('pc'),ativa:true}, c)); });
    audit('action','planoConta',null,`Plano de contas oficial (PGC-PE) carregado`,`${novas.length} conta(s) adicionada(s)`);
    saveState(); renderContent();
    showToast(`${novas.length} conta(s) adicionada(s) a partir do plano oficial.`,'success');
  });
}

function salvarConta(id){
  if(id ? naoPodeEditar('financeiro') : naoPodeCriar('financeiro')){ showToast('Sem permissão.','error'); return; }
  const codigo=document.getElementById('f-conta-codigo').value.trim();
  const designacao=document.getElementById('f-conta-designacao').value.trim();
  const classe=Number(document.getElementById('f-conta-classe').value);
  const natureza=document.getElementById('f-conta-natureza').value;
  const ativa=document.getElementById('f-conta-ativa').value==='1';
  if(!codigo){ showToast('Indique o código da conta.','error'); return; }
  if(!designacao){ showToast('Indique a designação da conta.','error'); return; }
  const duplicada=(state.planoContas||[]).find(x=>x.codigo===codigo && x.id!==id);
  if(duplicada){ showToast('Já existe uma conta com este código.','error'); return; }
  if(!state.planoContas) state.planoContas=[];
  if(id){
    const c=getConta(id); c.codigo=codigo; c.designacao=designacao; c.classe=classe; c.natureza=natureza; c.ativa=ativa;
    audit('update','planoConta',id,`Conta "${codigo} - ${designacao}" editada`);
  } else {
    const c={id:uid('pc'),codigo,designacao,classe,natureza,ativa};
    state.planoContas.push(c);
    audit('create','planoConta',c.id,`Nova conta criada: "${codigo} - ${designacao}"`);
  }
  saveState(); closeModal(); renderContent();
  showToast('Conta guardada.','success');
}

function apagarConta(id){
  if(naoPodeApagar('financeiro')){ showToast('Sem permissão.','error'); return; }
  const c=getConta(id);
  const emUso=(state.lancamentos||[]).some(l=>(l.linhas||[]).some(li=>li.contaId===id));
  if(emUso){ showToast('Esta conta tem lançamentos no Diário e não pode ser apagada. Pode marcá-la como inactiva.','error'); return; }
  confirmAction('Apagar esta conta?',()=>{
    moverParaLixeira('planoConta', c, `Conta eliminada: "${c?c.codigo+' - '+c.designacao:'—'}"`);
    state.planoContas=state.planoContas.filter(x=>x.id!==id);
    saveState(); renderContent();
    showToast('Conta movida para a lata de lixo.','success');
  });
}

function salvarLancamento(id, pendingId){
  if(id ? naoPodeEditar('financeiro') : naoPodeCriar('financeiro')){ showToast('Sem permissão.','error'); return; }
  const data=document.getElementById('f-lanc-data').value;
  const numero=document.getElementById('f-lanc-numero').value.trim();
  const descricao=document.getElementById('f-lanc-descricao').value.trim();
  if(!data){ showToast('Indique a data do lançamento.','error'); return; }
  if(!descricao){ showToast('Indique a descrição do lançamento.','error'); return; }
  const contaEls=[...document.querySelectorAll('[data-linha-conta]')];
  const debEls=[...document.querySelectorAll('[data-linha-debito]')];
  const credEls=[...document.querySelectorAll('[data-linha-credito]')];
  const linhas=contaEls.map((el,i)=>({contaId:el.value,debito:Number(debEls[i].value)||0,credito:Number(credEls[i].value)||0}))
    .filter(li=>li.contaId && (li.debito>0||li.credito>0));
  if(linhas.length<2){ showToast('Indique pelo menos duas linhas de movimento (débito e crédito).','error'); return; }
  const contaMae = linhas.map(li=>getConta(li.contaId)).find(c=>c && contaTemSubcontas(c.id));
  if(contaMae){ showToast(`A conta "${contaMae.codigo} - ${contaMae.designacao}" tem sub-contas e não pode receber lançamentos directamente. Escolha a sub-conta de último grau correcta.`,'error'); return; }
  const totalDeb=linhas.reduce((s,x)=>s+x.debito,0);
  const totalCred=linhas.reduce((s,x)=>s+x.credito,0);
  if(Math.abs(totalDeb-totalCred)>0.01){ showToast(`O lançamento não está equilibrado: débito ${fmtMT(totalDeb)} ≠ crédito ${fmtMT(totalCred)}.`,'error'); return; }
  if(!state.lancamentos) state.lancamentos=[];
  let lancamentoId=id;
  if(id){
    const l=getLancamento(id); l.data=data; l.numero=numero; l.descricao=descricao; l.linhas=linhas;
    audit('update','lancamento',id,`Lançamento "${numero}" editado`,`Total: ${fmtMT(totalDeb)}`);
  } else {
    const l={id:uid('ld'),data,numero,descricao,linhas,criadoEm:new Date().toISOString()};
    state.lancamentos.push(l);
    lancamentoId=l.id;
    audit('create','lancamento',l.id,`Novo lançamento criado: "${numero}"`,`Total: ${fmtMT(totalDeb)}`);
  }
  if(pendingId){
    const registo=getRegistoPendente(pendingId);
    if(registo){
      registo.status='processado';
      registo.lancamentoId=lancamentoId;
      registo.processadoEm=new Date().toISOString();
      audit('update','registoPendenteContabilidade',registo.id,`Registo pendente processado: "${registo.descricaoSugerida}"`,`Lançamento: ${numero}`);
    }
  }
  saveState(); closeModal(); renderContent();
  showToast('Lançamento guardado.','success');
}

function apagarLancamento(id){
  if(naoPodeApagar('financeiro')){ showToast('Sem permissão.','error'); return; }
  const l=getLancamento(id);

/* ── Balancete de Verificação ── */
let balanceteFiltro = {inicio:'', fim:''};

function calcularBalancete(inicio, fim){
  const porConta = {};
  (state.lancamentos||[]).forEach(l=>{
    if(inicio && l.data<inicio) return;
    if(fim && l.data>fim) return;
    (l.linhas||[]).forEach(li=>{
      if(!porConta[li.contaId]) porConta[li.contaId]={debito:0,credito:0};
      porConta[li.contaId].debito += Number(li.debito||0);
      porConta[li.contaId].credito += Number(li.credito||0);
    });
  });
  const linhas = contasOrdenadas().filter(c=>porConta[c.id]).map(c=>{
    const t=porConta[c.id];
    const saldo=t.debito-t.credito;
    return {conta:c, debito:t.debito, credito:t.credito, saldoDevedor:saldo>0?saldo:0, saldoCredor:saldo<0?-saldo:0};
  });
  const totais=linhas.reduce((acc,l)=>{ acc.debito+=l.debito; acc.credito+=l.credito; acc.saldoDevedor+=l.saldoDevedor; acc.saldoCredor+=l.saldoCredor; return acc; },{debito:0,credito:0,saldoDevedor:0,saldoCredor:0});
  return {linhas, totais};
}

function viewBalancete(){
  const {linhas, totais} = calcularBalancete(balanceteFiltro.inicio, balanceteFiltro.fim);
  const equilibrado = Math.abs(totais.debito-totais.credito)<0.01;
  return `

      </div>
    </div>
    <div class="flex-between" style="margin-bottom:14px;">
      <span class="badge ${equilibrado?'success':'danger'}">${equilibrado?'Balancete equilibrado':'Balancete não equilibrado'}</span>
      <button class="btn btn-ghost btn-sm" onclick="imprimirBalancete()">Imprimir</button>
    </div>
    <div class="card">

let extratoContaFiltro = {contaId:'', inicio:'', fim:''};

function calcularExtratoConta(contaId, inicio, fim){
  const conta = getConta(contaId);
  if(!conta) return {conta:null, saldoInicial:0, movimentos:[], saldoFinal:0};
  const todos=[];
  (state.lancamentos||[]).forEach(l=>{
    (l.linhas||[]).forEach(li=>{
      if(li.contaId===contaId){
        todos.push({data:l.data, numero:l.numero, descricao:l.descricao, debito:Number(li.debito||0), credito:Number(li.credito||0), lancamentoId:l.id});
      }
    });
  });
  todos.sort((a,b)=>new Date(a.data)-new Date(b.data) || String(a.numero||'').localeCompare(String(b.numero||'')));
  let saldoInicial=0;
  todos.forEach(m=>{ if(inicio && m.data<inicio) saldoInicial += m.debito-m.credito; });
  let saldo=saldoInicial;
  const movimentos=[];
  todos.forEach(m=>{
    if(inicio && m.data<inicio) return;
    if(fim && m.data>fim) return;
    saldo += m.debito-m.credito;
    movimentos.push({...m, saldo});
  });
  return {conta, saldoInicial, movimentos, saldoFinal:saldo};
}
function fmtSaldoDC(v){ return Math.abs(v)<0.005 ? fmtMT(0) : (v>0?`${fmtMT(v)} D`:`${fmtMT(-v)} C`); }

const ATENDIMENTO_ORIGENS=['WhatsApp','Chamada telefónica','Facebook','Instagram','Indicação de alguém','Rua / Terminal','Google','Outro'];

  {id:'novo',           label:'Novo',                       cls:'info'},
  {id:'em_atendimento', label:'Em atendimento',             cls:'warning'},
  {id:'aguardando',     label:'Aguardando o cliente',        cls:'neutral'},
  {id:'agendado',       label:'Contacto agendado',           cls:'warning'},
  {id:'resolvido',      label:'Resolvido',                   cls:'success'},
  {id:'perdido',        label:'Perdido / sem resposta',      cls:'danger'},
];
function atendimentoEstadoInfo(id){ return ATENDIMENTO_ESTADOS.find(e=>e.id===id) || ATENDIMENTO_ESTADOS[0]; }

// Estado do próximo contacto combinado: atrasado (já passou e continua por resolver), hoje, em breve, ou nenhum.
function statusProximoContacto(a){
  if(!a.proximoContacto || a.estado==='resolvido' || a.estado==='perdido') return null;
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const alvo=new Date(a.proximoContacto+'T00:00:00');
  const dias=Math.round((alvo-hoje)/(24*60*60*1000));
  if(dias<0) return {label:`Atrasado ${Math.abs(dias)}d`, cls:'danger', dias};
  if(dias===0) return {label:'Hoje', cls:'warning', dias};
  if(dias<=2) return {label:`Em ${dias}d`, cls:'warning', dias};
  return {label:fmtData(a.proximoContacto), cls:'neutral', dias};
}

// Usado no Painel: todos os contactos agendados para hoje ou já atrasados, mais urgentes primeiro.
function atendimentosPorAcompanhar(){
  return state.atendimentos
    .map(a=>Object.assign({},a,{st:statusProximoContacto(a)}))
    .filter(a=>a.st && a.st.dias<=0)
    .sort((a,b)=>a.st.dias-b.st.dias);
}

  const nome=document.getElementById('f-at-nome').value.trim();

/* ============================== FORNECEDORES (dívidas a pagar) ==============================
   Controlo das dívidas da NTL a fornecedores (postos de combustível, oficinas, peças, etc.).
   O saldo devedor de cada fornecedor NUNCA é guardado directamente — é sempre calculado a
   partir de state.movimentosFornecedor (soma de dívidas menos soma de pagamentos), para nunca
   ficar desalinhado. Dívidas nascem de duas formas: automaticamente, quando um abastecimento é
   marcado "a crédito" num fornecedor (ver sincronizarDividasAbastecimento, chamada a partir de
   salvarViagem/salvarEdicaoViagemCarga), ou manualmente (ex: peça comprada a crédito). */
const FORNECEDOR_TIPOS=[
  {id:'posto_combustivel', label:'Posto de combustível'},
  {id:'oficina',           label:'Oficina/Reparação'},
  {id:'pecas',             label:'Peças'},
  {id:'outro',             label:'Outro'},
];
function labelTipoFornecedor(tipo){ return (FORNECEDOR_TIPOS.find(t=>t.id===tipo)||{}).label || 'Outro'; }
function getFornecedor(id){ return (state.fornecedores||[]).find(f=>f.id===id); }
function movimentosDoFornecedor(fornecedorId){
  return (state.movimentosFornecedor||[]).filter(m=>m.fornecedorId===fornecedorId).sort((a,b)=>new Date(a.data)-new Date(b.data));
}
// Saldo devedor: soma de dívidas menos soma de pagamentos. Nunca guardado, sempre recalculado.
function saldoFornecedor(fornecedorId){
  return movimentosDoFornecedor(fornecedorId).reduce((s,m)=>s + (m.tipo==='divida'?(Number(m.valor)||0):-(Number(m.valor)||0)), 0);
}
function totalDividasFornecedores(){
  return (state.fornecedores||[]).reduce((s,f)=>s+Math.max(0,saldoFornecedor(f.id)),0);
}
// Origem de uma dívida (para link na ficha do fornecedor): devolve {label, abrir}
function labelOrigemMovimento(m){
  if(m.origem!=='abastecimento') return m.descricao||'Lançamento manual';
  if(m.origemTipo==='viagem'){
    const v=getViagem(m.origemId);
    if(!v) return 'Viagem (removida)';
    const vt=getViatura(v.viaturaId);
    return `Viagem ${vt?vt.matricula:'?'} · ${fmtData(v.dataInicio)}`;
  }
  if(m.origemTipo==='viagemCarga'){
    const v=getViagemCarga(m.origemId);
    if(!v) return 'Viagem de carga (removida)';
    const vt=getViatura(v.viaturaId);
    return `Viagem de carga ${vt?vt.matricula:'?'} · ${fmtData(v.dataInicio)}`;
  }
  return m.descricao||'Abastecimento';
}
function abrirOrigemMovimento(movimentoId){
  const m=(state.movimentosFornecedor||[]).find(x=>x.id===movimentoId); if(!m) return;
  if(m.origem!=='abastecimento') return;
  if(m.origemTipo==='viagem' && getViagem(m.origemId)) verViagem(m.origemId);
  else if(m.origemTipo==='viagemCarga' && getViagemCarga(m.origemId)) verViagemCarga(m.origemId);
}
// Chamada sempre que uma viagem (autocarro ou carga) é gravada. Para cada abastecimento marcado
// "a crédito" com fornecedor escolhido, garante que existe uma dívida correspondente — sem
// duplicar (idempotente: cada abastecimento só gera UM movimento, identificado por origemAbastecimentoId).
// Segue o mesmo princípio de "acrescentar é livre, corrigir dado já gravado exige autorização"
// já usado no resto da aplicação: não apaga nem edita dívidas já criadas a partir daqui.
function sincronizarDividasAbastecimento(abastecimentos, origemTipo, origemId){
  if(!state.movimentosFornecedor) state.movimentosFornecedor=[];
  const existentes=new Set(state.movimentosFornecedor.filter(m=>m.origem==='abastecimento').map(m=>m.origemAbastecimentoId));
  (abastecimentos||[]).forEach(item=>{
    if(item.pagoNoAto===false && item.fornecedorId && Number(item.custo)>0 && !existentes.has(item.id)){
      state.movimentosFornecedor.push({
        id: uid('mf'), fornecedorId: item.fornecedorId, tipo:'divida',
        data: (item.dataHora||new Date().toISOString()).slice(0,10),
        valor: Number(item.custo)||0,
        descricao: `Abastecimento${item.local?' · '+item.local:''}${item.litros?' · '+fmtNum(item.litros,1)+' L':''}`,
        origem:'abastecimento', origemTipo, origemId, origemAbastecimentoId: item.id,
        enviadoContabilidade:false, lancamentoId:null,
        criadoPor: currentPerfil?currentPerfil.nome:(currentUser?.email||'—'),
        criadoEm: new Date().toISOString(),
      });
    }
  });
}

function salvarFornecedor(id){
  if(id ? naoPodeEditar('fornecedores') : naoPodeCriar('fornecedores')){ showToast('Sem permissão.','error'); return; }
  const nome=document.getElementById('f-fn-nome').value.trim();
  if(!nome){ showToast('Indique o nome do fornecedor.','error'); return; }

    nome,
    tipo:document.getElementById('f-fn-tipo').value,
    contacto:document.getElementById('f-fn-contacto').value.trim(),
    nuit:document.getElementById('f-fn-nuit').value.trim(),
    observacoes:document.getElementById('f-fn-obs').value.trim(),
  };
  if(id){
    const f=getFornecedor(id);
    Object.assign(f,dados);
    audit('update','fornecedor',id,`Fornecedor "${dados.nome}" editado`,null);
  }else{
    const novo=Object.assign({id:uid('fn'),ativo:true,criadoEm:new Date().toISOString()},dados);

    audit('create','fornecedor',novo.id,`Novo fornecedor: "${dados.nome}"`,labelTipoFornecedor(dados.tipo));

}
function apagarFornecedor(id){
  if(naoPodeApagar('fornecedores')){ showToast('Sem permissão.','error'); return; }

  if(Math.abs(saldoFornecedor(id))>0.004){ showToast('Este fornecedor ainda tem saldo em aberto — regularize a dívida antes de apagar.','error'); return; }
  confirmAction(`Apagar o fornecedor "${f.nome}"?`,()=>{
    moverParaLixeira('fornecedor', f, `Fornecedor eliminado: "${f.nome}"`);
    state.fornecedores=state.fornecedores.filter(x=>x.id!==id);
    saveState(); closeModal(); renderContent();
    showToast('Movido para a lata de lixo.','success');
  });
}

// Envia UM movimento (dívida ou pagamento) à Contabilidade Geral — não é automático, é por
// movimento, tal como o resto da aplicação (Viagens/Camiões). Dívida: Débito Gasto/Crédito
// Fornecedores. Pagamento: Débito Fornecedores/Crédito Caixa.
function enviarMovimentoFornecedorContabilidade(movimentoId){
  if(!podeVer('financeiro')){ showToast('Sem permissão.','error'); return; }
  const m=(state.movimentosFornecedor||[]).find(x=>x.id===movimentoId); if(!m) return;
  const cfg=state.configContabilidade||{};
  if(!cfg.contaFornecedores){ showToast('Configure primeiro a "Conta de Fornecedores" em Contabilidade → Contabilidade Geral → Configurações.','error'); return; }
  const f=getFornecedor(m.fornecedorId);
  let linhas;
  if(m.tipo==='divida'){
    const contaGasto = m.contaId || cfg.contaCombustivel;
    if(!contaGasto){ showToast('Escolha a conta de gasto deste movimento (ou configure a Conta de Gastos com Combustível).','error'); return; }
    linhas=[{contaId:contaGasto,debito:Math.round(m.valor*100)/100,credito:0},{contaId:cfg.contaFornecedores,debito:0,credito:Math.round(m.valor*100)/100}];
  } else {
    if(!cfg.contaCaixa){ showToast('Configure primeiro a "Conta de Caixa" em Contabilidade → Contabilidade Geral → Configurações.','error'); return; }
    linhas=[{contaId:cfg.contaFornecedores,debito:Math.round(m.valor*100)/100,credito:0},{contaId:cfg.contaCaixa,debito:0,credito:Math.round(m.valor*100)/100}];
  }
  if(!state.lancamentos) state.lancamentos=[];
  const numero='JD-'+String(((state.lancamentos||[]).length)+1).padStart(4,'0');
  const lancamento={
    id: uid('lc'), numero, data: m.data,
    descricao: `${m.tipo==='divida'?'Dívida a':'Pagamento a'} ${f?f.nome:'fornecedor'} · ${m.descricao||''} (gerado automaticamente)`,
    linhas, origemMovimentoFornecedorId: m.id,
  };
  state.lancamentos.push(lancamento);
  m.enviadoContabilidade=true; m.lancamentoId=lancamento.id;
  audit('action','fornecedor',m.fornecedorId,`Movimento enviado à contabilidade: ${f?f.nome:'?'}`,`Lançamento ${numero} · ${fmtMT(m.valor)}`);
  saveState(); fichaFornecedor(m.fornecedorId);
  showToast(`Enviado à contabilidade. Lançamento ${numero} criado.`,'success');
}

/* ============================== MODELOS (Cotação, VD, Factura, Recibo, Requisições, etc.) ==============================
   Dois níveis:
     1. state.tiposDocumentoModelo — o "modelo" propriamente dito: nome, prefixo de numeração,
        que campos aparecem no formulário (cliente / itens / requisitante) e um texto de
        condições padrão. Configurável em Modelos > Tipos de Modelo.
     2. state.documentosModelo — os documentos efectivamente emitidos a partir de um tipo, com
        numeração sequencial automática (prefixo/ano/nnnn, nunca reutilizada) e impressos com o
        mesmo layout A4 usado no resto do sistema (printHeaderHtml/printLinhasTable/printFooterHtml).
*/
let modelosSubTab='documentos';
let modelosDocFiltroTipo='todos';
let modelosDocBusca='';

function viewModelos(){
  const sub=modelosSubTab;
  const tabs=[{id:'documentos',label:'Documentos Emitidos'},{id:'tipos',label:'Tipos de Modelo'}];
  return `
    <div class="tabs-pill" style="margin-bottom:18px;">
      ${tabs.map(t=>`<button class="${sub===t.id?'active':''}" onclick="modelosSubTab='${t.id}';renderContent();">${t.label}</button>`).join('')}
    </div>
    ${sub==='documentos'?viewDocumentosModelo():''}
    ${sub==='tipos'?viewTiposDocumentoModelo():''}`;
}

function tipoDocumentoModelo(id){ return (state.tiposDocumentoModelo||[]).find(t=>t.id===id); }
function totalDocumentoModelo(d){
  if(Array.isArray(d.itens) && d.itens.length) return d.itens.reduce((s,i)=>s+(Number(i.total)||0),0);
  if(d.valorUnico!=null) return Number(d.valorUnico)||0;
  return null;
}
// Totais do documento, considerando o IVA configurado no Tipo de Modelo (sempre lido do tipo
// actual — tal como temCliente/temItens já funcionam hoje). Devolve {subtotal, aplicaIVA, taxaIVA, formulaIVA, iva, total}.
// "subtotal" é sempre o valor SEM IVA e "total" é sempre o valor COM IVA, seja qual for a fórmula:
//  - 'acrescimo'  : os itens/valor lançados são SEM IVA -> IVA = valor × taxa%      -> Total = valor + IVA
//  - 'incluido'   : os itens/valor lançados já INCLUEM IVA -> IVA = valor/(1+taxa%) × taxa%  -> Total = valor (inalterado)
function totaisComIvaDocumentoModelo(d){
  const t=tipoDocumentoModelo(d.tipoId);
  const valor=totalDocumentoModelo(d)||0;
  const aplicaIVA=!!(t&&t.aplicaIVA);
  const taxaIVA=t?(Number(t.taxaIVA)||0):0;
  const formulaIVA=(t&&t.formulaIVA)||'acrescimo';
  let subtotal, iva, total;
  if(aplicaIVA && formulaIVA==='incluido'){
    iva=Math.round((valor-(valor/(1+taxaIVA/100)))*100)/100;
    subtotal=Math.round((valor-iva)*100)/100;
    total=valor;
  }else{
    subtotal=valor;
    iva=aplicaIVA?Math.round(valor*taxaIVA)/100:0;
    total=subtotal+iva;
  }
  return {subtotal, aplicaIVA, taxaIVA, formulaIVA, iva, total};
}
// Gera o próximo número sequencial do tipo (PREFIXO/ANO/NNNN). O contador vive dentro do
// próprio tipo (tipo.proximoNumero) e reinicia sozinho quando o ano muda. Nunca é decrementado
// — mesmo que um documento seja anulado ou apagado, o número não volta a ser atribuído, como é
// prática normal em documentos deste género.
function gerarNumeroDocumentoModelo(tipo){
  const ano=new Date().getFullYear();
  if(!tipo.proximoNumero || tipo.proximoNumero.ano!==ano) tipo.proximoNumero={ano,seq:0};
  tipo.proximoNumero.seq+=1;
  return `${tipo.prefixo}/${ano}/${String(tipo.proximoNumero.seq).padStart(4,'0')}`;
}
function previewProximoNumeroModelo(t){
  const ano=new Date().getFullYear();
  const seq=(t.proximoNumero&&t.proximoNumero.ano===ano)?t.proximoNumero.seq+1:1;
  return `${t.prefixo||'?'}/${ano}/${String(seq).padStart(4,'0')}`;
}

function salvarTipoDocumentoModelo(id){
  if(id?naoPodeEditar('modelos'):naoPodeCriar('modelos')){ showToast('Sem permissão.','error'); return; }
  const nome=document.getElementById('f-tdm-nome').value.trim();
  const prefixo=document.getElementById('f-tdm-prefixo').value.trim().toUpperCase();
  if(!nome||!prefixo){ showToast('Indique o nome e o prefixo de numeração.','error'); return; }
  if(!state.tiposDocumentoModelo) state.tiposDocumentoModelo=[];
  const duplicado=state.tiposDocumentoModelo.find(x=>x.prefixo===prefixo&&x.id!==id);
  if(duplicado){ showToast('Já existe um tipo de modelo com este prefixo.','error'); return; }
  const camposExtra=[...document.querySelectorAll('[data-tdm-ce]')].map(e=>e.value.trim()).filter(Boolean);
  const dados={
    nome, prefixo,
    temCliente:document.getElementById('f-tdm-cliente').checked,
    temItens:document.getElementById('f-tdm-itens').checked,
    temRequisitante:document.getElementById('f-tdm-requisitante').checked,
    ativo:document.getElementById('f-tdm-ativo').checked,
    textoCondicoes:document.getElementById('f-tdm-condicoes').value.trim(),
    aplicaIVA:document.getElementById('f-tdm-iva').checked,
    taxaIVA:Number(document.getElementById('f-tdm-taxaiva').value)||0,
    formulaIVA:document.getElementById('f-tdm-formulaiva').value||'acrescimo',
    camposExtra,
    mostrarAssinaturas:document.getElementById('f-tdm-assinaturas').checked,
  };
  if(id){
    const t=tipoDocumentoModelo(id);
    Object.assign(t,dados);
    audit('update','tipoDocumentoModelo',id,`Tipo de modelo "${dados.nome}" editado`,null);
  }else{
    const novo=Object.assign({id:uid('tdm'),proximoNumero:{}},dados);
    state.tiposDocumentoModelo.push(novo);
    audit('create','tipoDocumentoModelo',novo.id,`Novo tipo de modelo: "${dados.nome}"`,`Prefixo ${dados.prefixo}`);
  }
  saveState(); closeModal(); renderContent();
  showToast('Tipo de modelo guardado.','success');
}
function apagarTipoDocumentoModelo(id){
  if(naoPodeApagar('modelos')){ showToast('Sem permissão.','error'); return; }
  const t=tipoDocumentoModelo(id); if(!t) return;
  const usado=(state.documentosModelo||[]).some(d=>d.tipoId===id);
  if(usado){ showToast('Já existem documentos emitidos com este tipo — não pode ser apagado. Pode desativá-lo em vez disso.','error'); return; }
  confirmAction(`Apagar o tipo de modelo "${t.nome}"?`,()=>{
    moverParaLixeira('tipoDocumentoModelo', t, `Tipo de modelo eliminado: "${t.nome}"`);
    state.tiposDocumentoModelo=state.tiposDocumentoModelo.filter(x=>x.id!==id);
    saveState(); closeModal(); renderContent();
    showToast('Movido para a lata de lixo.','success');
  });
}

function viewDocumentosModelo(){

    .sort((a,b)=>new Date(b.data||b.criadoEm||0)-new Date(a.data||a.criadoEm||0)||String(b.numero||'').localeCompare(String(a.numero||'')));

  if(!tipos.length){

      <td style="font-family:var(--font-mono);">${esc(d.numero)}</td>
      <td>${esc(t?t.nome:'—')}</td>

    </tr>`;

  return `

    <div class="card">${lista.length?`<div class="table-wrap"><table><thead>${thead}</thead><tbody>${lista.map(linha).join('')}</tbody></table></div>`:`<div class="empty" style="padding:24px 0;"><div class="empty-title">Sem documentos emitidos${modelosDocFiltroTipo!=='todos'||busca?' neste filtro':''}</div></div>`}</div>`;

function escolherTipoDocumentoModelo(){
  const tipos=(state.tiposDocumentoModelo||[]).filter(t=>t.ativo!==false);
  if(!tipos.length){ showToast('Não há tipos de modelo activos. Configure um em "Tipos de Modelo".','error'); return; }
  openModal(`
    <p class="modal-title">Emitir documento</p>
    <p class="modal-sub">Escolha o tipo de documento a emitir.</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${tipos.map(t=>`<button class="btn btn-ghost" style="justify-content:space-between;display:flex;" onclick="formDocumentoModelo(null,'${t.id}')">${esc(t.nome)} <span class="muted" style="font-family:var(--font-mono);">${esc(t.prefixo)}</span></button>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>`);
}

/* Linhas de itens dinâmicas (Descrição / Qtd / Unidade / Preço unit. / Total, com total calculado) */
function linhaItemModeloHtml(it){
  it=it||{};
  return `<div class="dyn-row-cat" style="grid-template-columns:1fr 70px 90px 110px 110px 36px;">
    <input placeholder="Descrição" value="${esc(it.descricao||'')}" data-mi-desc oninput="recalcularLinhaItemModelo(this)">
    <input type="number" min="0" step="0.01" placeholder="Qtd" value="${it.quantidade||''}" data-mi-qtd oninput="recalcularLinhaItemModelo(this)">
    <input placeholder="Unidade" value="${esc(it.unidade||'')}" data-mi-unidade oninput="recalcularLinhaItemModelo(this)">
    <input type="number" min="0" step="0.01" placeholder="Preço unit." value="${it.precoUnitario||''}" data-mi-preco oninput="recalcularLinhaItemModelo(this)">
    <input type="number" step="0.01" placeholder="Total" value="${it.total||''}" data-mi-total readonly style="background:var(--bg);">
    <button class="dyn-row-del" onclick="this.parentElement.remove();recalcularTotalModelo();">×</button>
  </div>`;
}
function addLinhaItemModelo(){ document.getElementById('mi-container').insertAdjacentHTML('beforeend',linhaItemModeloHtml()); }
function recalcularLinhaItemModelo(el){
  const row=el.closest('.dyn-row-cat');
  const qtd=Number(row.querySelector('[data-mi-qtd]').value)||0;
  const preco=Number(row.querySelector('[data-mi-preco]').value)||0;
  row.querySelector('[data-mi-total]').value=(qtd*preco).toFixed(2);
  recalcularTotalModelo();
}
function recalcularTotalModelo(){
  const soma=[...document.querySelectorAll('[data-mi-total]')].reduce((s,e)=>s+(Number(e.value)||0),0);
  const el=document.getElementById('mi-total-geral');
  if(el) el.textContent=fmtMT(soma);
}

function valorCampoExtraDocumentoModelo(d,label){
  if(!d || !Array.isArray(d.camposExtra)) return '';
  const item=d.camposExtra.find(c=>c.label===label);
  return item?item.valor:'';
}

function salvarDocumentoModelo(id,tipoId){
  if(id?naoPodeEditar('modelos'):naoPodeCriar('modelos')){ showToast('Sem permissão.','error'); return; }
  const t=tipoDocumentoModelo(tipoId); if(!t) return;
  const data=document.getElementById('f-dm-data').value||new Date().toISOString().slice(0,10);
  let clienteNome='',clienteNuit='',clienteContacto='',clienteEndereco='';
  if(t.temCliente){
    clienteNome=document.getElementById('f-dm-clienteNome').value.trim();
    if(!clienteNome){ showToast('Indique o nome do cliente.','error'); return; }
    clienteNuit=document.getElementById('f-dm-clienteNuit').value.trim();
    clienteContacto=document.getElementById('f-dm-clienteContacto').value.trim();
    clienteEndereco=document.getElementById('f-dm-clienteEndereco').value.trim();
  }
  let requisitanteNome='',requisitanteDepartamento='';
  if(t.temRequisitante){
    requisitanteNome=document.getElementById('f-dm-requisitanteNome').value.trim();
    if(!requisitanteNome){ showToast('Indique o nome do requisitante.','error'); return; }
    requisitanteDepartamento=document.getElementById('f-dm-requisitanteDep').value.trim();
  }
  let itens=[], valorUnico=null, referenteA='';
  if(t.temItens){
    const descs=[...document.querySelectorAll('[data-mi-desc]')].map(e=>e.value.trim());
    const qtds=[...document.querySelectorAll('[data-mi-qtd]')].map(e=>Number(e.value)||0);
    const unidades=[...document.querySelectorAll('[data-mi-unidade]')].map(e=>e.value.trim());
    const precos=[...document.querySelectorAll('[data-mi-preco]')].map(e=>Number(e.value)||0);
    itens=descs.map((desc,i)=>({descricao:desc,quantidade:qtds[i],unidade:unidades[i],precoUnitario:precos[i],total:Math.round(qtds[i]*precos[i]*100)/100})).filter(it=>it.descricao);
    if(!itens.length){ showToast('Adicione pelo menos um item.','error'); return; }
  }else{
    valorUnico=Number(document.getElementById('f-dm-valorUnico').value)||0;
    if(!valorUnico){ showToast('Indique o valor do documento.','error'); return; }
    referenteA=document.getElementById('f-dm-referenteA').value.trim();
  }
  const camposExtra=[...document.querySelectorAll('[data-dm-ce]')].map(e=>({label:e.getAttribute('data-dm-ce-label'), valor:e.value.trim()}));
  const notas=document.getElementById('f-dm-notas').value.trim();
  const dados={tipoId:t.id,data,clienteNome,clienteNuit,clienteContacto,clienteEndereco,requisitanteNome,requisitanteDepartamento,itens,valorUnico,referenteA,notas,camposExtra};
  if(!state.documentosModelo) state.documentosModelo=[];
  let savedId;
  if(id){
    const d=state.documentosModelo.find(x=>x.id===id);
    Object.assign(d,dados);
    savedId=id;
    audit('update','documentoModelo',id,`${t.nome} "${d.numero}" editado`,null);
  }else{
    const numero=gerarNumeroDocumentoModelo(t);
    const criadoPor=currentPerfil?.nome||currentUser?.email||'—';
    const novo=Object.assign({id:uid('dm'),numero,estado:'emitido',criadoPor,criadoEm:new Date().toISOString()},dados);
    state.documentosModelo.push(novo);
    savedId=novo.id;
    audit('create','documentoModelo',savedId,`${t.nome} emitido: ${numero}`,clienteNome||requisitanteNome||'');
  }
  saveState(); closeModal(); renderContent();
  showToast('Documento guardado.','success');
  if(!id) verDocumentoModelo(savedId);
}

function verDocumentoModelo(id){
  const d=(state.documentosModelo||[]).find(x=>x.id===id); if(!d) return;
  const t=tipoDocumentoModelo(d.tipoId);
  const totais=totaisComIvaDocumentoModelo(d);
  const podeEditar=podeNoModulo('modelos','editar');
  openModal(`
    <p class="modal-title">${esc(t?t.nome:'Documento')} <span class="badge neutral" style="margin-left:6px;font-family:var(--font-mono);">${esc(d.numero)}</span> ${d.estado==='anulado'?'<span class="badge danger" style="margin-left:6px;">Anulado</span>':''}</p>
    <p class="muted" style="margin-top:-8px;">${fmtData(d.data)} · ${esc(d.clienteNome||d.requisitanteNome||'—')}</p>
    ${(d.camposExtra&&d.camposExtra.length)?`<div class="form-cols2" style="margin-top:10px;">${d.camposExtra.map(c=>`<div><label class="muted" style="font-size:11px;text-transform:uppercase;display:block;">${esc(c.label)}</label><span style="font-size:13px;">${esc(c.valor)||'—'}</span></div>`).join('')}</div>`:''}
    ${(d.itens&&d.itens.length)?`<div class="table-wrap" style="margin-top:10px;"><table>
      <thead><tr><th>Descrição</th><th>Qtd</th><th>Unidade</th><th>Preço unit.</th><th>Total</th></tr></thead>
      <tbody>${d.itens.map(i=>`<tr><td>${esc(i.descricao)}</td><td class="num">${fmtQtd(i.quantidade)}</td><td>${esc(i.unidade)||'—'}</td><td class="num">${fmtMT(i.precoUnitario)}</td><td class="num">${fmtMT(i.total)}</td></tr>`).join('')}</tbody>
    </table></div><div style="text-align:right;margin-top:6px;font-size:13px;">
      ${totais.aplicaIVA?`<div>Subtotal: ${fmtMT(totais.subtotal)}</div><div>IVA (${fmtNum(totais.taxaIVA,0)}%): ${fmtMT(totais.iva)}</div>`:''}
      <div style="font-weight:700;">Total: ${fmtMT(totais.total)}</div>
    </div>`
    :`<div class="card" style="background:var(--bg);margin-top:10px;padding:12px;"><label class="muted" style="font-size:11px;text-transform:uppercase;">Valor</label><p style="font-size:18px;font-weight:800;margin:2px 0;">${fmtMT(d.valorUnico||0)}</p>${d.referenteA?`<p class="muted" style="font-size:12.5px;">Referente a: ${esc(d.referenteA)}</p>`:''}</div>`}
    ${d.notas?`<p class="muted" style="font-size:12.5px;margin-top:8px;white-space:pre-wrap;">${esc(d.notas)}</p>`:''}
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
      <button class="btn btn-ghost" onclick="imprimirDocumentoModelo('${d.id}')">🖨️ Imprimir / PDF</button>
      ${(podeEditar&&d.estado!=='anulado')?`<button class="btn btn-ghost" data-acao="editar" onclick="closeModal();formDocumentoModelo('${d.id}')">Editar</button>`:''}
      ${(podeEditar&&d.estado!=='anulado')?`<button class="btn btn-danger-ghost" data-acao="editar" onclick="anularDocumentoModelo('${d.id}')">Anular</button>`:''}
      ${naoPodeApagar('modelos')?'':`<button class="btn btn-danger-ghost" onclick="apagarDocumentoModelo('${d.id}')">Apagar</button>`}
    </div>`);
}
function anularDocumentoModelo(id){
  if(naoPodeEditar('modelos')){ showToast('Sem permissão.','error'); return; }
  const d=(state.documentosModelo||[]).find(x=>x.id===id); if(!d) return;
  confirmAction(`Anular o documento "${d.numero}"? Fica registado mas marcado como anulado — o número não é reutilizado.`,()=>{
    d.estado='anulado';
    audit('update','documentoModelo',id,`Documento anulado: ${d.numero}`,null);
    saveState(); closeModal(); renderContent();
    showToast('Documento anulado.','success');
  });
}
function apagarDocumentoModelo(id){
  if(naoPodeApagar('modelos')){ showToast('Sem permissão.','error'); return; }
  const d=(state.documentosModelo||[]).find(x=>x.id===id); if(!d) return;
  confirmAction(`Apagar definitivamente o registo do documento "${d.numero}"? Prefira "Anular" para manter o histórico.`,()=>{
    moverParaLixeira('documentoModelo', d, `Documento eliminado: "${d.numero}"`);
    state.documentosModelo=state.documentosModelo.filter(x=>x.id!==id);
    saveState(); closeModal(); renderContent();
    showToast('Movido para a lata de lixo.','success');
  });
}

function imprimirDocumentoModelo(id){
  const d=(state.documentosModelo||[]).find(x=>x.id===id); if(!d) return;
  const t=tipoDocumentoModelo(d.tipoId); if(!t) return;
  const emp=getDadosEmpresa();
  const totais=totaisComIvaDocumentoModelo(d);
  const rows=(d.itens||[]).map((i,idx)=>`<tr><td class="idx">${idx+1}</td><td>${esc(i.descricao)}</td><td class="num">${fmtQtd(i.quantidade)}</td><td>${esc(i.unidade)||'—'}</td><td class="num">${fmtMT(i.precoUnitario)}</td><td class="num">${fmtMT(i.total)}</td></tr>`).join('');

  // Bloco "De / Para": à esquerda os dados fixos da NTL, à direita o cliente/requisitante do documento
  const paraLinhas=[];
  if(t.temCliente){
    paraLinhas.push(`<div class="pft-name">${esc(d.clienteNome||'—')}</div>`);
    if(d.clienteEndereco) paraLinhas.push(`<div class="pft-line">${esc(d.clienteEndereco)}</div>`);
    if(d.clienteContacto) paraLinhas.push(`<div class="pft-line">Contacto: ${esc(d.clienteContacto)}</div>`);
    if(d.clienteNuit) paraLinhas.push(`<div class="pft-line">NUIT/BI: ${esc(d.clienteNuit)}</div>`);
  }else if(t.temRequisitante){
    paraLinhas.push(`<div class="pft-name">${esc(d.requisitanteNome||'—')}</div>`);
    if(d.requisitanteDepartamento) paraLinhas.push(`<div class="pft-line">${esc(d.requisitanteDepartamento)}</div>`);
  }
  const pfromto=(t.temCliente||t.temRequisitante)?`
    <div class="pfromto">
      <div class="pft-col">
        <div class="pft-label">De</div>
        <div class="pft-name">${esc(emp.nome)}</div>
        ${emp.endereco?`<div class="pft-line">${esc(emp.endereco)}</div>`:''}
        ${emp.telefone?`<div class="pft-line">${esc(emp.telefone)}</div>`:''}
        ${emp.nuit?`<div class="pft-line">NUIT: ${esc(emp.nuit)}</div>`:''}
      </div>
      <div class="pft-col">
        <div class="pft-label">Para (${t.temCliente?'Cliente':'Requisitante'})</div>
        ${paraLinhas.join('')}
      </div>
    </div>`:'';

  // Detalhes do documento: data + campos extra configurados no tipo (Validade, Origem, Destino, Serviço, etc.)
  const detalhesCampos=[`<div><label>Data</label><span>${fmtData(d.data)}</span></div>`]
    .concat((t.camposExtra||[]).map(label=>`<div><label>${esc(label)}</label><span>${esc(valorCampoExtraDocumentoModelo(d,label))||'—'}</span></div>`));
  const pinfo=`<div class="pinfo">${detalhesCampos.join('')}</div>`;

  // Condições gerais numeradas (cada linha do texto vira um item da lista)
  const linhasCondicoes=(d.notas||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const pcondicoes=linhasCondicoes.length?`<div class="psec">Condições Gerais</div><ol class="pcond">${linhasCondicoes.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`:'';

  const html=`
    ${printHeaderHtml(t.nome, d.numero)}
    ${pfromto}
    ${pinfo}
    ${t.temItens?`
    <div class="psec">Descrição dos Serviços</div>
    ${printLinhasTable([{label:'#',num:true},{label:'Descrição'},{label:'Qtd',num:true},{label:'Unidade'},{label:'Preço Unit. (MT)',num:true},{label:'Total (MT)',num:true}],[rows])}
    <div class="ptotais">
      ${totais.aplicaIVA?`<div class="row"><span>Subtotal</span><span class="num">${fmtMT(totais.subtotal)}</span></div>
      <div class="row"><span>IVA (${fmtNum(totais.taxaIVA,0)}%)</span><span class="num">${fmtMT(totais.iva)}</span></div>`:''}
      <div class="row strong"><span>Total Geral</span><span class="num">${fmtMT(totais.total)}</span></div>
    </div>`
    :`<div class="psec">Valor<span class="num">${fmtMT(d.valorUnico||0)}</span></div>
    <div class="pnotas">${d.referenteA?'Referente a: '+esc(d.referenteA):'—'}</div>`}
    ${pcondicoes}
    ${d.estado==='anulado'?`<p style="text-align:center;color:var(--danger);font-weight:700;margin-top:14px;">*** DOCUMENTO ANULADO ***</p>`:''}
    ${t.mostrarAssinaturas?`<div class="passin">
      <div><div class="sname"></div><div class="sline">Assinatura / Carimbo NTL</div></div>
      <div><div class="sname">${esc(d.clienteNome||d.requisitanteNome||'')}</div><div class="sline">Assinatura do ${(t.temRequisitante&&!t.temCliente)?'Requisitante':'Cliente'}</div></div>
    </div>` : ''}
    ${printFooterHtml()}`;
  printDoc(html);
}

  ordens:[
    {value:'data_asc', label:'Data mais próxima', fn:(a,b)=>new Date(a.dataPlaneada||a.dataInicio||0)-new Date(b.dataPlaneada||b.dataInicio||0)},
    {value:'data_desc', label:'Data mais recente', fn:(a,b)=>new Date(b.dataPlaneada||b.dataInicio||0)-new Date(a.dataPlaneada||a.dataInicio||0)},
    {value:'rota_az', label:'Rota (A-Z)', fn:(a,b)=>{ const ra=getRota(a.rotaId), rb=getRota(b.rotaId); return (ra?ra.nome:'').localeCompare(rb?rb.nome:''); }},
  ],
};
const VIAGENS_CONCLUIDAS_AO_CONFIG = {
  grupoPadrao:'none', ordemPadrao:'fim_desc',
  grupos: VIAGENS_AO_CONFIG.grupos,
  ordens:[
    {value:'fim_desc', label:'Concluídas mais recentes', fn:(a,b)=>new Date(b.dataFim||0)-new Date(a.dataFim||0)},
    {value:'fim_asc', label:'Concluídas mais antigas', fn:(a,b)=>new Date(a.dataFim||0)-new Date(b.dataFim||0)},
    {value:'lucro_desc', label:'Maior lucro primeiro', fn:(a,b)=>financeiroViagem(b).lucro-financeiroViagem(a).lucro},
    {value:'lucro_asc', label:'Menor lucro primeiro', fn:(a,b)=>financeiroViagem(a).lucro-financeiroViagem(b).lucro},
  ],
};
const VIAGENS_CANCELADAS_AO_CONFIG = {
  grupoPadrao:'none', ordemPadrao:'cancelada_desc',
  grupos:[
    {value:'none', label:'Sem agrupar'},
    {value:'rota', label:'Agrupar por rota', fn:v=>{ const r=getRota(v.rotaId); return r?r.nome:'Sem rota'; }},
  ],
  ordens:[
    {value:'cancelada_desc', label:'Canceladas mais recentes', fn:(a,b)=>new Date(b.dataCancelamento||0)-new Date(a.dataCancelamento||0)},

  ],
};

function viewViagens(){
  const agendadas=viagensAgendadas();
  const emCurso=viagensEmCurso();
  const concluidas=filtrarViagensVisiveis(state.viagens.filter(v=>v.status==='concluida')).sort((a,b)=>new Date(b.dataFim)-new Date(a.dataFim));
  const adiadas=viagensAdiadas();
  const canceladas=viagensCanceladas();
  return `
    <div class="flex-between" style="margin-bottom:14px;">
      <div class="tabs-pill" style="margin-bottom:0;flex-wrap:wrap;">
        <button class="${viagensFiltro==='agendadas'?'active':''}" onclick="viagensFiltro='agendadas'; renderContent();">Agendadas (${agendadas.length})</button>
        <button class="${viagensFiltro==='em_curso'?'active':''}" onclick="viagensFiltro='em_curso'; renderContent();">Em curso (${emCurso.length})</button>
        <button class="${viagensFiltro==='concluidas'?'active':''}" onclick="viagensFiltro='concluidas'; renderContent();">Concluídas (${concluidas.length})</button>
        <button class="${viagensFiltro==='adiadas'?'active':''}" onclick="viagensFiltro='adiadas'; renderContent();">Adiadas (${adiadas.length})</button>
        <button class="${viagensFiltro==='canceladas'?'active':''}" onclick="viagensFiltro='canceladas'; renderContent();">Canceladas (${canceladas.length})</button>
      </div>
      <button class="btn btn-primary" data-acao="criar" onclick="formViagem()">+ Nova viagem</button>
    </div>
    ${viagensFiltro==='agendadas' ? renderListaAgendadas(agendadas)
      : viagensFiltro==='em_curso' ? renderListaEmCurso(emCurso)
      : viagensFiltro==='adiadas' ? renderListaAgendadas(adiadas, true)
      : viagensFiltro==='canceladas' ? renderListaCanceladas(canceladas)
      : renderListaConcluidas(concluidas)}`;
}

function renderListaAgendadas(lista, isAdiadas){
  if(!lista.length) return `<div class="card"><div class="empty"><div class="empty-title">${isAdiadas?'Nenhuma viagem adiada':'Nenhuma viagem agendada'}</div>${isAdiadas?'Viagens agendadas que forem adiadas aparecem aqui.':'Quando criar uma viagem com data/hora futura, ela fica aqui até registar o início real, ser adiada ou cancelada.'}</div></div>`;
  const moduloKey = isAdiadas?'viagens_adiadas':'viagens_agendadas';
  const grupos = aoAplicar(lista, moduloKey, VIAGENS_AO_CONFIG);
  const agora=new Date();
  const barra = `<div style="margin-bottom:14px;">${renderAgruparOrdenarBar(moduloKey, VIAGENS_AO_CONFIG)}</div>`;
  return barra + aoRenderCardsAgrupados(grupos, v=>{
    const vt=getViatura(v.viaturaId), rota=getRota(v.rotaId), motNomes=nomesEquipa(getMotoristas(v)), cobNomes=nomesEquipa(getCobradores(v));
    const atrasada=new Date(v.dataPlaneada)<agora;
    return `<div class="card" style="margin-bottom:12px;">
      <div class="flex-between">
        <div>
          <strong style="font-size:15px;">${esc(vt?vt.matricula:'—')} · ${esc(rota?rota.nome:'Rota não definida')}</strong>
          <div class="muted" style="font-size:12.5px;margin-top:3px;">
            ${motNomes||'sem motorista'} · ${cobNomes||'sem cobrador'} · prevista para ${fmtDataHora(v.dataPlaneada)}
            ${v.vezesAdiada?` · adiada ${v.vezesAdiada}×`:''}
          </div>
          <div style="margin-top:6px;">${atrasada
            ? `<span class="badge warning">Devia ter iniciado — confirme com o motorista</span>`
            : `<span class="badge ${isAdiadas?'warning':'info'}">${isAdiadas?'Adiada':'Agendada'}</span>`}</div>
        </div>
        <div class="tbl-actions" style="flex-wrap:wrap;justify-content:flex-end;">
          <button class="btn btn-amber btn-sm" data-acao="editar" onclick="formRegistrarInicioReal('${v.id}')">Registar início real</button>
          <button class="btn btn-ghost btn-sm" data-acao="editar" onclick="formAdiarViagem('${v.id}')">Adiar</button>
          <button class="btn btn-danger-ghost btn-sm" data-acao="editar" onclick="formCancelarViagem('${v.id}')">Cancelar</button>
        </div>
      </div>
    </div>`;
  });
}

function renderListaCanceladas(lista){
  if(!lista.length) return `<div class="card"><div class="empty"><div class="empty-title">Sem viagens canceladas</div></div></div>`;
  const grupos = aoAplicar(lista, 'viagens_canceladas', VIAGENS_CANCELADAS_AO_CONFIG);
  const thead = `<tr><th>Estava prevista para</th><th>Viatura</th><th>Rota</th><th>Motivo</th><th>Cancelada em</th></tr>`;
  const linha = v=>{
    const vt=getViatura(v.viaturaId), rota=getRota(v.rotaId);
    return `<tr>
      <td>${fmtDataHora(v.dataPlaneada)}</td>
      <td>${esc(vt?vt.matricula:'—')}</td>
      <td>${esc(rota?rota.nome:'—')}</td>
      <td>${esc(v.motivoCancelamento)||'—'}</td>
      <td>${fmtDataHora(v.dataCancelamento)}</td>
    </tr>`;
  };
  return `<div style="margin-bottom:14px;">${renderAgruparOrdenarBar('viagens_canceladas', VIAGENS_CANCELADAS_AO_CONFIG)}</div>
  <div class="card">${aoRenderTabelaAgrupada(grupos, thead, linha)}</div>`;
}

function renderListaEmCurso(lista){
  if(!lista.length) return `<div class="card"><div class="empty"><div class="empty-title">Nenhuma viagem em curso</div></div></div>`;
  const grupos = aoAplicar(lista, 'viagens_em_curso', VIAGENS_AO_CONFIG);
  const barra = `<div style="margin-bottom:14px;">${renderAgruparOrdenarBar('viagens_em_curso', VIAGENS_AO_CONFIG)}</div>`;
  return barra + aoRenderCardsAgrupados(grupos, v=>{
    const vt=getViatura(v.viaturaId), rota=getRota(v.rotaId), motNomes=nomesEquipa(getMotoristas(v)), cobNomes=nomesEquipa(getCobradores(v));
    const isTerminal=v.status==='terminal';
    const maior=!isTerminal?viagemMaiorAtraso(v):null;
    const termBadge=isTerminal?`<span class="badge terminal" style="margin-left:8px;">Na Terminal</span>`:'';
    return `<div class="card" style="margin-bottom:12px;">
      <div class="flex-between">
        <div>
          <strong style="font-size:15px;">${esc(vt?vt.matricula:'—')} · ${esc(rota?rota.nome:'Rota não definida')}</strong>${termBadge}${(v.avarias&&v.avarias.length)?` <span class="badge danger">⚠ Avaria registada</span>`:''}${isAdmin()&&v.pedidoEdicao&&v.pedidoEdicao.status==='pendente'?' <span title="Pedido de edição pendente" style="color:var(--warning);">🕓</span>':''}
          <div class="muted" style="font-size:12.5px;margin-top:3px;">${motNomes||'sem motorista'} · ${cobNomes||'sem cobrador'} · iniciada ${fmtDataHora(v.dataInicio)}${isTerminal?` · na terminal há ${elapsedLabel(v.terminalInicio)}`:''}</div>
          ${maior&&maior.atraso>5?`<div style="margin-top:6px;"><span class="badge warning">Atraso de ${maior.atraso} min em "${esc(maior.nome)}"</span></div>`:''}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${!isTerminal?`<button class="btn btn-terminal btn-sm" data-acao="editar" onclick="irParaTerminal('${v.id}')">→ Terminal</button>`:`<button class="btn btn-amber btn-sm" data-acao="editar" onclick="sairDaTerminal('${v.id}')">Saiu da terminal</button>`}
          <button class="btn btn-amber" onclick="verViagem('${v.id}')">Atualizar</button>
        </div>
      </div>
    </div>`;
  });
}

function renderListaConcluidas(lista){
  if(!lista.length) return `<div class="card"><div class="empty"><div class="empty-title">Sem viagens concluídas</div></div></div>`;
  const grupos = aoAplicar(lista, 'viagens_concluidas', VIAGENS_CONCLUIDAS_AO_CONFIG);

      <td>${fmtData(v.dataInicio)}</td><td>${fmtData(v.dataFim)}</td>
      <td>${esc(vt?vt.matricula:'—')}</td><td>${esc(rota?rota.nome:'—')}${(v.avarias&&v.avarias.length)?` <span class="badge danger" style="font-size:10px;">⚠</span>`:''}${isAdmin()&&v.pedidoEdicao&&v.pedidoEdicao.status==='pendente'?' <span title="Pedido de edição pendente" style="color:var(--warning);">🕓</span>':''}</td>
      <td>${esc(v.localPartida||'—')} → ${esc(v.localDestino||'—')}</td>
      <td class="num" style="color:${f.lucro>=0?'var(--success)':'var(--danger)'}">${fmtMT(f.lucro)}</td>
