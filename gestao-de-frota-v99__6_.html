async function viewUtilizadores(){
  if(!isAdmin()) return `<div class="card"><p>Acesso restrito a administradores.</p></div>`;
  let utilizadores = [];
  try{
    utilizadores = await sbRestFetch('GET','frota_perfis','?select=id,nome,funcao,role,email,telefone,pessoa_id,confirmado_por,confirmado_em,ultimo_acesso&order=nome');
  } catch(e){ utilizadores = []; }

  return `
    <div class="flex-between" style="margin-bottom:14px;">
      <div>
        <p style="font-size:13px;color:var(--text-muted);margin:0;">Gerir quem tem acesso ao sistema. Cada pessoa define a sua própria senha ao aceitar o convite.</p>
      </div>
      <button class="btn btn-primary" onclick="formConvidarUtilizador()">+ Convidar utilizador</button>
    </div>
    <div class="card">
      <p class="section-title">Utilizadores com acesso</p>
      ${utilizadores.length===0 ? `<div class="empty">Nenhum utilizador encontrado.<br><small>A tabela <code>frota_perfis</code> pode não existir ainda no Supabase — consulte as instruções de configuração.</small></div>` :
        utilizadores.map(u=>{
          const iniciais = (u.nome||u.email||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
          const isMe = currentUser && u.id === currentUser.id;
          const nivel = (state.niveisAcesso||[]).find(p=>p.id===u.role);
          const nivelNome = nivel ? nivel.nome : (u.role||'Operador');
          const corAvatar = nivel && nivel.superAdmin ? '#5B21B6' : nivel && nivel.somenteLeituraGlobal ? '#166534' : 'var(--navy-800)';
          const classeBadge = nivel && nivel.superAdmin ? 'admin' : nivel && nivel.somenteLeituraGlobal ? 'leitor' : 'custom';
          const pessoaLigada = u.pessoa_id ? getPessoa(u.pessoa_id) : null;
          const ua = fmtUltimoAcesso(u.ultimo_acesso);
          return `<div class="user-row">
            <div class="user-avatar-sm" style="background:${corAvatar}">${iniciais}</div>
            <div class="user-row-info">
              <div class="user-row-nome">${esc(u.nome||'—')} ${isMe?'<span style="font-size:11px;color:var(--text-muted)">(você)</span>':''}</div>
              <div class="user-row-email">${esc(u.email||'—')}${u.telefone?' · '+esc(u.telefone):''} · ${esc(u.funcao||'Sem função')}</div>
              ${pessoaLigada?`<div style="font-size:11px;color:var(--text-muted);">Ligado à pessoa da tripulação: ${esc(pessoaLigada.nome)} (${pessoaLigada.funcao==='motorista'?'Motorista':'Cobrador'})</div>`:''}
              ${u.confirmado_por?`<div style="font-size:11px;color:var(--text-muted);">Identidade confirmada por ${esc(u.confirmado_por)}${u.confirmado_em?' em '+fmtData(u.confirmado_em):''}</div>`:''}
              <div style="font-size:11px;margin-top:2px;${ua.online?'color:var(--success);font-weight:700;':'color:var(--text-muted);'}" title="${u.ultimo_acesso?fmtDataHora(u.ultimo_acesso):''}">
                ${ua.online?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:4px;vertical-align:middle;"></span>':''}${ua.label}
              </div>
            </div>
            <span class="role-badge ${classeBadge}">${esc(nivelNome)}</span>
            ${!isMe?`
              <button class="btn btn-ghost btn-sm" onclick="formEditarUtilizador('${esc(u.id)}','${esc(u.nome||'')}','${esc(u.funcao||'')}','${esc(u.role||'operador')}','${esc(u.pessoa_id||'')}')">Editar</button>
              <button class="btn btn-danger-ghost btn-sm" onclick="revogarAcesso('${u.id}','${esc(u.nome||u.email)}')">Revogar</button>
            `:'<button class="btn btn-ghost btn-sm" onclick="formAlterarMinhaSenha()">Alterar senha</button>'}
          </div>`;
        }).join('')
      }
    </div>
    <div class="card" style="margin-top:16px;background:var(--amber-100);border-color:var(--amber-500);">
      <p class="section-title" style="color:var(--navy-800);">Instruções de configuração no Supabase</p>
      <p style="font-size:13px;color:var(--navy-800);margin:0 0 8px;">Para que a gestão de utilizadores funcione, crie a seguinte tabela no Supabase SQL Editor:</p>
      <pre style="background:var(--navy-900);color:#7EE787;padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap;">CREATE TABLE frota_perfis (
  id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  email TEXT,
  nome TEXT,
  funcao TEXT,
  telefone TEXT,
  pessoa_id TEXT,
  confirmado_por TEXT,
  confirmado_em TIMESTAMPTZ,
  ultimo_acesso TIMESTAMPTZ,
  role TEXT DEFAULT 'operador'
);

-- Política: cada utilizador vê o seu próprio perfil; admins vêem todos
ALTER TABLE frota_perfis ENABLE ROW LEVEL SECURITY;
CREATE POLICY "perfil_proprio" ON frota_perfis FOR ALL USING (auth.uid() = id);
CREATE POLICY "admin_tudo" ON frota_perfis FOR ALL USING (
  EXISTS (SELECT 1 FROM frota_perfis WHERE id = auth.uid() AND role = 'admin')
);</pre>
      <p style="font-size:13px;color:var(--navy-800);margin:14px 0 8px;">Se a tabela <code>frota_perfis</code> já existir (instalação anterior), execute só esta migração para adicionar as colunas novas:</p>
      <pre style="background:var(--navy-900);color:#7EE787;padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap;">ALTER TABLE frota_perfis ADD COLUMN IF NOT EXISTS telefone TEXT;
ALTER TABLE frota_perfis ADD COLUMN IF NOT EXISTS pessoa_id TEXT;
ALTER TABLE frota_perfis ADD COLUMN IF NOT EXISTS confirmado_por TEXT;
ALTER TABLE frota_perfis ADD COLUMN IF NOT EXISTS confirmado_em TIMESTAMPTZ;
ALTER TABLE frota_perfis ADD COLUMN IF NOT EXISTS ultimo_acesso TIMESTAMPTZ;</pre>
      <p style="font-size:13px;color:var(--navy-800);margin:14px 0 8px;"><code>pessoa_id</code> liga o login à pessoa da Tripulação (motorista/cobrador) correspondente — é o que permite, em Níveis de Acesso, restringir alguém a só ver as viagens em que está escalado.</p>
      <p style="font-size:13px;color:var(--navy-800);margin:14px 0 8px;"><code>ultimo_acesso</code> é actualizada automaticamente pela própria conta de cada utilizador (login e a cada poucos minutos enquanto usa a app), e é o que permite ver, na lista acima, "Online agora" ou "Há X min/h/dia(s)" desde a última vez que cada pessoa esteve no sistema. A política <code>perfil_proprio</code> já cobre esta escrita, não precisa de nenhuma política extra.</p>
      <p style="font-size:13px;color:var(--navy-800);margin:14px 0 8px;">Os níveis de acesso deixaram de ser uma lista fixa de 6 valores — agora são configuráveis em <b>Configurações &gt; Níveis de Acesso</b>, e a coluna <code>role</code> passou a guardar o identificador do nível configurado (por isso já não deve ter uma restrição <code>CHECK</code> presa aos 6 nomes antigos). Se a tabela já tinha essa restrição de uma instalação anterior, remova-a com:</p>
      <pre style="background:var(--navy-900);color:#7EE787;padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap;">ALTER TABLE frota_perfis DROP CONSTRAINT IF EXISTS frota_perfis_role_check;</pre>
      <p style="font-size:12px;color:var(--text-muted);margin:8px 0 0;">Não é preciso mais nenhuma alteração na base de dados: os 6 níveis antigos (Administrador, Operador, Leitor, Relato Viagens, Caixa, Atendente) continuam a existir automaticamente como níveis de acesso configuráveis, com o mesmo comportamento de sempre — agora só editáveis em Configurações &gt; Níveis de Acesso.</p>
      <p style="font-size:12px;color:var(--text-muted);margin:8px 0 0;">Após configurar a tabela, convide utilizadores pelo botão "+ Convidar utilizador" acima — o sistema cria a conta no Supabase Auth com uma senha temporária que ninguém vê, e envia um email à pessoa para ela definir a própria senha. Se revogar o acesso de alguém e mais tarde a convidar outra vez com o mesmo email, o sistema reactiva a conta existente automaticamente (não é preciso pedir para usar "Esqueci a senha").</p>
    </div>
  `;
}

}

function gerarSenhaTemporaria(){
  // Senha aleatória de uso único — nunca é mostrada nem guardada; a pessoa define a sua própria ao aceitar o convite.
  const arr = new Uint8Array(24);
  (window.crypto||window.msCrypto).getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(36)).join('').slice(0,32)+'Aa1!';
}

async function convidarUtilizador(){
  const nome     = document.getElementById('nu-nome').value.trim();
  const email    = document.getElementById('nu-email').value.trim();
  const telefone = document.getElementById('nu-telefone').value.trim();
  const funcao   = document.getElementById('nu-funcao').value.trim();
  const role     = document.getElementById('nu-role').value;
  const pessoaId = document.getElementById('nu-pessoa').value;
  const confirmado = document.getElementById('nu-confirmado').checked;
  const errEl    = document.getElementById('nu-err');
  if(!nome)     { errEl.textContent='Introduza o nome.'; return; }
  if(!email)    { errEl.textContent='Introduza o email.'; return; }
  if(!telefone) { errEl.textContent='Introduza o telefone/WhatsApp usado para confirmar a identidade.'; return; }
  if(!confirmado){ errEl.textContent='Tem de confirmar a identidade da pessoa antes de enviar o convite.'; return; }
  if(!appEstaHospedadaPublicamente()){
    errEl.textContent='Esta aplicação está a correr localmente (localhost/ficheiro), não online. O link do convite não vai funcionar no telemóvel da pessoa. Hospede primeiro a app num serviço como Netlify ou Vercel.';
    return;
  }
  errEl.textContent='A enviar convite...';
  try{
    const { data: { session: adminSession } } = await _sb.auth.getSession();
    const adminToken = adminSession?.access_token || SUPABASE_KEY;
    const adminNome = currentPerfil?.nome || currentUser?.email || 'Administrador';

    // Cria a conta no Supabase Auth com uma senha temporária aleatória (ninguém a vê nem a usa)
    const signUpRes = await fetch(`${SUPABASE_URL}/auth/v1/signup?redirect_to=${encodeURIComponent(window.location.href.split('?')[0].split('#')[0])}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: gerarSenhaTemporaria() })
    });
    const signUpData = await signUpRes.json();
    const uid = signUpData?.id || signUpData?.user?.id;
    // Sinal do Supabase para "esta conta já existia antes" (identities vazio = não foi criada agora).
    // Isto acontece sempre que a pessoa já tinha sido convidada no passado e depois "Revogada":
    // revogar apaga o perfil (frota_perfis) mas NUNCA a conta de login em si — apagar essa conta
    // exigiria a service_role key do Supabase, que nunca pode viver no código do lado do cliente
    // (qualquer pessoa que veja o código-fonte da página conseguiria usá-la para controlar todas
    // as contas). Por isso, em vez de bloquear com um erro, reactivamos a conta existente abaixo.
    const jaExistia = Array.isArray(signUpData?.identities) && signUpData.identities.length===0;

    if(!uid){
      if(jaExistia || /already registered|already exists|user already/i.test(signUpData?.msg||signUpData?.error_description||signUpData?.message||'')){
        errEl.textContent = 'Este email já tem uma conta de login, mas não foi possível recuperar o identificador automaticamente para a reactivar. Peça à pessoa para usar "Esqueceu a senha?" no ecrã de login com este mesmo email — depois, edite aqui o nível de acesso dela assim que o nome aparecer na lista.';
      } else {
        errEl.textContent = signUpData?.msg || signUpData?.error_description || 'Erro ao criar conta. Tente novamente.';
      }
      return;
    }

    // Inserir/reactivar o perfil com token do admin (merge-duplicates = upsert pelo id)
    const res = await fetch(`${SUPABASE_URL}/rest/v1/frota_perfis`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + adminToken,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ id: uid, email, nome, funcao, role, telefone, pessoa_id: pessoaId||null, confirmado_por: adminNome, confirmado_em: new Date().toISOString() })
    });
    if(!res.ok){ const e=await res.text(); throw new Error(e); }

    // Envia o email para a pessoa definir a própria senha. Funciona tanto para uma conta nova
    // (define a primeira senha) como para uma conta reactivada (define uma senha nova; a antiga
    // deixa de servir, porque ela não a escolhe nem a vê aqui).
    await _sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href.split('?')[0].split('#')[0]
    });

    closeModal();
    if(jaExistia){
      audit('update','utilizador',uid,`Acesso reactivado: ${nome}`,`Email: ${email} · Telefone: ${telefone} · Nível: ${role} · Identidade confirmada por: ${adminNome}`);
      showToast(`Acesso de ${email} reactivado. A pessoa vai receber um email para definir uma nova senha.`,'success');
    } else {
      audit('create','utilizador',uid,`Utilizador convidado: ${nome}`,`Email: ${email} · Telefone: ${telefone} · Nível: ${role} · Identidade confirmada por: ${adminNome}`);
      showToast(`Convite enviado para ${email}. A pessoa vai receber um email para definir a própria senha.`,'success');
    }
    goTab('utilizadores');
  } catch(e){ errEl.textContent='Erro: '+e.message; }
}

async function alterarMinhaSenha(){
  const nova = document.getElementById('ms-nova').value;
  const conf = document.getElementById('ms-conf').value;
  const errEl = document.getElementById('ms-err');
  if(nova.length < 8){ errEl.textContent='A senha deve ter pelo menos 8 caracteres.'; return; }
  if(nova !== conf){ errEl.textContent='As senhas não coincidem.'; return; }

      // Remove só o perfil (frota_perfis). O CASCADE definido na tabela só actua no sentido
      // auth.users -> frota_perfis, não ao contrário — por isso isto NÃO apaga a conta de login.

      await sbRestFetch('DELETE','frota_perfis',`?id=eq.${userId}`);

/* ============================== NÍVEIS DE ACESSO (admin) ==============================
   Ecrã de configuração dos perfis de permissões definidos em MODULOS_ACESSO/RELATORIOS_SUB
   (ver bloco "NÍVEIS DE ACESSO" mais acima). Substitui os 6 níveis antigos, fixos no código,
   por níveis totalmente configuráveis aqui — criar, duplicar, editar e apagar. */
function resumoNivelAcesso(n){
  if(n.superAdmin) return 'Acesso total a todos os módulos';
  const modulosVisiveis = MODULOS_ACESSO.filter(m=>n.permissoes?.[m.id]?.ver).map(m=>m.label);
  if(n.permissoes?.relatorios?.ver){
    const subs = RELATORIOS_SUB.filter(s=>n.permissoes.relatorios.sub?.[s.id]?.ver).map(s=>s.label);
    modulosVisiveis.push(subs.length ? `Relatórios (${subs.join(', ')})` : 'Relatórios');
  }
  return modulosVisiveis.length ? modulosVisiveis.join(' · ') : 'Nenhum módulo visível';
}

function salvarNivelAcesso(id){
  const nome = document.getElementById('na-nome').value.trim();
  const errEl = document.getElementById('na-err');
  if(!nome){ errEl.textContent='Dê um nome a este nível de acesso.'; return; }
  const superAdmin = document.getElementById('na-superadmin').checked;
  const somenteLeituraGlobal = document.getElementById('na-somenteleitura').checked;
  const permissoes = permissoesModuloVazias();
  MODULOS_ACESSO.forEach(m=>{
    permissoes[m.id] = {
      ver: !!document.querySelector(`[data-na-ver="${m.id}"]`)?.checked,
      criar: !!document.querySelector(`[data-na-criar="${m.id}"]`)?.checked,
      editar: !!document.querySelector(`[data-na-editar="${m.id}"]`)?.checked,
      apagar: !!document.querySelector(`[data-na-apagar="${m.id}"]`)?.checked,
    };
  });
  permissoes.viagens.apenasProprios = !!document.querySelector(`[data-na-viagens-proprias]`)?.checked;
  const sub = {};
  RELATORIOS_SUB.forEach(s=>{
    sub[s.id] = {
      ver: !!document.querySelector(`[data-na-sub-ver="${s.id}"]`)?.checked,
      apenasProprios: !!document.querySelector(`[data-na-sub-proprios="${s.id}"]`)?.checked,
    };
  });
  permissoes.relatorios = {
    ver: !!document.querySelector(`[data-na-ver="relatorios"]`)?.checked,
    criar: !!document.querySelector(`[data-na-criar="relatorios"]`)?.checked,
    editar: !!document.querySelector(`[data-na-editar="relatorios"]`)?.checked,
    apagar: !!document.querySelector(`[data-na-apagar="relatorios"]`)?.checked,
    sub,
  };

  state.niveisAcesso = state.niveisAcesso || [];
  if(id){
    const alvo = state.niveisAcesso.find(x=>x.id===id);
    if(!alvo || alvo.fixo){ errEl.textContent='Este nível não pode ser editado.'; return; }
    Object.assign(alvo,{nome,superAdmin,somenteLeituraGlobal,permissoes});
    audit('update','nivelAcesso',id,`Nível de acesso editado: ${nome}`);
  } else {
    const novoId = uid('nivel');
    state.niveisAcesso.push({id:novoId,nome,fixo:false,superAdmin,somenteLeituraGlobal,permissoes});
    audit('create','nivelAcesso',novoId,`Nível de acesso criado: ${nome}`);
  }
  saveState();
  closeModal();
  showToast('Nível de acesso guardado.','success');
  goTab('niveisAcesso');
}

function duplicarNivelAcesso(id){
  const n = (state.niveisAcesso||[]).find(x=>x.id===id);
  if(!n) return;
  const copia = JSON.parse(JSON.stringify(n));
  copia.id = uid('nivel');
  copia.fixo = false;
  copia.nome = n.nome + ' (cópia)';
  state.niveisAcesso = state.niveisAcesso || [];
  state.niveisAcesso.push(copia);
  saveState();
  audit('create','nivelAcesso',copia.id,`Nível de acesso duplicado a partir de "${n.nome}": ${copia.nome}`);
  showToast('Nível de acesso duplicado. Já pode editá-lo livremente.','success');
  goTab('niveisAcesso');
}

async function apagarNivelAcesso(id){
  const n = (state.niveisAcesso||[]).find(x=>x.id===id);
  if(!n) return;
  if(n.fixo){ showToast('Este nível de acesso é protegido e não pode ser apagado.','error'); return; }
  let emUso = false;
  try{
    const rows = await sbRestFetch('GET','frota_perfis',`?role=eq.${encodeURIComponent(id)}&select=id&limit=1`);
    emUso = !!(rows && rows.length>0);
  }catch(e){ /* offline — não bloqueia; segue-se só com a confirmação normal abaixo */ }
  if(emUso){
    showToast('Ainda há utilizadores com este nível de acesso atribuído. Mude-os para outro nível em Utilizadores antes de o apagar.','error');
    return;
  }
  confirmAction(`Apagar o nível de acesso "${n.nome}"? Esta acção não pode ser desfeita.`, ()=>{
    state.niveisAcesso = (state.niveisAcesso||[]).filter(x=>x.id!==id);
    saveState();
    audit('delete','nivelAcesso',id,`Nível de acesso apagado: ${n.nome}`);

/* ============================== LOGIN ============================== */
async function fazerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const btn   = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email){ errEl.textContent='Introduza o email.'; document.getElementById('login-email').focus(); return; }
  if(!pass){  errEl.textContent='Introduza a senha.'; document.getElementById('login-pass').focus(); return; }
  btn.disabled=true; btn.textContent='A verificar...';
  try{
    const { data, error } = await _sb.auth.signInWithPassword({ email, password: pass });
    if(error){
      errEl.textContent = traduzirErroAuth(error.message);
      document.getElementById('login-pass').value='';
      document.getElementById('login-pass').focus();
    } else {
      currentUser = data.user;
      const temPerfil = await carregarPerfil();
      if(!temPerfil){
        // Conta de login válida, mas sem perfil em frota_perfis: acesso foi revogado
        // (ou nunca chegou a ser configurado por um administrador). Não deixar entrar.
        await _sb.auth.signOut();
        currentUser = null; currentPerfil = null;
        errEl.textContent = 'Esta conta já não tem acesso a este sistema. Contacte um administrador.';
        document.getElementById('login-pass').value='';
        btn.disabled=false; btn.textContent='Entrar';
        return;
      }
      audit('action','utilizador',data.user.id,`Entrada no sistema`,`Email: ${data.user.email}`);
      abrirApp();
    }
  } catch(e){ errEl.textContent='Erro de ligação. Verifique a internet.'; }
  btn.disabled=false; btn.textContent='Entrar';
}

async function enviarRecuperacao(){
  const email = document.getElementById('recuperar-email').value.trim();
  const btn   = document.getElementById('recuperar-btn');
  const msgEl = document.getElementById('recuperar-msg');
  msgEl.textContent=''; msgEl.style.color='var(--danger)';
  if(!email){ msgEl.textContent='Introduza o email.'; return; }
  if(!appEstaHospedadaPublicamente()){
    msgEl.textContent='Esta aplicação está a correr localmente, não online. O link de recuperação não vai funcionar noutro dispositivo. Hospede a app num serviço como Netlify ou Vercel.';
    return;
  }
  btn.disabled=true; btn.textContent='A enviar...';
  try{
    const { error } = await _sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href.split('?')[0].split('#')[0]
    });
    if(error){ msgEl.textContent = traduzirErroAuth(error.message); }
    else {
      msgEl.style.color='var(--success)';
      msgEl.textContent='Link enviado! Verifique o seu email (incluindo a pasta de spam).';
    }
  } catch(e){ msgEl.textContent='Erro de ligação. Tente mais tarde.'; }
  btn.disabled=false; btn.textContent='Enviar link de recuperação';
}

async function definirNovaSenha(){
  const nova  = document.getElementById('nova-senha').value;
  const conf  = document.getElementById('nova-senha-conf').value;
  const btn   = document.getElementById('nova-senha-btn');
  const msgEl = document.getElementById('nova-senha-msg');
  msgEl.textContent=''; msgEl.style.color='var(--danger)';
  if(nova.length < 8){ msgEl.textContent='A senha deve ter pelo menos 8 caracteres.'; return; }
  if(nova !== conf){   msgEl.textContent='As senhas não coincidem.'; return; }
  btn.disabled=true; btn.textContent='A guardar...';
  try{
    const { error } = await _sb.auth.updateUser({ password: nova });
    if(error){ msgEl.textContent = traduzirErroAuth(error.message); }
    else {
      audit('action','utilizador',currentUser?currentUser.id:null,'Senha alterada pelo próprio utilizador');
      msgEl.style.color='var(--success)';
      msgEl.textContent='Senha alterada com sucesso! A entrar...';
      setTimeout(()=>{
        mostrarPainelLogin();
        showToast('Senha actualizada. Pode usar a nova senha.','success');
      }, 1800);
    }
  } catch(e){ msgEl.textContent='Erro. Tente novamente.'; }

}

function traduzirErroAuth(msg){
  if(!msg) return 'Erro desconhecido.';
  if(msg.includes('Invalid login')) return 'Email ou senha incorrectos.';
  if(msg.includes('Email not confirmed')) return 'Email não confirmado. Verifique a sua caixa de entrada.';
  if(msg.includes('Too many requests')) return 'Demasiadas tentativas. Aguarde alguns minutos.';
  if(msg.includes('User not found')) return 'Utilizador não encontrado.';
  if(msg.includes('Password should be')) return 'A senha deve ter pelo menos 6 caracteres.';
  return msg;
}

/* ============================== PERFIL DO UTILIZADOR ============================== */
// Devolve true se encontrou/carregou um perfil válido, ou false se o acesso foi revogado
// (não existe nenhuma linha em frota_perfis para esta conta) ou houve erro a carregá-lo.
// IMPORTANTE: "não encontrei perfil" tem de significar "sem acesso", nunca "acesso por
// omissão" — caso contrário, uma conta revogada (frota_perfis apagado, mas a conta de
// login do Supabase Auth continua a existir, porque essa não pode ser apagada do lado do
// cliente) voltaria a entrar com um nível cheio de permissões assim que tentasse login.
async function carregarPerfil(){
  if(!currentUser) return false;
  try{
    let rows = await sbRestFetch('GET','frota_perfis',`?id=eq.${currentUser.id}&select=id,nome,funcao,role,pessoa_id`);
    if(!rows || rows.length===0){
      rows = await sbRestFetch('GET','frota_perfis',`?email=eq.${encodeURIComponent(currentUser.email)}&select=id,nome,funcao,role,pessoa_id`);
      if(rows && rows.length>0){
        await sbRestFetch('PATCH','frota_perfis',`?email=eq.${encodeURIComponent(currentUser.email)}`,{ id: currentUser.id });
      }
    }
    if(!rows || rows.length===0){
      // Acesso revogado (ou nunca convidado por perfil): não atribuir nenhum nível por omissão.
      currentPerfil = null;
      return false;
    }
    currentPerfil = rows[0];
    currentPerfil.pessoaId = currentPerfil.pessoa_id || null;
  } catch(e){
    currentPerfil = null;
    return false;
  }
  registarUltimoAcesso(); // não bloqueia a entrada — corre em segundo plano
  const nome = currentPerfil.nome || currentUser.email || '?';
  const iniciais = nome.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const funcaoLabel = currentPerfil.funcao || getPerfilAcesso().nome || 'Operador';
  const avatarEl = document.getElementById('user-avatar');
  const nomeEl   = document.getElementById('user-nome');
  const funcaoEl = document.getElementById('user-funcao');
  if(avatarEl) avatarEl.textContent = iniciais || '?';
  if(nomeEl)   nomeEl.textContent   = nome;
  if(funcaoEl) funcaoEl.textContent = funcaoLabel;
  // Banner de modo leitura
  const bannerExist = document.getElementById('leitor-banner');
  if(isLeitor() && !bannerExist){
    const banner = document.createElement('div');
    banner.id = 'leitor-banner';
    banner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 10px;';
    banner.innerHTML = '<span style="display:block;width:28px;height:1.5px;background:#fff;opacity:.6;"></span><span style="display:block;width:28px;height:1.5px;background:#fff;opacity:.6;"></span>';
    document.getElementById('sidebar')?.prepend(banner);
  }
  return true;
}

async function registarUltimoAcesso(){
  // "Heartbeat": grava a hora actual como último acesso do utilizador autenticado.
  // Chamado no login/reabertura da app e periodicamente enquanto a aba está visível,
  // para que "última vez online" reflicta também quem ficou a usar o sistema, não só
  // o momento exacto do login.
  if(!currentUser) return;
  try{ await sbRestFetch('PATCH','frota_perfis',`?id=eq.${currentUser.id}`,{ ultimo_acesso: new Date().toISOString() }); }
  catch(e){ /* falha silenciosa — nunca deve bloquear ou interromper o uso da app */ }
}
let ultimoAcessoTimer = null;
function iniciarHeartbeatUltimoAcesso(){
  clearInterval(ultimoAcessoTimer);
  ultimoAcessoTimer = setInterval(()=>{
    if(document.hidden) return;
    registarUltimoAcesso();
  }, 4*60*1000); // a cada 4 minutos, só com a aba visível
}

function isAdmin(){ return !!(currentPerfil && getPerfilAcesso().superAdmin); }
function isLeitor(){
  // Só leitura global (nível inteiro marcado como "somente leitura"), ou sem nenhuma das três
  // permissões de acção (criar/editar/apagar) dentro do módulo actualmente aberto. Usada hoje
  // só para o aviso "MODO LEITURA" na barra lateral — o bloqueio real dos botões é granular
  // (ver podeNoModulo/naoPodeCriar/naoPodeEditar/naoPodeApagar).
  if(!currentPerfil) return false;
  const perfil = getPerfilAcesso();
  if(perfil.superAdmin) return false;
  if(perfil.somenteLeituraGlobal) return true;
  const pm = permModulo(chaveModuloAtual());
  return !(pm.criar || pm.editar || pm.apagar);
}
function podeEditar(){ return !isLeitor(); }

async function iniciarApp(){
  await loadState();
  atualizarIndicadorSync();
  const temPerfil = await carregarPerfil();
  if(!temPerfil){
    // Sessão restaurada automaticamente (ex: reabriu a página), mas o acesso desta conta
    // foi entretanto revogado — não há perfil em frota_perfis. Terminar a sessão e mandar
    // de volta para o ecrã de login, em vez de deixar entrar com um nível por omissão.
    await _sb.auth.signOut();
    currentUser = null; currentPerfil = null;
    document.getElementById('app').style.display='none';
    document.getElementById('login-screen').style.display='flex';
    mostrarPainelLogin();
    document.getElementById('login-error').textContent = 'Esta conta já não tem acesso a este sistema. Contacte um administrador.';
    return;

  if(isAdmin()) limparLixeiraExpirada();
  renderNav();

  document.getElementById('topbar-date').textContent=hoje.toLocaleDateString('pt-PT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

  goTab(tabInicial);

  iniciarHeartbeatUltimoAcesso();
}

/* ── Agrupamento opcional de itens por "Sub-grupo" ──
   Quando o utilizador preenche o campo "Sub-grupo" em duas ou mais linhas com o mesmo nome
   (ex: "Portagens"), essas linhas passam a aparecer juntas, com um cabeçalho a mostrar a
   soma do sub-grupo e as linhas individuais indentadas por baixo. Itens sem sub-grupo
   continuam a aparecer normalmente, na posição em que foram inseridos. */
function rvAgruparItens(itens){
  const blocks = [];
  const grupoIndex = {};
  (itens||[]).forEach(item=>{
    const sub = (item.subgrupo||'').trim();
    if(!sub){
      blocks.push({tipo:'item', item});
    } else {
      if(grupoIndex[sub]==null){
        grupoIndex[sub] = blocks.length;
        blocks.push({tipo:'grupo', nome:sub, itens:[item]});
      } else {
        blocks[grupoIndex[sub]].itens.push(item);
      }
    }
  });
  return blocks;
}

  return vals.map((v,i)=>({valor:v!==''?Number(v):null, nota:notas[i], subgrupo:subs[i]||''})).filter(x=>x.valor!=null||x.nota||x.subgrupo);
}

function rcSomaItens(itens){ return (itens||[]).reduce((s,i)=>s+(Number(i.valor)||0),0); }

/* ── Saldo actual por meio financeiro ──
   Combina o Saldo Inicial (fixos + outros) com as Entradas e Saídas já registadas,
   agrupando por meio (Dinheiro Físico, E-Mola, M-Pesa, M-Kesh, Ponto 24, ou outro meio
   personalizado). Isto permite mostrar, mesmo com o caixa ainda aberto, quanto se espera
   ter em cada meio neste momento — sem depender de uma contagem física. */
function rcSaldosPorMeio(fixosSI, outrosSI, entradas, saidas){
  const map=new Map(); const ordem=[];
  function add(meio, delta){
    const key = (meio||'').trim() || 'Outro';
    if(!map.has(key)){ map.set(key,0); ordem.push(key); }
    map.set(key, map.get(key)+delta);
  }
  RC_MEIOS_FIXOS.forEach(m=>add(m,0));
  (fixosSI||[]).forEach((f,i)=>add(f.meio||RC_MEIOS_FIXOS[i], Number(f.valor)||0));
  (outrosSI||[]).forEach(o=>add(o.descricao||'Outro', Number(o.valor)||0));
  (entradas||[]).forEach(e=>add(e.meio, Number(e.valor)||0));
  (saidas||[]).forEach(s=>add(s.meio, -(Number(s.valor)||0)));
  return ordem.map(m=>({meio:m, saldo:map.get(m)}));
}
function rcSaldosPorMeioRowsHtml(saldos){
  return (saldos||[]).map(s=>`<div class="flex-between"><span class="muted">${esc(s.meio)}</span><span class="num" style="${s.saldo<-0.01?'color:var(--danger);':''}">${fmtMT(s.saldo)}</span></div>`).join('')
    || `<div class="muted" style="font-size:12.5px;">Sem valores.</div>`;
}

function rcTotaisHtml(A,B,C,D,E,F,G,H){
  const okH = Math.abs(H)<0.01;
  return `
    <div class="flex-between"><span class="muted">Sub-total A · Saldo Inicial</span><span class="num">${fmtMT(A)}</span></div>
    <div class="flex-between"><span class="muted">Sub-total B · Entradas</span><span class="num">${fmtMT(B)}</span></div>
    <div class="flex-between"><span class="muted">Sub-total C · Saídas</span><span class="num">${fmtMT(C)}</span></div>
    <div class="flex-between" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px;"><span class="muted">Total Positivo (D = A+B)</span><span class="num">${fmtMT(D)}</span></div>
    <div class="flex-between"><span class="muted">Total das Saídas (E = C)</span><span class="num">${fmtMT(E)}</span></div>
    <div class="flex-between"><b>Saldo Final (F = D−E)</b><b class="num">${fmtMT(F)}</b></div>
    <div class="flex-between" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px;"><span class="muted">Saldo Depositado (G)</span><span class="num">${fmtMT(G)}</span></div>
    <div class="flex-between"><b>Remanescente (H = F−G)</b><b class="num" style="color:${okH?'var(--success)':'var(--danger)'};">${fmtMT(H)}</b></div>`;
}

function rcRecalc(){
  const totaisEl = document.getElementById('rc-totais');
  if(!totaisEl) return;
  const fixosSI = rcColetarSiFixos();
  const outrosSI = rcColetarSiOutros();
  const entradas = rcColetarGrupo('entradas');
  const saidas = rcColetarGrupo('saidas');
  const A = rcSomaItens(fixosSI)+rcSomaItens(outrosSI);
  const B = rcSomaItens(entradas);
  const C = rcSomaItens(saidas);
  const D = A+B, E = C, F = D-E;
  const gEl = document.getElementById('rc-depositado');
  const G = gEl && gEl.value!=='' ? Number(gEl.value) : 0;
  const H = F-G;
  totaisEl.innerHTML = rcTotaisHtml(A,B,C,D,E,F,G,H);
  const saldosMeioEl = document.getElementById('rc-saldos-meio');
  if(saldosMeioEl) saldosMeioEl.innerHTML = rcSaldosPorMeioRowsHtml(rcSaldosPorMeio(fixosSI, outrosSI, entradas, saidas));
}

/* ── Continuidade de saldo entre caixas ──
   O saldo inicial de um novo caixa deve corresponder ao Remanescente (H) do último caixa
   fechado pela mesma pessoa (o que ficou por depositar, não o Saldo Final F, que é antes
   do depósito). "Mesma pessoa" é identificada por criadoPor (o utilizador com sessão
   iniciada), a mesma identidade já usada para verificar "já tem um caixa aberto". */
function rcUltimoCaixaFechado(nome){
  if(!nome) return null;
  return (state.relatoriosCaixa||[])
    .filter(r=>!r.viaDe && r.status==='fechado' && r.criadoPor===nome)
    .sort((a,b)=>new Date(b.fechadoEm||b.criadoEm)-new Date(a.fechadoEm||a.criadoEm))[0] || null;
}
function rcSaldoEsperado(ultimo){
  if(!ultimo) return 0;
  return ultimo.remanescenteH!=null ? ultimo.remanescenteH : (ultimo.saldoFinalF||0);
}
function rcPreencherSaldoEsperado(){
  const info = window._rcSaldoEsperadoInfo;
  if(!info) return;
  // Se o caixa anterior tem a contagem de fecho registada por meio (físico, E-Mola, M-Pesa,
  // etc.), preenche cada meio directamente no seu campo. Só recorre ao valor único (lump-sum)
  // em "Outros" para caixas antigos, fechados antes desta funcionalidade existir.
  if(info.fixos && info.fixos.length){
    const valEls=[...document.querySelectorAll('#rc-si-fixos [data-rc-si-fixo-valor]')];
    const obsEls=[...document.querySelectorAll('#rc-si-fixos [data-rc-si-fixo-obs]')];
    info.fixos.forEach((f,i)=>{
      if(valEls[i]) valEls[i].value = (f.valor!=null && f.valor!=='') ? f.valor : 0;
      if(obsEls[i] && !obsEls[i].value) obsEls[i].value = 'Preenchido automaticamente (contagem do caixa anterior)';
    });
    if(info.outros && info.outros.length){
      const container = document.getElementById('rc-si-outros-container');
      info.outros.forEach(o=>{
        container.insertAdjacentHTML('beforeend', rcSiOutroRowHtml({
          descricao: o.descricao || 'Outro meio',
          valor: o.valor,
          obs: 'Preenchido automaticamente (contagem do caixa anterior)'
        }));
      });
    }
    showToast('Saldo inicial preenchido automaticamente, meio a meio, com a contagem de fecho do caixa anterior.','success');
  } else {
    document.getElementById('rc-si-outros-container').insertAdjacentHTML('beforeend',
      rcSiOutroRowHtml({ descricao:'Transportado do caixa anterior ('+info.dataLabel+')', valor:info.valor, obs:'Preenchido automaticamente' }));
    showToast('Saldo inicial preenchido automaticamente.','success');
  }
  rcRecalc();
}

/* ── Abertura/fecho de caixa e autorização de edição ──
   Regra: enquanto o relatório está ABERTO, o caixa pode ACRESCENTAR novas entradas/saídas
   livremente, sem pedir autorização (ver rcAdicionarRapido). Mas EDITAR algo já registado
   (mudar um valor, remover uma linha, mexer no saldo inicial, etc.) exige sempre autorização
   do administrador — mesmo com o caixa ainda aberto. Só o administrador edita directamente;
   qualquer outra pessoa tem de pedir autorização, e a edição aprovada não altera o original —
   cria uma "via" nova (2ª via, 3ª via...), guardada lado a lado com as anteriores, para
   poderem ser comparadas. O botão "Fechar caixa" bloqueia novos registos (entradas/saídas);
   para registar outro dia é preciso abrir um novo relatório. */
function podeEditarFolhaCaixaDireto(r){
  return isAdmin();
}
function rcGrupoId(r){ return r.viaDe || r.id; }
function rcVias(grupoId){
  return (state.relatoriosCaixa||[]).filter(r=>rcGrupoId(r)===grupoId).sort((a,b)=>(a.viaNumero||1)-(b.viaNumero||1));
}
function rcCaixaAbertoDoUtilizador(){
  const nome = currentPerfil?.nome || currentUser?.email || '—';
  return (state.relatoriosCaixa||[]).find(r=>!r.viaDe && r.status==='aberto' && r.criadoPor===nome);
}
function rcPodeRegistarRapido(r){
  if(naoPodeCriar('relatorios')) return false;
  if(r.status!=='aberto') return false;

  return isAdmin() || r.criadoPor===nome;
}

/* ============================== RELATÓRIO DE CAIXA POR PERÍODO (agregação, só leitura) ==============================
   Agrega os relatórios de caixa "originais" (ignora vias de edição, para não duplicar valores)
   dentro de um intervalo de datas. O Saldo Inicial do período é o do primeiro caixa do
   intervalo; o resto telescopa (A_seguinte = Remanescente do anterior), por isso
   Saldo Final do período = A(primeiro) + ΣEntradas − ΣSaídas, e Remanescente do período =
   Saldo Final − ΣDepositado. Isto só é exacto quando não há falhas de continuidade
   (dias sem caixa aberto), o que é assinalado ao utilizador. */
const RC_PERIODOS = [
  {id:'dias',      label:'Dias (Dia X a Dia Y)'},
  {id:'semanal',   label:'Semanal'},
  {id:'mensal',    label:'Mensal'},
  {id:'trimestral',label:'Trimestral'},
  {id:'semestral', label:'Semestral'},
  {id:'anual',     label:'Anual'},
  {id:'2anos',     label:'2 Anos'},
  {id:'5anos',     label:'5 Anos'},
  {id:'10anos',    label:'10 Anos'},
];
function rcHojeISO(){ return new Date().toISOString().slice(0,10); }
function rcSomarDias(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function rcCalcularInicio(tipo, fimISO){
  const d = new Date(fimISO+'T00:00:00');
  switch(tipo){
    case 'semanal':    d.setDate(d.getDate()-6); break;
    case 'mensal':     d.setMonth(d.getMonth()-1); d.setDate(d.getDate()+1); break;
    case 'trimestral': d.setMonth(d.getMonth()-3); d.setDate(d.getDate()+1); break;
    case 'semestral':  d.setMonth(d.getMonth()-6); d.setDate(d.getDate()+1); break;
    case 'anual':      d.setFullYear(d.getFullYear()-1); d.setDate(d.getDate()+1); break;
    case '2anos':      d.setFullYear(d.getFullYear()-2); d.setDate(d.getDate()+1); break;
    case '5anos':      d.setFullYear(d.getFullYear()-5); d.setDate(d.getDate()+1); break;
    case '10anos':     d.setFullYear(d.getFullYear()-10); d.setDate(d.getDate()+1); break;
    default: return fimISO;
  }
  return d.toISOString().slice(0,10);
}
window._rcpTipo = window._rcpTipo || 'mensal';
window._rcpFim = window._rcpFim || rcHojeISO();
window._rcpInicioCustom = window._rcpInicioCustom || rcSomarDias(rcHojeISO(),-6);

function rcpIntervaloAtual(){
  const tipo = window._rcpTipo;
  const fim = window._rcpFim || rcHojeISO();
  const inicio = tipo==='dias' ? (window._rcpInicioCustom||fim) : rcCalcularInicio(tipo, fim);
  return {tipo, inicio, fim};
}
function rcpMudarTipo(tipo){ window._rcpTipo = tipo; renderContent(); }
function rcpMudarFim(v){ window._rcpFim = v; renderContent(); }
function rcpMudarInicioCustom(v){ window._rcpInicioCustom = v; renderContent(); }

/* Agrega uma lista (já filtrada e ordenada por data ascendente) de relatórios "originais". */
function rcAgregarPeriodo(lista){
  if(!lista.length) return null;
  const primeiro = lista[0], ultimo = lista[lista.length-1];
  const fixosSI = primeiro.saldoInicial?.fixos||[];
  const outrosSI = primeiro.saldoInicial?.outros||[];
  const todasEntradas = lista.flatMap(r=>r.entradas||[]);
  const todasSaidas = lista.flatMap(r=>r.saidas||[]);
  const A = rcSomaItens(fixosSI)+rcSomaItens(outrosSI);
  const B = lista.reduce((s,r)=>s+(Number(r.subtotalB)||0),0);
  const C = lista.reduce((s,r)=>s+(Number(r.subtotalC)||0),0);
  const G = lista.reduce((s,r)=>s+(Number(r.saldoDepositadoG)||0),0);
  const F = A+B-C;
  const H = F-G;
  // Deteta falhas de continuidade: dia N deveria abrir com o Remanescente do dia N-1.
  let falhaContinuidade = false;
  for(let i=1;i<lista.length;i++){
    const anterior = lista[i-1], atual = lista[i];
    const esperado = anterior.remanescenteH!=null ? anterior.remanescenteH : (anterior.saldoFinalF-(anterior.saldoDepositadoG||0));
    const atualA = Number(atual.subtotalA)||0;
    if(Math.abs(atualA-esperado)>0.01) falhaContinuidade=true;
  }
  return {
    A,B,C,F,G,H, falhaContinuidade,
    numRegistos:lista.length,
    abertos: lista.filter(r=>r.status==='aberto').length,
    fechados: lista.filter(r=>r.status==='fechado').length,
    primeiro, ultimo,
    saldosPorMeio: rcSaldosPorMeio(fixosSI, outrosSI, todasEntradas, todasSaidas)
  };
}
function rcpListaFiltrada(){
  const nomeAtual = currentPerfil?.nome || currentUser?.email || '—';
  const restrito = relatorioApenasProprios('caixaPeriodo');
  const {inicio,fim} = rcpIntervaloAtual();
  return (state.relatoriosCaixa||[])
    .filter(r=>!r.viaDe)
    .filter(r=> !restrito || r.criadoPor===nomeAtual)
    .filter(r=> r.data>=inicio && r.data<=fim)
    .sort((a,b)=> new Date(a.data)-new Date(b.data) || new Date(a.criadoEm)-new Date(b.criadoEm));
}

    <div id="rc-si-outros-container">${(si.outros||[]).map(o=>rcSiOutroRowHtml(o)).join('')}</div>

    <button class="btn btn-ghost btn-sm" onclick="rcAddLinha('entradas','Origem (ex: Venda de bilhetes)')">+ Adicionar entrada</button>

    <div id="rc-saidas-container">${(rc.saidas||[]).length?rc.saidas.map(i=>rcLinhaRowHtml(i,'Origem (ex: Combustível)')).join(''):rcLinhaRowHtml({},'Origem (ex: Combustível)')}</div>

function formRelatorioCaixaEditar(id){
  const rc=(state.relatoriosCaixa||[]).find(x=>x.id===id);
  if(!rc) return;
  if(!podeEditarFolhaCaixaDireto(rc) && !(rc.pedido && rc.pedido.status==='aprovado')){
    showToast('Não tem autorização para editar este relatório. Peça autorização ao administrador.','error');
    return;
  }
  formRelatorioCaixa(rc);
}

function salvarRelatorioCaixa(rcId){
  if(naoPodeCriar('relatorios') && naoPodeEditar('relatorios')){ showToast('Sem permissão.','error'); return; }
  const data=document.getElementById('rc-data').value;
  if(!data){ showToast('Preencha a data.','error'); return; }
  const operador=document.getElementById('rc-operador').value.trim();
  const local=document.getElementById('rc-local').value.trim();
  const fixos=rcColetarSiFixos();
  const outros=rcColetarSiOutros();
  const entradas=rcColetarGrupo('entradas');
  const saidas=rcColetarGrupo('saidas');
  if(entradas.some(x=>!x.meio) || saidas.some(x=>!x.meio)){
    showToast('Indique o meio (Físico, E-Mola, M-Pesa, M-Kesh, etc.) em todas as entradas e saídas.','error');
    return;
  }
  const A=rcSomaItens(fixos)+rcSomaItens(outros);
  const B=rcSomaItens(entradas);
  const C=rcSomaItens(saidas);
  const D=A+B, E=C, F=D-E;
  const gVal=document.getElementById('rc-depositado').value;
  const G=gVal!==''?Number(gVal):0;
  const H=F-G;
  const idx=state.relatoriosCaixa.findIndex(r=>r.id===rcId);
  const existente = idx>-1 ? state.relatoriosCaixa[idx] : null;
  const camposFolha = {
    data, operador, local,
    saldoInicial:{fixos, outros}, entradas, saidas,
    subtotalA:A, subtotalB:B, subtotalC:C,
    totalPositivoD:D, totalSaidasE:E, saldoFinalF:F,
    saldoDepositadoG:G, remanescenteH:H,
    assinaturaCaixa:document.getElementById('rc-assinatura-caixa').value.trim(),
    assinaturaMonitor:document.getElementById('rc-assinatura-monitor').value.trim(),
    notas:document.getElementById('rc-notas').value.trim(),
  };

  if(existente && !podeEditarFolhaCaixaDireto(existente)){
    // Só se chega aqui com uma autorização válida (verificado de novo, por segurança)
    if(!(existente.pedido && existente.pedido.status==='aprovado')){
      showToast('Não tem autorização para editar este relatório.','error');
      closeModal();
      return;
    }
    const grupoId = rcGrupoId(existente);
    const vias = rcVias(grupoId);
    const proximoNumero = Math.max(...vias.map(v=>v.viaNumero||1)) + 1;
    const nome = currentPerfil?.nome || currentUser?.email || '—';
    const novaVia = Object.assign({id:uid('rc')}, camposFolha, {
      viaDe: grupoId,
      viaNumero: proximoNumero,
      status: existente.status||'fechado',
      fechadoPor: existente.fechadoPor||null,
      fechadoEm: existente.fechadoEm||null,
      criadoPor: existente.criadoPor,
      editadoPor: nome,
      pedido: null,
      criadoEm: new Date().toISOString()
    });
    state.relatoriosCaixa.push(novaVia);
    // Consome a autorização no original — não altera os dados do original, só fecha o pedido
    state.relatoriosCaixa[idx] = Object.assign({}, existente, { pedido: Object.assign({}, existente.pedido, {status:'usado'}) });
    saveState(); closeModal(); relatoriosSubTab='caixa'; renderContent();
    audit('update','relatorioCaixa',novaVia.id,`${proximoNumero}ª via criada (edição autorizada)`,`Relatório original: ${grupoId}`);
    showToast(`Guardado como ${proximoNumero}ª via. O relatório original foi mantido, para comparação.`,'success');
    return;
  }

  if(idx===-1){
    // Abertura de um novo caixa: o saldo inicial (A) deve corresponder ao remanescente (H)
    // do último caixa fechado pela mesma pessoa. Se não bater, não passa em silêncio.
    const nomeAtual = currentPerfil?.nome || currentUser?.email || '—';
    const ultimoFechado = rcUltimoCaixaFechado(nomeAtual);
    if(ultimoFechado){
      const esperado = rcSaldoEsperado(ultimoFechado);
      if(Math.abs(A-esperado) > 0.01){
        window._rcPendingSave = { rcId, camposFolha };
        abrirDivergenciaSaldoModal(esperado, A, ultimoFechado);
        return;
      }
    }
  }

  finalizarSalvarRelatorioCaixa(rcId, idx, existente, camposFolha, null);
}

function abrirDivergenciaSaldoModal(esperado, informado, ultimoFechado){
  const diff = informado - esperado;
  openModal(`
    <p class="modal-title" style="color:var(--danger);">⚠ Saldo inicial não confere</p>
    <p class="modal-sub">O saldo inicial informado (${fmtMT(informado)}) é diferente do remanescente do último caixa fechado por ${esc(ultimoFechado.criadoPor)} em ${fmtData(ultimoFechado.fechadoEm||ultimoFechado.data)} (${fmtMT(esperado)}). Diferença: <b style="color:var(--danger);">${fmtMT(diff)}</b>.</p>
    <p style="font-size:13px;color:var(--navy-800);">Isto pode ser um erro de digitação, dinheiro em falta, ou um ajuste legítimo (ex: reforço de caixa). Antes de continuar, explique o motivo — fica registado na auditoria e visível no histórico deste caixa.</p>
    <div class="form-row"><label>Motivo da diferença</label><textarea id="rcdiv-motivo" rows="3" placeholder="Explique porque o saldo inicial é diferente do esperado..."></textarea></div>
    <p id="rcdiv-err" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:4px 0;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal(); reabrirRascunhoRelatorioCaixa()">← Voltar e corrigir</button>
      <button class="btn btn-danger-ghost" onclick="confirmarSalvarComDivergencia()">Confirmar mesmo assim</button>
    </div>`);
}

function reabrirRascunhoRelatorioCaixa(){
  const pend = window._rcPendingSave;
  if(!pend){ formRelatorioCaixaNovo(); return; }
  formRelatorioCaixa(Object.assign({ id: pend.rcId }, pend.camposFolha));
}

function confirmarSalvarComDivergencia(){
  const motivo = document.getElementById('rcdiv-motivo').value.trim();
  const errEl = document.getElementById('rcdiv-err');
  if(!motivo){ errEl.textContent='Descreva o motivo da diferença antes de continuar.'; return; }
  const pend = window._rcPendingSave;
  if(!pend) return;
  finalizarSalvarRelatorioCaixa(pend.rcId, -1, null, pend.camposFolha, motivo);
  window._rcPendingSave = null;
}

function finalizarSalvarRelatorioCaixa(rcId, idx, existente, camposFolha, motivoDivergencia){
  if(idx>-1){
    // Caixa aberto (ou administrador a editar directamente): actualiza a via existente sem criar uma nova
    state.relatoriosCaixa[idx] = Object.assign({}, existente, camposFolha);
  } else {
    const novo = Object.assign({id:rcId}, camposFolha, {
      viaDe:null, viaNumero:1, pedido:null,
      status:'aberto', fechadoPor:null, fechadoEm:null,
      criadoPor: currentPerfil?.nome || currentUser?.email || '—',
      criadoEm: new Date().toISOString(),
    }, motivoDivergencia ? { saldoInicialDivergenciaMotivo: motivoDivergencia } : {});
    state.relatoriosCaixa.push(novo);
    if(motivoDivergencia){
      audit('action','relatorioCaixa',novo.id,'Caixa aberto com saldo inicial diferente do esperado', motivoDivergencia);
    }
  }
  saveState(); closeModal(); relatoriosSubTab='caixa'; renderContent();
  showToast('Relatório de caixa guardado.','success');
}

function fecharCaixaConfirm(id){
  const r=(state.relatoriosCaixa||[]).find(x=>x.id===id); if(!r) return;
  if(r.status!=='aberto'){ showToast('Este caixa já está fechado.',''); return; }
  const esperado = r.remanescenteH||0;
  window._rccEsperado = esperado;
  const outrosSI = (r.saldoInicial&&r.saldoInicial.outros)||[];
  openModal(`
    <p class="modal-title">Fechar caixa</p>
    <p class="modal-sub">${fmtData(r.data)} · ${esc(r.operador||'—')}${r.local?' · '+esc(r.local):''}</p>
    <p style="font-size:13px;color:var(--navy-800);">Antes de fechar, conte o dinheiro e o saldo que tem agora em cada meio. O total contado é comparado com o Remanescente (H) esperado — se não bater, terá de justificar a diferença para poder fechar o caixa.</p>
    <div class="section-divider">Contagem de fecho</div>
    <p style="font-size:12px;color:var(--text-muted);margin:-4px 0 8px;">Quanto tem, agora, em cada meio financeiro.</p>
    <div id="rcc-fixos">${RC_MEIOS_FIXOS.map((m,i)=>rcContagemFixoRowHtml(i,'','')).join('')}</div>
    <div id="rcc-outros-container">${outrosSI.map(o=>rcContagemOutroRowHtml({descricao:o.descricao})).join('')}</div>
    <button class="btn btn-ghost btn-sm" onclick="rcAddContagemOutro()">+ Adicionar outro meio contado</button>
    <div class="card" style="background:var(--bg);padding:12px 14px;margin:12px 0 4px;" id="rcc-total"></div>
    <p style="font-size:13px;color:var(--navy-800);margin-top:10px;">Depois de fechado, este relatório fica bloqueado: deixa de poder registar novas entradas/saídas directamente — só o administrador poderá editá-lo, e qualquer outra edição terá de ser pedida e autorizada. Para registar outro dia, terá de abrir um novo relatório.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();verRelatorioCaixa('${id}')">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarContagemFecho('${id}')">Continuar</button>
    </div>`,true);
  rccRecalc();
}

function confirmarContagemFecho(id){
  const r=(state.relatoriosCaixa||[]).find(x=>x.id===id); if(!r) return;
  const fixos = rcColetarContagemFixos();
  const outros = rcColetarContagemOutros();
  const total = rcSomaItens(fixos)+rcSomaItens(outros);
  const esperado = r.remanescenteH||0;
  const diff = total-esperado;
  const contagem = {fixos, outros, total, esperado, diferenca:diff};
  if(Math.abs(diff) < 0.01){
    fecharCaixa(id, contagem, null);
    return;
  }
  window._rccPendingFechar = { id, contagem };
  abrirDivergenciaFechoModal(esperado, total, diff);
}

function abrirDivergenciaFechoModal(esperado, contado, diff){
  const pend = window._rccPendingFechar;
  openModal(`
    <p class="modal-title" style="color:var(--danger);">⚠ Contagem não confere</p>
    <p class="modal-sub">O total contado agora (${fmtMT(contado)}) é diferente do Remanescente esperado (${fmtMT(esperado)}). Diferença: <b style="color:var(--danger);">${fmtMT(diff)}</b>.</p>
    <p style="font-size:13px;color:var(--navy-800);">Isto pode ser um erro de contagem, dinheiro em falta ou a mais, ou uma entrada/saída não registada. Antes de fechar, explique o motivo da diferença — fica registado na auditoria e visível no histórico deste caixa.</p>
    <div class="form-row"><label>Motivo da diferença</label><textarea id="rccdiv-motivo" rows="3" placeholder="Explique porque a contagem é diferente do esperado..."></textarea></div>
    <p id="rccdiv-err" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:4px 0;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();fecharCaixaConfirm('${pend.id}')">← Voltar e corrigir contagem</button>
      <button class="btn btn-danger-ghost" onclick="confirmarFecharComDivergencia()">Justificar e fechar mesmo assim</button>
    </div>`);
}

function confirmarFecharComDivergencia(){
  const motivo = document.getElementById('rccdiv-motivo').value.trim();
  const errEl = document.getElementById('rccdiv-err');
  if(!motivo){ errEl.textContent='Descreva o motivo da diferença antes de continuar.'; return; }
  const pend = window._rccPendingFechar;
  if(!pend) return;
  fecharCaixa(pend.id, pend.contagem, motivo);
  window._rccPendingFechar = null;
}

function fecharCaixa(id, contagem, motivoDivergencia){
  if(naoPodeEditar('relatorios')){ showToast('Sem permissão.','error'); return; }
  const idx=(state.relatoriosCaixa||[]).findIndex(x=>x.id===id);
  if(idx===-1) return;
  const r = state.relatoriosCaixa[idx];
  if(r.status!=='aberto'){ showToast('Este caixa já está fechado.',''); return; }
  const nome = currentPerfil?.nome || currentUser?.email || '—';
  const extra = contagem ? {
    contagemFechamento: { fixos:contagem.fixos, outros:contagem.outros },
    totalContagemFechamento: contagem.total,
    diferencaContagemFechamento: contagem.diferenca,
  } : {};
  if(motivoDivergencia) extra.contagemDivergenciaMotivo = motivoDivergencia;
  state.relatoriosCaixa[idx] = Object.assign({}, r, extra, { status:'fechado', fechadoPor:nome, fechadoEm:new Date().toISOString() });
  saveState();
  audit('action','relatorioCaixa',id,'Caixa fechado',`Por: ${nome}${motivoDivergencia?' · Diferença na contagem: '+fmtMT(contagem.diferenca)+' — '+motivoDivergencia:''}`);
  closeModal();
  relatoriosSubTab='caixa'; renderContent();
  showToast('Caixa fechado. Para registar outro dia, abra um novo relatório.','success');
}

/* ── Registo rápido de entradas/saídas (sem autorização, só enquanto o caixa está aberto) ──
   Isto NÃO passa pelo formulário de edição completo: acrescenta uma linha nova directamente
   ao relatório. Não mexe em linhas já existentes, por isso não conta como "editar algo já
   registado" e não precisa de autorização nem cria uma nova via. */
function formRcRegistoRapido(id, tipo){
  const r=(state.relatoriosCaixa||[]).find(x=>x.id===id); if(!r) return;
  if(!rcPodeRegistarRapido(r)){
    if(r.status!=='aberto') showToast('Este caixa está fechado. Não é possível acrescentar novos registos.','error');
    else showToast('Só quem abriu este caixa (ou o administrador) pode registar aqui.','error');
    return;
  }
  const label = tipo==='entradas' ? 'entrada' : 'saída';
  const placeholder = tipo==='entradas' ? 'Origem (ex: Venda de bilhetes)' : 'Origem (ex: Combustível)';
  openModal(`
    <p class="modal-title">Nova ${label}</p>
    <p class="modal-sub">Acrescentado directamente ao caixa aberto — não altera nenhum registo anterior nem precisa de autorização.</p>
    <div class="form-row"><label>${esc(placeholder)}</label><input id="rcq-origem" placeholder="${esc(placeholder)}"></div>
    <div class="form-row"><label>Meio</label>
      <select id="rcq-meio" onchange="document.getElementById('rcq-meio-outro').style.display=this.value==='__outro__'?'block':'none'">
        <option value="" disabled selected>Selecione o meio...</option>
        ${RC_MEIOS_FIXOS.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}
        <option value="__outro__">Outro...</option>
      </select>
      <input id="rcq-meio-outro" placeholder="Especifique o meio" style="display:none;margin-top:6px;">
    </div>
    <div class="form-row"><label>Valor (MT)</label><input id="rcq-valor" type="number" min="0" step="0.01" placeholder="0.00 MT"></div>
    <div class="form-row"><label>Observações (opcional)</label><input id="rcq-obs" placeholder="Observações"></div>
    <p id="rcq-err" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:4px 0;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();verRelatorioCaixa('${id}')">Cancelar</button>
      <button class="btn btn-primary" data-acao="criar" onclick="salvarRcRegistoRapido('${id}','${tipo}')">Guardar</button>
    </div>`);
}

function salvarRcRegistoRapido(id, tipo){
  const idx=(state.relatoriosCaixa||[]).findIndex(x=>x.id===id);
  if(idx===-1) return;
  const r = state.relatoriosCaixa[idx];
  if(!rcPodeRegistarRapido(r)){
    showToast('Sem permissão para registar aqui.','error');
    closeModal();
    return;
  }
  const origem = document.getElementById('rcq-origem').value.trim();
  const valorRaw = document.getElementById('rcq-valor').value;
  const obs = document.getElementById('rcq-obs').value.trim();
  const meioSel = document.getElementById('rcq-meio').value;
  const meioOutro = document.getElementById('rcq-meio-outro').value.trim();
  const meio = meioSel==='__outro__' ? meioOutro : meioSel;
  const errEl = document.getElementById('rcq-err');
  if(!origem || valorRaw===''){ errEl.textContent='Preencha a origem e o valor.'; return; }
  if(!meio){ errEl.textContent='Indique o meio (Físico, E-Mola, M-Pesa, M-Kesh, etc.).'; return; }
  const valor = Number(valorRaw)||0;
  const entradas = (r.entradas||[]).slice();
  const saidas = (r.saidas||[]).slice();
  (tipo==='entradas'?entradas:saidas).push({origem, valor, obs, meio});
  const A = r.subtotalA||0;
  const B = rcSomaItens(entradas);
  const C = rcSomaItens(saidas);
  const D = A+B, E = C, F = D-E, G = r.saldoDepositadoG||0, H = F-G;
  state.relatoriosCaixa[idx] = Object.assign({}, r, {
    entradas, saidas, subtotalB:B, subtotalC:C, totalPositivoD:D, totalSaidasE:E, saldoFinalF:F, remanescenteH:H
  });
  saveState();
  audit('action','relatorioCaixa',id,`Nova ${tipo==='entradas'?'entrada':'saída'} registada`,`${origem} (${meio}): ${fmtMT(valor)}`);
  closeModal();
  showToast(`${tipo==='entradas'?'Entrada':'Saída'} registada.`,'success');
  verRelatorioCaixa(id);
}

/* ── Registo rápido do depósito (sem autorização, só enquanto o caixa está aberto) ──
   Permite ao próprio caixa (ou ao administrador) registar, a partir do telemóvel, o valor
   que foi depositado no banco/agente no fim do dia. Tal como as entradas/saídas rápidas,
   isto não conta como "editar algo já registado" — só actualiza o campo G e recalcula o
   Remanescente (H). O comprovativo (foto tirada no telemóvel) pode ser anexado a seguir,
   na secção "Anexos" do relatório. */
function formRcRegistarDeposito(id){
  const r=(state.relatoriosCaixa||[]).find(x=>x.id===id); if(!r) return;
  if(!rcPodeRegistarRapido(r)){
    if(r.status!=='aberto') showToast('Este caixa está fechado. Peça autorização ao administrador para alterar o depósito.','error');
    else showToast('Só quem abriu este caixa (ou o administrador) pode registar o depósito.','error');
    return;
  }
  openModal(`
    <p class="modal-title">Registar depósito</p>
    <p class="modal-sub">Valor entregue no banco, agente M-Pesa/E-Mola, cofre, etc. Pode ajustar sempre que fizer um novo depósito, enquanto o caixa estiver aberto.</p>
    <div class="form-row"><label>Valor depositado (MT)</label><input id="rcd-valor" type="number" min="0" step="0.01" placeholder="0.00 MT" value="${r.saldoDepositadoG??''}"></div>
    <div class="form-row"><label>Onde/como foi depositado (opcional)</label><input id="rcd-obs" placeholder="Ex: Banco BCI, agência da Baixa · M-Pesa agente 84xxxx" value="${esc(r.depositoObs||'')}"></div>
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 4px;">💡 Depois de guardar, tire uma foto do talão/comprovativo com o telemóvel e anexe-a abaixo em "Anexos".</p>
    <p id="rcd-err" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:4px 0;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();verRelatorioCaixa('${id}')">Cancelar</button>
      <button class="btn btn-primary" data-acao="criar" onclick="salvarRcDeposito('${id}')">Guardar depósito</button>
    </div>`);
}

function salvarRcDeposito(id){
  const idx=(state.relatoriosCaixa||[]).findIndex(x=>x.id===id);
  if(idx===-1) return;
  const r = state.relatoriosCaixa[idx];
  if(!rcPodeRegistarRapido(r)){
    showToast('Sem permissão para registar o depósito aqui.','error');
    closeModal();
    return;
  }
  const valorRaw = document.getElementById('rcd-valor').value;
  const obs = document.getElementById('rcd-obs').value.trim();
  const errEl = document.getElementById('rcd-err');
  if(valorRaw===''){ errEl.textContent='Preencha o valor depositado.'; return; }
  const G = Number(valorRaw)||0;
  const F = r.saldoFinalF||0;
  const H = F-G;
  state.relatoriosCaixa[idx] = Object.assign({}, r, { saldoDepositadoG:G, depositoObs:obs, remanescenteH:H });
  saveState();
  audit('action','relatorioCaixa',id,'Depósito registado',`${fmtMT(G)}${obs?' · '+obs:''}`);
  closeModal();
  showToast('Depósito registado. Não se esqueça de anexar o comprovativo.','success');
  verRelatorioCaixa(id);
}

function formPedirEdicaoCaixa(id){
  const r=(state.relatoriosCaixa||[]).find(x=>x.id===id); if(!r) return;
  openModal(`
    <p class="modal-title">Pedir autorização para editar</p>
    <p class="modal-sub">O administrador vai rever o pedido. Só depois de aprovado poderá editar — e a edição fica registada como uma nova via, lado a lado com a original.</p>
    <div class="form-row"><label>Motivo do pedido</label><textarea id="pc-motivo" rows="3" placeholder="Explique porque precisa de corrigir este relatório..."></textarea></div>
    <p id="pc-err" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:4px 0;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal();verRelatorioCaixa('${id}')">Cancelar</button>
      <button class="btn btn-primary" onclick="enviarPedidoEdicaoCaixa('${id}')">Enviar pedido</button>
    </div>`);
}

function enviarPedidoEdicaoCaixa(id){
  if(naoPodeEditar('relatorios')){ showToast('Sem permissão.','error'); return; }
  const motivo = document.getElementById('pc-motivo').value.trim();
  const errEl = document.getElementById('pc-err');
  if(!motivo){ errEl.textContent='Descreva o motivo do pedido.'; return; }
  const idx=(state.relatoriosCaixa||[]).findIndex(x=>x.id===id);
  if(idx===-1) return;
  const solicitante = currentPerfil?.nome || currentUser?.email || '—';
  state.relatoriosCaixa[idx] = Object.assign({}, state.relatoriosCaixa[idx], {
    pedido: { status:'pendente', motivo, solicitadoPor:solicitante, solicitadoEm:new Date().toISOString(), decididoPor:null, decididoEm:null }
  });
  saveState();
  audit('action','relatorioCaixa',id,'Pedido de edição solicitado',`Por: ${solicitante} · Motivo: ${motivo}`);
  closeModal();
  showToast('Pedido enviado ao administrador.','success');
  verRelatorioCaixa(id);
}

function decidirPedidoEdicaoCaixa(id, aprovar){
  if(!isAdmin()) return;
  const idx=(state.relatoriosCaixa||[]).findIndex(x=>x.id===id);
  if(idx===-1) return;
  const r = state.relatoriosCaixa[idx];
  if(!r.pedido || r.pedido.status!=='pendente') return;
  const adminNome = currentPerfil?.nome || currentUser?.email || 'Administrador';
  state.relatoriosCaixa[idx] = Object.assign({}, r, {
    pedido: Object.assign({}, r.pedido, { status: aprovar?'aprovado':'negado', decididoPor:adminNome, decididoEm:new Date().toISOString() })
  });
  saveState();
  audit('action','relatorioCaixa',id,`Pedido de edição ${aprovar?'aprovado':'recusado'}`,`Por: ${adminNome}`);
  showToast(aprovar?'Pedido aprovado. A pessoa já pode editar — ficará registado como uma nova via.':'Pedido recusado.', aprovar?'success':'');
  verRelatorioCaixa(id);
}

function imprimirRelatorioCaixa(id){

  const viaLabel = (r.viaNumero||1)>1 ? `${r.viaNumero}ª Via` : 'Original';
  const siLinhas=[
    ...(r.saldoInicial.fixos||[]).map(i=>`<tr><td>${esc(i.meio)}${i.obs?' · '+esc(i.obs):''}</td><td class="num">${fmtMT(i.valor)}</td></tr>`),
    ...(r.saldoInicial.outros||[]).map(i=>`<tr><td>${esc(i.descricao)}${i.obs?' · '+esc(i.obs):''}</td><td class="num">${fmtMT(i.valor)}</td></tr>`)
  ];
  const linhasHtml=(itens)=>(itens||[]).map(i=>`<tr><td>${esc(i.origem||'—')}${i.obs?' · '+esc(i.obs):''}</td><td>${esc(i.meio||'—')}</td><td class="num">${fmtMT(i.valor)}</td></tr>`);
  const secao=(titulo,total,linhas,headers)=>`
    <div class="psec">${titulo}<span class="num">${fmtMT(total)}</span></div>
    ${printLinhasTable(headers||[{label:'Descrição'},{label:'Meio'},{label:'Valor (MT)',num:true}], linhas)}`;
  const saldosMeioPdf = rcSaldosPorMeio(r.saldoInicial.fixos, r.saldoInicial.outros, r.entradas, r.saidas);
  const saldosMeioHtml = `
    <div class="psec">Saldo actual por meio${r.status==='aberto'?' (caixa ainda aberto)':''}</div>
    ${printLinhasTable([{label:'Meio'},{label:'Saldo (MT)',num:true}], saldosMeioPdf.map(s=>`<tr><td>${esc(s.meio)}</td><td class="num">${fmtMT(s.saldo)}</td></tr>`))}`;
  const okH = Math.abs(r.remanescenteH)<0.01;
  const totaisHtml = `
    <div class="ptotais">
      <div class="row"><span>Sub-total A · Saldo Inicial</span><span class="num">${fmtMT(r.subtotalA)}</span></div>
      <div class="row"><span>Sub-total B · Entradas</span><span class="num">${fmtMT(r.subtotalB)}</span></div>
      <div class="row"><span>Sub-total C · Saídas</span><span class="num">${fmtMT(r.subtotalC)}</span></div>
      <div class="row strong"><span>Total Positivo (D = A+B)</span><span class="num">${fmtMT(r.totalPositivoD)}</span></div>
      <div class="row"><span>Total das Saídas (E = C)</span><span class="num">${fmtMT(r.totalSaidasE)}</span></div>
      <div class="row strong"><span>Saldo Final (F = D−E)</span><span class="num">${fmtMT(r.saldoFinalF)}</span></div>
      <div class="row strong"><span>Saldo Depositado (G)</span><span class="num">${fmtMT(r.saldoDepositadoG)}</span></div>
      <div class="row strong"><span>Remanescente (H = F−G)</span><span class="num" style="color:${okH?'#2F8F6B':'#C0392B'};">${fmtMT(r.remanescenteH)}</span></div>
      ${r.depositoObs?`<div class="row" style="font-size:10px;color:#666;"><span>Onde/como foi depositado</span><span>${esc(r.depositoObs)}</span></div>`:''}
    </div>`;
  const html = `
    ${printHeaderHtml('Relatório de Caixa', `${fmtData(r.data)} · ${viaLabel}`)}
    <div class="pinfo">
      <div><label>Data</label><span>${fmtData(r.data)}</span></div>
      <div><label>Operador</label><span>${esc(r.operador||'—')}</span></div>
      <div><label>Local</label><span>${esc(r.local||'—')}</span></div>
      <div><label>Estado</label><span>${r.status==='aberto'?'Aberto':'Fechado'}${(r.viaNumero||1)>1?' · '+viaLabel:''}</span></div>
    </div>
    ${secao('Saldo Inicial', r.subtotalA, siLinhas, [{label:'Descrição'},{label:'Valor (MT)',num:true}])}
    ${secao('Entradas', r.subtotalB, linhasHtml(r.entradas))}
    ${secao('Saídas', r.subtotalC, linhasHtml(r.saidas))}
    <div class="psec">Saldos</div>
    ${totaisHtml}

    ${(r.assinaturaCaixa||r.assinaturaMonitor)?`<div class="psec">Confirmação</div>
    ${printLinhasTable([{label:'Função'},{label:'Nome'}],[

    ])}`:''}

      <div><div class="sname">${esc(r.operador||'')}</div><div class="sline">Assinatura do Caixa</div></div>
      <div><div class="sname"></div><div class="sline">Visto do Superior Hierárquico</div></div>
    </div>
    ${printFooterHtml()}`;
  printDoc(html);
}

function compararViasCaixa(grupoId){
  const vias = rcVias(grupoId);
  if(vias.length<2){ showToast('Este relatório só tem uma via.',''); return; }
  const linhas = [
    ['Data', r=>fmtData(r.data)],
    ['Operador', r=>esc(r.operador||'—')],
    ['Local', r=>esc(r.local||'—')],
    ['Saldo Inicial (A)', r=>fmtMT(r.subtotalA)],
    ['Entradas (B)', r=>fmtMT(r.subtotalB)],
    ['Saídas (C)', r=>fmtMT(r.subtotalC)],
    ['Saldo Final (F)', r=>fmtMT(r.saldoFinalF)],
    ['Depositado (G)', r=>fmtMT(r.saldoDepositadoG)],
    ['Remanescente (H)', r=>fmtMT(r.remanescenteH)],
    ['Nº de entradas', r=>String((r.entradas||[]).length)],
    ['Nº de saídas', r=>String((r.saidas||[]).length)],
    ['Assinatura do Caixa', r=>esc(r.assinaturaCaixa||'—')],
    ['Assinatura do Monitor', r=>esc(r.assinaturaMonitor||'—')],
    ['Notas', r=>esc(r.notas||'—')],
  ];
  const headerHtml = vias.map(v=>`<th>${(v.viaNumero||1)>1?v.viaNumero+'ª Via':'Original'}<br><span style="font-weight:400;color:var(--text-muted);font-size:11px;">${v.criadoPor?esc(v.criadoPor):''}</span></th>`).join('');
  const rowsHtml = linhas.map(([label,fn])=>{
    const valores = vias.map(v=>fn(v));
    const difere = new Set(valores).size>1;
    return `<tr><td style="font-weight:700;">${label}</td>${valores.map(v=>`<td class="num" style="${difere?'background:var(--amber-100);font-weight:700;':''}">${v}</td>`).join('')}</tr>`;
  }).join('');
  openModal(`
    <p class="modal-title">Comparar vias — Relatório de Caixa</p>
    <p class="modal-sub">Diferenças entre as vias realçadas a amarelo.</p>
    <div class="table-wrap"><table>
      <thead><tr><th></th>${headerHtml}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>
  `,true);
}

function apagarRelatorioCaixa(id){
  if(!isAdmin()){ showToast('Só o administrador pode apagar relatórios de caixa.','error'); return; }
  const r=state.relatoriosCaixa.find(x=>x.id===id);
  confirmAction('Apagar este relatório de caixa?',()=>{
    moverParaLixeira('relatorioCaixa', r, `Relatório de caixa eliminado: ${r?fmtData(r.data):'—'}${r&&r.operador?' · '+r.operador:''}`);
    state.relatoriosCaixa=state.relatoriosCaixa.filter(r=>r.id!==id);
    saveState(); closeModal(); renderContent();
    showToast('Relatório de caixa movido para a lata de lixo.','success');
  });
}

(async function init(){
  // Detecta (de forma preliminar) se o link é de recuperação de senha
  // (Supabase envia #access_token=...&type=recovery). Isto é só uma pista inicial:
  // o SDK do Supabase pode processar e limpar este hash da URL antes deste código
  // correr, por isso NÃO confiamos só nisto — ver o listener onAuthStateChange abaixo,
  // que é a fonte de verdade e é registado ANTES de qualquer outra verificação.
  let recuperacaoEmCurso = new URLSearchParams(window.location.hash.replace('#','')).get('type') === 'recovery';

  // Deteta erro vindo de um link de email expirado/já usado (Supabase devolve
  // #error=access_denied&error_code=otp_expired&error_description=... em vez de processar
  // o link). Sem isto, a app cai silenciosamente no ecrã de login normal e a pessoa fica
  // sem perceber porque é que "não aconteceu nada".
  (function tratarErroDoLink(){
    const hashParams = new URLSearchParams(window.location.hash.replace('#',''));
    const erro = hashParams.get('error') || hashParams.get('error_code');
    if(!erro) return;
    const desc = hashParams.get('error_description');
    const msg = /expired/i.test(desc||erro)
      ? 'Este link expirou ou já foi utilizado. Peça um novo link (ex: "Esqueceu a senha?") e abra-o assim que o receber.'
      : (desc ? decodeURIComponent(desc.replace(/\+/g,' ')) : 'Este link já não é válido. Peça um novo.');
    document.getElementById('login-error').textContent = msg;
    history.replaceState(null, '', window.location.pathname + window.location.search);
  })();

  function forcarEcraNovaSenha(){
    recuperacaoEmCurso = true;
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    mostrarPainelNovaSenha();
  }

  // Regista o listener de mudanças de estado de auth PRIMEIRO, antes de mais nada.
  // Assim nunca perdemos o evento PASSWORD_RECOVERY, mesmo que o SDK do Supabase já
  // tenha processado o link e criado a sessão antes de chegarmos aqui (era essa a
  // falha: a app podia abrir directamente porque a sessão de recuperação já existia
  // e era tratada como um login normal).
  _sb.auth.onAuthStateChange((event, session) => {
    if(event === 'PASSWORD_RECOVERY'){
      // Força sempre o ecrã de nova senha, mesmo que a app já tenha sido aberta.
      forcarEcraNovaSenha();
      return;
    }
    if(event === 'SIGNED_IN' && session && !recuperacaoEmCurso){
      currentUser = session.user;
      // Se o app ainda não está visível (ex: voltou de link de email)
      if(document.getElementById('app').style.display === 'none'){
        abrirApp();
      }
      return;
    }
    if(event === 'SIGNED_OUT'){
      currentUser = null; currentPerfil = null;
      clearInterval(pollingTimer);
      try{ _sb.removeAllChannels(); }catch(e){}
      document.getElementById('app').style.display='none';
      document.getElementById('login-screen').style.display='flex';
      mostrarPainelLogin();
    }
    if(event === 'TOKEN_REFRESHED' && session){
      currentUser = session.user;
    }
  });

  // Restaura token do Google Drive se voltou de redirect OAuth
  const driveRestored = gdriveRestoreToken();

  if(recuperacaoEmCurso){
    forcarEcraNovaSenha();
    return; // onAuthStateChange trata do resto
  }

  // Verifica se já existe sessão activa (token armazenado pelo SDK)
  const { data: { session } } = await _sb.auth.getSession();

  // Verificação de segurança extra: se, entretanto (de forma assíncrona), o evento
  // PASSWORD_RECOVERY já tiver disparado e marcado recuperacaoEmCurso, não abrimos a app.
  if(session && !recuperacaoEmCurso){
    currentUser = session.user;
    abrirApp();
    if(driveRestored){
      setTimeout(()=>{ showToast('Google Drive ligado com sucesso! ✓','success'); },800);
      if(sessionStorage.getItem('gdrive_pending_upload')){
        sessionStorage.removeItem('gdrive_pending_upload');
        setTimeout(()=>{ showToast('Pode agora adicionar o anexo novamente.',''); },2000);
      }
    }
  } else if(!recuperacaoEmCurso){
    document.getElementById('login-email').focus();
    if(driveRestored && sessionStorage.getItem('gdrive_pending_upload')){
      showToast('Drive autorizado. Faça login para continuar.','success');
    }
  }
})();
</script>
